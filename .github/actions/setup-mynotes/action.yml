name: MyNotes toolchain
description: Shared Java, Gradle cache and pinned SDK setup for the independent Notes project
inputs:
  sdk:
    description: Install pinned compile/build tools (false for pure JVM tests)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.event_name != 'push' }}
    - name: Cache pinned offline model downloads (build-time only)
      if: inputs.sdk == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/mynotes-models
        key: mynotes-models-${{ hashFiles('mynotes/runtime/src/main/assets/voice/model.json') }}
    - name: Pinned Android SDK
      if: inputs.sdk == 'true'
      shell: bash
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
    - name: Verify source-pinned trained model export (build-time only)
      if: inputs.sdk == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import json,subprocess
        artifact=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13124627967']))
        assert artifact['workflow_run']['head_sha']=='2373ce10c71223f210fd4e1536b6ff1118c99afd'
        assert artifact['digest']=='sha256:86899e08eafa46c167c06a88e2d5428b38dff14897d656e6824f2715d5a54d50'
        assert not artifact['expired'],'Trained export expired; regenerate from preserved actual blocks, never substitute base weights'
        PY
    - uses: actions/download-artifact@v8.0.2
      if: inputs.sdk == 'true'
      with:
        github-token: ${{ github.token }}
        run-id: 41409413622
        name: trained-whisper-android-offline
        path: ${{ runner.temp }}/trained-whisper-export
    - name: Bundle verified trained CPU model and pinned native toolchain
      if: inputs.sdk == 'true'
      shell: bash
      run: |
        python3 -m mynotes.tools.models.bundle_trained_whisper --source "$RUNNER_TEMP/trained-whisper-export" --output mynotes/runtime/build/generated/trained-whisper-assets
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        "$SDK/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'cmake;3.22.1'
