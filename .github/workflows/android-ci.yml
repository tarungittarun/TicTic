name: Android CI

# Build signal for MySpace / TicTic. This is the ONLY way the project is
# compiled and packaged: the review workspace has no JDK or Android SDK and
# cannot reach services.gradle.org or dl.google.com.

on:
  push:
    branches: ['arena/3caca636-tictic', myspace, main]
  pull_request:
  workflow_dispatch:

permissions:
  # write so the build job can commit the APK into artifacts/ for on-device testing
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python source contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-contract suite
        run: python3 -m unittest discover -s qa -v

  build:
    name: assembleDebug
    runs-on: ubuntu-24.04
    needs: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the publish step pushes a commit back to this branch, and pushing
          # from a shallow clone fails.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          sh gradlew --version || true

      - name: Install any missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-

      - name: Unit tests (all modules)
        id: unit
        continue-on-error: true
        shell: bash
        # assembleDebug does NOT run test tasks, so without this step the JVM
        # regression suite (TimeMathTest and the :core-domain rules) would never
        # execute in CI. This matters because there is no local Android build:
        # CI is the only place these run against real compiled classes.
        # tee + pipefail keep gradlew's real exit status while capturing output
        # for the annotation step below.
        run: |
          set -o pipefail
          sh gradlew --no-daemon --stacktrace test 2>&1 | tee /tmp/unit.log

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sh gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      - name: Surface compile and test errors as annotations
        if: steps.unit.outcome == 'failure' || steps.build.outcome == 'failure'
        shell: bash
        # WHY THIS STEP EXISTS: run logs and artifacts are not downloadable from
        # the review sandbox -- results-receiver.actions.githubusercontent.com and
        # the artifact blob host both EOF, so `gh run view --log` and
        # `gh run download` are dead ends. A red run therefore used to report only
        # pass/fail, with no clue what failed, which made every blind iteration
        # cost a full guess-and-check cycle.
        #
        # Check-run annotations ARE plain API objects, retrievable with:
        #   gh api repos/{owner}/{repo}/check-runs/{job_id}/annotations
        # So re-emitting the error lines here turns CI back into a debuggable
        # loop. The final `exit 1` is what actually fails the job, since the two
        # build steps are continue-on-error.
        run: |
          for f in /tmp/unit.log /tmp/build.log; do
            [ -f "$f" ] || continue
            grep -nE "^e: |error:|Execution failed|What went wrong|FAILED|Caused by:|Test.* > |AssertionError|expected:" "$f" \
              | head -80 \
              | while IFS= read -r line; do
                  echo "::error title=$(basename "$f")::${line}"
                done
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MySpace-debug-apk
          # Globbed across modules: :app is meant to become a thin shell, and the
          # APK may move as the module graph grows.
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

      - name: Upload unit-test reports
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Lint (non-blocking while establishing a baseline)
        if: always()
        continue-on-error: true
        run: sh gradlew --no-daemon lint

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results.*
          if-no-files-found: ignore

      # The owner tests on a real device. Workflow artifacts are only reachable from the
      # Actions UI and they expire, and they cannot be fetched from the review sandbox at all.
      # artifacts/ is where this repository has always kept installable debug builds with a
      # SHA-256 sidecar and an index, so the APK is committed there instead. Guarded on the
      # target file not already existing: an APK differs byte-for-byte between builds with no
      # source change, so without the guard every re-run would commit identical content.
      - name: Publish the APK into artifacts/
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "versionName '[^']+'" app/build.gradle | head -1 | cut -d"'" -f2)
          CODE=$(grep -oE "versionCode [0-9]+" app/build.gradle | head -1 | awk '{print $2}')
          NAME="MySpace-v${VERSION}-${CODE}-lite-debug.apk"
          if [ -f "artifacts/$NAME" ]; then
            echo "$NAME is already published; nothing to do."
            exit 0
          fi
          # lite, deliberately: it is the build that can actually be sideloaded. Picking
          # whichever APK find reaches first would publish an uninstallable one half the time.
          BUILT=$(find . -path '*lite*' -path '*/build/outputs/apk/*' -name '*.apk' | head -1)
          if [ -z "$BUILT" ]; then echo "no APK was produced"; exit 1; fi
          cp "$BUILT" "artifacts/$NAME"
          sha256sum "artifacts/$NAME" | awk '{print $1}' > "artifacts/$NAME.sha256"
          SIZE=$(stat -c %s "artifacts/$NAME")
          HASH=$(cat "artifacts/$NAME.sha256")
          ROW="| ${VERSION} (build ${CODE}) | [Download APK](${NAME}) | ${SIZE} bytes | \`${HASH}\` |"
          LAST=$(grep -n '^| ' artifacts/APK-INDEX.md | tail -1 | cut -d: -f1)
          awk -v row="$ROW" -v last="$LAST" 'NR==last{print; print row; next} {print}' \
            artifacts/APK-INDEX.md > /tmp/index.md
          sed -e 's/^# TicTic debug APKs$/# MySpace debug APKs/' \
              -e 's/^Five retained debug APK versions\./Retained debug APK versions./' \
              /tmp/index.md > artifacts/APK-INDEX.md
          echo "staged $NAME ($SIZE bytes)"

      - name: Commit the published APK
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then
            echo "nothing to publish."
            exit 0
          fi
          git commit -m "Publish debug APK for on-device testing [skip ci]" -m "Committed into artifacts/, where this repository has always kept installable debug builds with a SHA-256 sidecar and an index, so the APK can be downloaded straight from github.com rather than only from the expiring Actions artifact."
          git push
