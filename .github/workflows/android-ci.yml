name: Android CI

# Build signal for MySpace / TicTic. This is the ONLY way the project is
# compiled and packaged: the review workspace has no JDK or Android SDK and
# cannot reach services.gradle.org or dl.google.com.

on:
  push:
    branches: ['arena/3caca636-tictic', myspace, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python source contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-contract suite
        run: python3 -m unittest discover -s qa -v

  build:
    name: assembleDebug
    runs-on: ubuntu-24.04
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report toolchain
        run: |
          set -x
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          sh gradlew --version || true

      - name: Install any missing SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-

      - name: Unit tests (all modules)
        # assembleDebug does NOT run test tasks, so without this step the JVM
        # regression suite (TimeMathTest and the :core-domain rules) would never
        # execute in CI. This matters because there is no local Android build:
        # CI is the only place these run against real compiled classes.
        run: sh gradlew --no-daemon --stacktrace testDebugUnitTest test

      - name: Build debug APK
        run: sh gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MySpace-debug-apk
          # Globbed across modules: :app is meant to become a thin shell, and the
          # APK may move as the module graph grows.
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

      - name: Upload unit-test reports
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Lint (non-blocking while establishing a baseline)
        if: always()
        continue-on-error: true
        run: sh gradlew --no-daemon lint

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results.*
          if-no-files-found: ignore
