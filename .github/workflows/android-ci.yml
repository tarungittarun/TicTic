name: Android CI

# Build signal for the TicTic suite. This is the ONLY way the project is
# compiled and packaged: the review workspace has no JDK/Android SDK and
# services.gradle.org + dl.google.com are unreachable from it.
#
# NOTE: gradlew is committed without the executable bit, so every invocation
# below uses `sh gradlew` rather than `./gradlew`.

on:
  push:
    branches: ['arena/3caca636-tictic', myspace, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python source contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-contract suite
        run: python3 -m unittest discover -s qa -v

  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-

      - name: Install Android SDK platform 34 / build-tools 34.0.0
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: sh gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TicTic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Lint (non-blocking while establishing a baseline)
        if: always()
        continue-on-error: true
        run: sh gradlew --no-daemon lint

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports/lint-results.*
          if-no-files-found: ignore
