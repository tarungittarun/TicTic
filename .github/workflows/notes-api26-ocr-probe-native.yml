name: Qualify unchanged consensus APK on API26 and API34
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-api26-ocr-probe-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    env:
      OCR_TEST_CLASS: app.space.notes.OfflineOcrTest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Require successful original-assertion gate and exact compiled source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 41777570980 --exit-status --interval 30
          test "$(gh run view 41777570980 --json headSha --jq .headSha)" = "52e8f19fcf7a5055828f98649b4a1a12ccfc43c6"
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41777570980
          name: api26-diagnostic-test-apk
          path: test-apk
      - name: Share one ephemeral debug signature without modifying app or test payloads
        run: |
          APP=$(find test-apk -name notes-debug.apk -print -quit)
          TEST=$(find test-apk -name '*androidTest.apk' -print -quit)
          python3 -m mynotes.tools.ci.resign_public_benchmark_apks "$APP" "$TEST"
      - name: Enable KVM and installed emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash mynotes/tools/ci/run_api26_ocr_diagnostic.sh
      - name: Retain original assertion failure and expose bounded PUBLIC hypotheses
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          from mynotes.tools.ci.results import android
          p=pathlib.Path('public-native-ocr-probe.json')
          if p.exists():
              r=json.loads(p.read_text())
              for row in r['cases']:
                  print('::notice title=Public native OCR probe, not production selection::'+json.dumps(row,ensure_ascii=False).replace('%','%25'))
          log=pathlib.Path('refinement-native.txt')
          result=android(log.read_text(errors='replace') if log.exists() else '',['app.space.notes.OfflineOcrTest#'+name for name in __import__('re').findall(r'@Test\s+public\s+void\s+(\w+)\(',pathlib.Path('mynotes/app/src/androidTest/java/app/space/notes/OfflineOcrTest.java').read_text())])
          pathlib.Path('original-assertion.json').write_text(json.dumps(result,indent=2)+'\n')
          print('::warning title=Full original OCR class outcome::'+json.dumps(result))
          if not result['ok']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: consensus-original-ocr-api${{ matrix.api }}
          path: |
            public-native-ocr-*
            ocr-common-text-report.json
            ocr-corpus-report.json
            original-assertion.json
            refinement-native*.txt
            diagnostic-bootstrap.txt
            benchmark-signing-proof.json
          if-no-files-found: error
          retention-days: 7
