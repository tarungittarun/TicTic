# Qualification iteration 4: deterministic recording conflict copies and note-link remapping.
name: MyNotes archive foundation (JVM only)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths:
      - '.github/workflows/notes-archive-foundation.yml'
permissions:
  contents: read
concurrency:
  group: notes-archive-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain:
    name: Bounded archive protocol and all domain rules
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
        with:
          sdk: 'false'
      - name: Execute complete pure JVM domain suite without building Android
        working-directory: mynotes
        run: ./gradlew :notes-domain:test --no-daemon --max-workers=2 --console=plain
      - name: Verify every discovered JVM method executed once without skips
        if: always()
        run: |
          python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/archive-jvm.json
          python3 - <<'PYCOUNTS'
          import json
          value=json.load(open('evidence/archive-jvm.json'))
          print('::notice title=Executed archive/domain coverage::'+str(value['passed'])+'/'+str(value['expected'])+' passed; missing='+str(len(value['missing']))+'; duplicates='+str(len(value['duplicates']))+'; failures='+str(len(value['failures'])))
          PYCOUNTS
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: notes-archive-foundation-jvm
          path: |
            mynotes/domain/build/test-results/test/
            evidence/archive-jvm.json
          if-no-files-found: warn
