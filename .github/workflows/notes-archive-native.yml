# Iteration 5: qualify compare-and-apply guards against stale libraries and changed storage.
name: MyNotes archive native foundations (nonpublishing)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-archive-native.yml']
permissions:
  contents: read
concurrency:
  group: notes-archive-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Compile debug app/instrumentation and lint without publication
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/archive-native-build.log
      - name: Bounded compiler and lint diagnostics in check annotations
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/archive-native-build.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive-foundation-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: archive-foundation-lint
          path: mynotes/app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: warn
  native:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archive-foundation-test-apks
          path: archive-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r archive-apks/debug/notes-debug.apk
            adb install -r archive-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell am instrument -w -r -e class app.space.notes.runtime.ArchiveSemanticTest,app.space.notes.RealFolderStorageTest#fullAudioArchiveReopensThroughRealSafAndInspectNeverMutatesLiveInbox,app.space.notes.RepositoryTransferTest#compareAndApplyRestoreKeepsLatestWriterAndPreviousCheckpoint,app.space.notes.RepositoryTransferTest#compareAndApplyRestoreCommitsOnlyMatchingLibraryAndStorage app.space.notes.debug.test/androidx.test.runner.AndroidJUnitRunner > archive-native.txt
      - name: Require every archive semantic case once with successful completion
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          from mynotes.tools.ci.results import android,write_report
          from mynotes.tools.ci.test_plan import build_plan
          cls='app.space.notes.runtime.ArchiveSemanticTest'
          expected=[cls+'#'+method for method in build_plan()['android'][cls]]
          expected.append('app.space.notes.RealFolderStorageTest#fullAudioArchiveReopensThroughRealSafAndInspectNeverMutatesLiveInbox')
          expected.extend('app.space.notes.RepositoryTransferTest#'+method for method in ['compareAndApplyRestoreKeepsLatestWriterAndPreviousCheckpoint','compareAndApplyRestoreCommitsOnlyMatchingLibraryAndStorage'])
          path=Path('archive-native.txt')
          result=android(path.read_text(errors='replace') if path.exists() else '',expected)
          write_report(result,'archive-native.json')
          print(json.dumps(result,indent=2))
          if not result['ok']: sys.exit(1)
          print('::notice title=Native archive semantics::'+str(result['passed'])+'/'+str(result['expected'])+' methods passed; no missing/skipped/duplicate methods')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: archive-native-api${{ matrix.api }}
          path: archive-native.*
          retention-days: 7
          if-no-files-found: warn
