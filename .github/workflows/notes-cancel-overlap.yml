name: Stop explicitly approved unintended Notes soak
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-cancel-overlap.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop-approved-soak:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the unintended soak approved by the user
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SESSION_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          run_id='40869247523'
          run=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+run_id]))
          if run['name']!='MyNotes extended native soak' or run['head_branch']!=os.environ['SESSION_BRANCH']:
              raise RuntimeError('Refusing to cancel an unexpected workflow or branch')
          if run['head_sha']!='19db0fdac0c015e10e980a695d700c15676daacc':
              raise RuntimeError('Refusing to cancel an unexpected source revision')
          if run['status']=='completed':
              print('Approved target already completed; no cancellation needed',run['conclusion'])
          else:
              print('Cancelling only approved unintended soak',run_id,flush=True)
              subprocess.run(['gh','run','cancel',run_id],check=True)
          PY
