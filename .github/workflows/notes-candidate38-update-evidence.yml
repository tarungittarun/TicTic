# Read only two completed synthetic upgrade reports. No Android build or release.
name: Preserve final38 exact-byte update evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate38-update-evidence.yml']
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - name: Require the exact completed successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41471791076']))
          assert run['head_sha']=='febbc3445fa7e741aaf2e3170ce5d12af28491e4'
          assert run['head_branch']=='arena/3caca636-tictic'
          assert run['status']=='completed' and run['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41471791076
          name: source-pinned-release33-to38-update-smoke
          path: reports/33-to38
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41471791076
          name: source-pinned-release35-to38-update-smoke
          path: reports/35-to38
      - name: Validate and retain only small synthetic JSON evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          dest=Path('mynotes/docs/design-2026-10-29/updates/41471791076')
          records=[]
          for old in (33,35):
              source=Path('reports')/(str(old)+'-to38')
              assert {p.name for p in source.iterdir()}=={'release-apks.json','release-update-smoke.json'}
              report=json.loads((source/'release-update-smoke.json').read_text())
              apks=json.loads((source/'release-apks.json').read_text())
              assert report['ok'] is True and report['package']=='app.space.notes' and report['api']==34
              assert report['from']['version_code']==old and report['to']['version_code']==38
              assert report['from']['first_install_time']==report['to']['first_install_time']
              assert report['old_release_cold_restart_checked'] is True and report['notes_and_doc_retained'] is True
              assert report['uninstall_or_clear_data'] is False and report['release_approval'] is False
              assert apks['old']['version_code']==old and apks['candidate']['version_code']==38
              assert apks['candidate']['artifact_id']==13155455677 and apks['candidate']['source_run']==41469717511
              assert apks['candidate']['source_sha']=='62c3c22b827c46dcc1a3c4af56c907f6f27015b2'
              assert apks['candidate']['sha256']=='d0285d28318211854cb175bfb983f3f3c1f8180bc8d4106349ee2dd35c2ff3c7'
              target=dest/(str(old)+'-to38');target.mkdir(parents=True,exist_ok=True)
              for name in ('release-apks.json','release-update-smoke.json'):
                  file=source/name;assert 0<file.stat().st_size<20000
                  shutil.copyfile(file,target/name)
                  records.append({'path':str(target/name),'sha256':hashlib.sha256(file.read_bytes()).hexdigest()})
          (dest/'provenance.json').write_text(json.dumps({'run_id':41471791076,'source_sha':'febbc3445fa7e741aaf2e3170ce5d12af28491e4','release_approval':False,'scope':'Two public ASCII Note/Doc fixtures on each of33→38 and35→38; not physical or exhaustive rich-library migration. Upgrade harness uses force-stop cold restarts, unlike the separate actual process-death probe.','files':records},indent=2)+'\n')
          print('::notice title=Exact-byte update evidence::33-to38 and35-to38 both passed two synthetic Note/Doc fixtures; no uninstall/clear-data, no physical or exhaustive migration claim')
          PY
      - name: Gate and commit only synthetic evidence to the session branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/design-2026-10-29/updates/41471791076
          git commit -m 'Retain final38 exact-byte33 and35 install-over evidence, synthetic scope only [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
            git diff --check
          done
