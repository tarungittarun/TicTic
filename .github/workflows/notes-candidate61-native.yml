# Original two failed provisioning jobs retained. Native-only replay after proven
# disk exhaustion repair; exact already-built candidate61 APKs, no app rebuild.
name: Candidate61 native-only disk repair qualification
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate61-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mynotes/tools
            mynotes/app/src/androidTest
      - name: Verify original candidate61 foundation identity before reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json,subprocess
          a=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13292844719']))
          assert not a['expired']
          assert a['workflow_run']['head_sha']=='a3833061a4888d6f831f8fed7146425a12fe9a67'
          assert a['digest']=='sha256:3012a4bbdab4d3e39200aba174b704f304b81b0cdf128b5fa1ec088e54de7b44'
          CHECK
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41767304608
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate runner emulator and avoid unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home
            adb shell am start -W -n app.space.notes.debug/app.space.notes.NotesActivity
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e class app.space.notes.OfflineOcrTest,app.space.notes.OfflineSpeechTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.runtime.NotesMotionTest,app.space.notes.runtime.ImageRegionTextTest
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.OfflineOcrTest,app.space.notes.OfflineSpeechTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.runtime.NotesMotionTest,app.space.notes.runtime.ImageRegionTextTest
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - name: Require all native pilot assertions even after emulator failure
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.OfflineOcrTest,app.space.notes.OfflineSpeechTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.runtime.NotesMotionTest,app.space.notes.runtime.ImageRegionTextTest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-native-${{ matrix.id }}-ordered
          path: |
            refinement-captures.tar
            refinement-native.*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn

