# Exactly one previously unexecuted voice lane; no repeated passing lanes or APK build.
name: Candidate61 missing voice lane after disk repair
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate61-voice-repair.yml']
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait-voice0, night: 'no', orientation: portrait, workload: voice0}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mynotes/tools
            mynotes/app/src/androidTest
      - name: Verify original candidate61 foundation identity before reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json,subprocess
          a=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13292844719']))
          assert not a['expired']
          assert a['workflow_run']['head_sha']=='a3833061a4888d6f831f8fed7146425a12fe9a67'
          assert a['digest']=='sha256:3012a4bbdab4d3e39200aba174b704f304b81b0cdf128b5fa1ec088e54de7b44'
          CHECK
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41767304608
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preflight runner emulator without unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home
            adb shell am start -W -n app.space.notes.debug/app.space.notes.NotesActivity
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_module_benchmark.sh ${{ matrix.workload }} ${{ matrix.night }} ${{ matrix.orientation }}
      - name: Require exact executed assertions and all 402 retained measurements
        if: always()
        run: |
          python3 - <<'CHECK'
          import json,tarfile,pathlib
          from mynotes.tools.ci.results import android
          expected=['app.space.notes.EnvironmentQualificationTest#'+m for m in ['fontScaleMatchesRequestedLane','orientationMatchesRequestedLane','nightResourcesMatchRequestedLane']]+['app.space.notes.ModuleCorpusBenchmark#publicVoiceCorpusMeasuresTranscriptsDurationsAndPreservation']
          log=pathlib.Path('refinement-native.txt')
          result=android(log.read_text(errors='replace') if log.exists() else '',expected)
          assert result['ok'],result
          with tarfile.open('module-benchmark.tar') as archive:
              member=archive.getmember('module-benchmark/voice-0.json')
              assert member.size<4_000_000
              report=json.load(archive.extractfile(member))
          rows=report['cases']
          assert report['expected']==402 and len(rows)==402
          assert len({r['id'] for r in rows})==402
          assert all(r['status']=='OK' for r in rows)
          assert all(r.get('audio_unchanged') and r.get('transcript_roundtrip_and_dedup') for r in rows if r['kind']!='silence-control')
          summary={'scope':'Supplemental unchanged candidate61 lane; original failed run remains failed. Not physical acceptance.', 'source_run':41767304608,'repaired_job':126370468181,'measurements':402,'accuracy_targets_met':sum(r['accuracy_target_met'] for r in rows),'models_changed':False}
          pathlib.Path('supplemental-evidence.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('::notice title=Supplemental voice evidence::'+json.dumps(summary))
          CHECK
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-benchmark-${{ matrix.id }}
          path: |
            module-benchmark.tar
            module-execution.json
            supplemental-evidence.json
            refinement-native.txt
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn
