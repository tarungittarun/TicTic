name: Correct split-capture report provenance without repeating app tests
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate63-composite-provenance.yml']
permissions:
  contents: read
  actions: read
jobs:
  report:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Fetch exact compiled source tree for independent inventory, never rebuild
        run: |
          git fetch --no-tags --depth=1 origin 3aa67629e1f1748531f348308aa53e833b2becc7
          git cat-file -e 3aa67629e1f1748531f348308aa53e833b2becc7^{tree}
      - name: Wait for remaining OCR capture and preserve its original report attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 41788513984 --exit-status --interval 45 || true
          gh api repos/tarungittarun/TicTic/actions/runs/41788513984/jobs --jq '.jobs[] | select(.name=="benchmark (light-portrait-ocr, no, portrait)") | .conclusion' | grep -x success
      - name: Independently verify original failures were only two zero-test boot timeouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch 41784134085 --exit-status --interval 45
          set -e
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+path]))
          run=api('actions/runs/41784134085');assert run['conclusion']=='failure' and run['head_sha']=='3aa67629e1f1748531f348308aa53e833b2becc7'
          jobs=api('actions/runs/41784134085/jobs?per_page=100')['jobs'];failed=[j for j in jobs if j['conclusion']=='failure']
          expected={126424174973:'light-portrait-ocr',126424175245:'dark-landscape-ocr'}
          assert {j['id'] for j in failed}==set(expected),[(j['name'],j['conclusion']) for j in failed]
          entries=[]
          for job in failed:
              annotations=api('check-runs/'+str(job['id'])+'/annotations')
              assert any(a['message']=='Timeout waiting for emulator to boot.' for a in annotations)
              entries.append({'job':job['id'],'lane':expected[job['id']],'conclusion':job['conclusion'],'boot_timeout_verified':True,'tests_executed':0})
          names=[a['name'] for a in api('actions/runs/41784134085/artifacts?per_page=100')['artifacts']]
          prior=api('actions/runs/41787131044/jobs?per_page=100')['jobs'];assert next(j for j in prior if j['id']==126431724775)['conclusion']=='success'
          captures={'light-portrait-ocr':41788513984,'dark-landscape-ocr':41787131044}
          receipt={'source':run['head_sha'],'original_source':run['head_sha'],'build_run':41784134085,'original_conclusion':'failure','original_failed_jobs':entries,'original_artifact_names':names,'missing_lanes':list(expected.values()),'lane_capture_runs':captures,'prior_setup_failure':{'run':41787131044,'job':126431724513,'tests_executed':0,'retained_cause_run':41788213312,'cause':'External Pixel HOME never stable before Notes tests'},'report_provenance_correction_run':int(os.environ['GITHUB_RUN_ID']),'foundation_artifact':13300687412,'foundation_digest':'sha256:802d35267e093f95517b2bf85d696a63d0d21b95f448402767a24e216e2ff7e0'}
          pathlib.Path('boot-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          pattern: module-native-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          pattern: module-benchmark-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          name: module-foundation-lint
          path: module-artifacts/foundation
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41787131044
          name: module-benchmark-dark-landscape-ocr
          path: module-artifacts/module-benchmark-dark-landscape-ocr
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41788513984
          name: module-benchmark-light-portrait-ocr
          path: module-artifacts/module-benchmark-light-portrait-ocr
      - name: Build explicit composite report, never relabel original workflow
        run: |
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          python3 -m mynotes.tools.ci.build_boot_supplement_report --artifacts module-artifacts --output mynotes/docs/module-e2e/41788513984 --receipt boot-receipt.json --run ${{ github.run_id }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: candidate63-explicit-composite-report
          path: mynotes/docs/module-e2e/41788513984
          retention-days: 7
          if-no-files-found: error
      - name: Gate and preserve composite on this branch only
        run: |
          set -euo pipefail
          git checkout -B arena/3caca636-tictic "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/module-e2e/41788513984
          git commit -m 'Correct composite screenshot provenance without repeating any app tests [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
