name: Candidate63 missing OCR boot lanes, exact compiled APKs and explicit composite report
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate63-ocr-boot-supplement.yml']
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait-ocr, night: 'no', orientation: portrait}
          - {id: dark-landscape-ocr, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact original source and foundation identity, never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          a=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13300687412']))
          assert not a['expired'] and a['workflow_run']['head_sha']=='3aa67629e1f1748531f348308aa53e833b2becc7'
          assert a['workflow_run']['id']==41784134085 and a['digest']=='sha256:802d35267e093f95517b2bf85d696a63d0d21b95f448402767a24e216e2ff7e0'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and retain emulator preflight
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash mynotes/tools/ci/use_installed_emulator.sh 2>&1 | tee emulator-preflight.txt
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home
            adb shell am start -W -n app.space.notes.debug/app.space.notes.NotesActivity
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_module_benchmark.sh ocr ${{ matrix.night }} ${{ matrix.orientation }}
      - name: Preserve bounded bootstrap evidence even if no test starts
        if: always()
        run: |
          { timeout 10s adb devices -l; timeout 10s adb shell getprop sys.boot_completed; timeout 10s adb logcat -d -t 150; } > emulator-bootstrap.txt 2>&1 || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-benchmark-${{ matrix.id }}
          path: |
            module-benchmark.tar
            module-execution.json
            refinement-native.txt
            refinement-environment-*
            emulator-preflight.txt
            emulator-bootstrap.txt
          retention-days: 7
          if-no-files-found: error
  report:
    needs: benchmark
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Independently verify original failures were only two zero-test boot timeouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch 41784134085 --exit-status --interval 45
          set -e
          python3 - <<'PY'
          import json,pathlib,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+path]))
          run=api('actions/runs/41784134085');assert run['conclusion']=='failure' and run['head_sha']=='3aa67629e1f1748531f348308aa53e833b2becc7'
          jobs=api('actions/runs/41784134085/jobs?per_page=100')['jobs'];failed=[j for j in jobs if j['conclusion']=='failure']
          expected={126424174973:'light-portrait-ocr',126424175245:'dark-landscape-ocr'}
          assert {j['id'] for j in failed}==set(expected),[(j['name'],j['conclusion']) for j in failed]
          entries=[]
          for job in failed:
              annotations=api('check-runs/'+str(job['id'])+'/annotations')
              assert any(a['message']=='Timeout waiting for emulator to boot.' for a in annotations)
              entries.append({'job':job['id'],'lane':expected[job['id']],'conclusion':job['conclusion'],'boot_timeout_verified':True,'tests_executed':0})
          names=[a['name'] for a in api('actions/runs/41784134085/artifacts?per_page=100')['artifacts']]
          receipt={'source':run['head_sha'],'original_source':run['head_sha'],'build_run':41784134085,'original_conclusion':'failure','original_failed_jobs':entries,'original_artifact_names':names,'missing_lanes':list(expected.values()),'foundation_artifact':13300687412,'foundation_digest':'sha256:802d35267e093f95517b2bf85d696a63d0d21b95f448402767a24e216e2ff7e0'}
          pathlib.Path('boot-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          pattern: module-native-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          pattern: module-benchmark-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          name: module-foundation-lint
          path: module-artifacts/foundation
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: module-benchmark-*
          path: module-artifacts
      - name: Build explicit composite report, never relabel original workflow
        run: |
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          python3 -m mynotes.tools.ci.build_boot_supplement_report --artifacts module-artifacts --output mynotes/docs/module-e2e/${{ github.run_id }} --receipt boot-receipt.json --run ${{ github.run_id }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: candidate63-explicit-composite-report
          path: mynotes/docs/module-e2e/${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
      - name: Gate and preserve composite on this branch only
        run: |
          set -euo pipefail
          git checkout -B arena/3caca636-tictic "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/module-e2e/${{ github.run_id }}
          git commit -m 'Preserve explicit exact-build63 boot-supplement composite; original red run retained [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
