name: Complete missing API26 signed63 to64 update after pre-install service failure
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate64-update-api26.yml']
permissions:
  contents: read
  actions: read
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41784134085
          name: MyNotes-v0.63.0-63-development.apk
          path: old-apk
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41791806372
          name: MyNotes-v0.64.0-64-development.apk
          path: candidate-apk
      - name: Verify exact original and candidate identity, raw bytes and stable signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 - <<'PY'
          import json,hashlib,subprocess,os,pathlib
          specs=[('old',63,13300228797,41784134085,'3aa67629e1f1748531f348308aa53e833b2becc7','c7d8f1209fa7c47db81d6e60b1dd9cb176e27f02fbaf65ebcf7b0bd678d32d01'),('candidate',64,13303533229,41791806372,'4d0916eaca12c9cd285082356f67336ba536d593','27caf2627a6b4049994d3cc4ddcf6c4f9e497e3da0aa599ad277d8a826f092c6')]
          proof={};tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          for label,code,artifact,run,source,expected in specs:
              meta=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/'+str(artifact)]))
              assert meta['workflow_run']['id']==run and meta['workflow_run']['head_sha']==source and not meta['expired']
              files=list(pathlib.Path(label+'-apk').rglob('*.apk'));assert len(files)==1;apk=files[0]
              with apk.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
              assert digest==expected==meta['digest'].removeprefix('sha256:') and apk.stat().st_size==meta['size_in_bytes']
              cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(apk)],text=True);assert '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' in cert
              manifest=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
              assert "package: name='app.space.notes' versionCode='"+str(code)+"'" in manifest
              assert 'android.permission.INTERNET' not in manifest and "sdkVersion:'26'" in manifest
              proof[label]={'path':str(apk),'version_code':code,'sha256':digest,'source':source,'artifact':artifact}
          pathlib.Path('release-apks.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - name: Enable KVM and use verified installed emulator
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 -c 'import json,subprocess,sys; a=json.load(open("release-apks.json"));subprocess.run([sys.executable,"-m","mynotes.tools.ci.release_update_smoke","--old",a["old"]["path"],"--candidate",a["candidate"]["path"],"--old-code","63","--candidate-code","64","--output","release-update-smoke.json"],check=True)'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: release63-to64-api${{ matrix.api }}-public-update-evidence
          path: |
            release-apks.json
            release-update-smoke.json
          retention-days: 7
          if-no-files-found: error

# Original run41805650798 API34 passed. API26 failed at svc wifi disable (137)
# before installing either APK. Preserve it; qualify only the unexecuted lane
# on the lighter API26 AOSP image. No assertion failure is rerun or hidden.
  retain:
    needs: update
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Require original API34 success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tarungittarun/TicTic/actions/jobs/126491872721 --jq .conclusion | grep -x success
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41805650798
          name: release63-to64-api34-public-update-evidence
          path: update-evidence/api34
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release63-to64-api26-public-update-evidence
          path: update-evidence/api26
      - name: Verify and retain actual signed-update results, not full migration acceptance
        run: |
          python3 - <<'PYRETAIN'
          import json,os,pathlib,shutil
          dest=pathlib.Path('mynotes/docs/recognition/updates')/os.environ['GITHUB_RUN_ID'];dest.mkdir(parents=True)
          for api in (26,34):
              folder=pathlib.Path('update-evidence')/('api'+str(api));report=json.loads((folder/'release-update-smoke.json').read_text())
              assert report['api']==api and report['ok'] and report['notes_and_doc_retained'] and not report['uninstall_or_clear_data'] and not report['release_approval']
              assert report['from']['version_code']==63 and report['to']['version_code']==64
              assert report['from']['first_install_time']==report['to']['first_install_time']
              for name in ('release-update-smoke.json','release-apks.json'):
                  file=folder/name;assert 0<file.stat().st_size<20000;shutil.copyfile(file,dest/('api'+str(api)+'-'+name))
          (dest/'provenance.json').write_text(json.dumps({'report_run':os.environ['GITHUB_RUN_ID'],'api34_capture_run':41805650798,'api26_capture_run':os.environ['GITHUB_RUN_ID'],'original_failed_job':126491872011,'original_failure':'svc wifi disable exit137 before either APK installation','original_cause_log_run':41806094477,'scope':'Two public ASCII Note/Doc fixtures; cold restart and signed install-over. Not exhaustive rich-data migration or physical acceptance.','physical_acceptance':False},indent=2)+'\n')
          PYRETAIN
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m pip install PyYAML==6.0.3 Pillow==11.3.0
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/recognition/updates/${{ github.run_id }}
          git commit -m 'Preserve exact signed63 to64 public update checks on API26 and34; original boot attempt retained [skip ci]'
          git push origin arena/3caca636-tictic
