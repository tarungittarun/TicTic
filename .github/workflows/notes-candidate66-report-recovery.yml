name: Recover exact66 report from passing retained cohorts, no device reruns
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate66-report-recovery.yml']
permissions:
  contents: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Fetch original APK source tree and require every original device cohort passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin a267b05935b0272c05a0d9c525dfd5c6f3a17f6d --depth=1
          git cat-file -e 'a267b05935b0272c05a0d9c525dfd5c6f3a17f6d^{tree}'
          python3 - <<'PY'
          import json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41810449937/jobs?per_page=100'],text=True))
          native=[j for j in run['jobs'] if j['name'].startswith('native (')];bench=[j for j in run['jobs'] if j['name'].startswith('benchmark (')];focus=[j for j in run['jobs'] if j['name'].startswith('recognition_focus (')]
          assert len(native)==4 and len(bench)==12 and len(focus)==1
          assert all(j['conclusion']=='success' for j in native+bench+focus)
          print('::notice title=No device reruns::All four native and twelve corpus cohorts passed; only report source-tree availability is repaired.')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41810449937
          pattern: module-native-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41810449937
          pattern: module-benchmark-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41807474878
          name: module-foundation-lint
          path: module-artifacts/foundation
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41810449937
          name: continuation-provenance
          path: continuation-evidence
      - name: Rebuild actual module-ordered PDF with original source identity and separate exporter provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          python3 - <<'PY'
          import json,pathlib
          provenance=json.loads(pathlib.Path('continuation-evidence/continuation-provenance.json').read_text())
          assert provenance['apk_source']=='a267b05935b0272c05a0d9c525dfd5c6f3a17f6d' and provenance['app_rebuilt'] is False
          PY
          python3 -m mynotes.tools.build_module_e2e_report --artifacts module-artifacts --output mynotes/docs/module-e2e/41810449937 --source a267b05935b0272c05a0d9c525dfd5c6f3a17f6d --run 41810449937
          cp continuation-evidence/continuation-provenance.json mynotes/docs/module-e2e/41810449937/continuation-provenance.json
          python3 - <<'PY'
          import json,pathlib,os
          dest=pathlib.Path('mynotes/docs/module-e2e/41810449937');summary=json.loads((dest/'report-summary.json').read_text())
          assert summary['native_complete'] and summary['benchmark_complete']
          assert summary['native_methods']==429 and summary['native_outcomes']==1716 and summary['observed_inferences']==summary['expected_inferences']==4752
          assert summary['physical_acceptance'] is False and summary['model_changed'] is False
          (dest/'report-recovery-provenance.json').write_text(json.dumps({'capture_run':41810449937,'apk_source':'a267b05935b0272c05a0d9c525dfd5c6f3a17f6d','export_run':os.environ['GITHUB_RUN_ID'],'export_source':os.environ['GITHUB_SHA'],'original_failed_export_job':126518280390,'cause':'Original report shallow checkout lacked original APK source Git tree; fatal not a tree object before ingestion.','cause_reader_run':41813840646,'device_tests_repeated':False,'accuracy_targets_relabelled':False,'physical_acceptance':False},indent=2)+'\n')
          print('::notice title=Exact66 actual report::'+json.dumps({k:v for k,v in summary.items() if k!='module_order'}))
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: exact66-recovered-module-ordered-report
          path: mynotes/docs/module-e2e/41810449937
          retention-days: 7
      - name: Test and preserve original evidence on the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/module-e2e/41810449937
          git commit -m 'Preserve exact66 full module report; original exporter tree failure retained [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
