name: Preserve completed rich signed64 to66 retention without device reruns
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate66-rich-evidence.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Require both original successful update jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for job in 126519508722 126519509286; do
            gh api repos/tarungittarun/TicTic/actions/jobs/$job --jq .conclusion | grep -x success
          done
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41813371404
          pattern: release64-to66-api*-rich-public-update-evidence
          path: update-evidence
      - name: Bound, verify and retain original offline and signed-update proofs
        env:
          PYTHONPATH: .
        shell: python
        run: |
          import json,pathlib,shutil,os
          from mynotes.tools.ci.release_rich_update_probe import parse_proof
          dest=pathlib.Path('mynotes/docs/recognition/updates/41813371404');dest.mkdir(parents=True,exist_ok=True)
          expected={'old':(64,'27caf2627a6b4049994d3cc4ddcf6c4f9e497e3da0aa599ad277d8a826f092c6','4d0916eaca12c9cd285082356f67336ba536d593',13303533229),'candidate':(66,'3a2023ef33b675ccab26f70b8de683faea14dde11b81ca0c9635546adb40ec87','a267b05935b0272c05a0d9c525dfd5c6f3a17f6d',13311116366)}
          for api in (26,34):
              folder=pathlib.Path('update-evidence')/f'release64-to66-api{api}-rich-public-update-evidence'
              data={}
              for name in ('release-rich-update-proof.json','release-apks.json','offline-guest-proof.json'):
                  file=folder/name;assert 0<file.stat().st_size<20000;data[name]=json.loads(file.read_text())
              report=data['release-rich-update-proof.json'];assert report['api']==api and report['ok'] is True
              assert report['uninstall_or_clear_data'] is False and report['release_approval'] is False
              assert report['physical_acceptance'] is False and report['ui_rendering_acceptance'] is False
              assert report['from']['version_code']==64 and report['to']['version_code']==66
              assert report['from']['first_install_time']==report['to']['first_install_time']
              phases=report['phases'];assert [p['phase'] for p in phases]==['create','before','after']
              assert len({p['old_snapshot_sha256'] for p in phases})==1
              for phase,version in (('create',64),('before',64),('after',66)):
                  file=folder/f'rich-probe-{phase}.txt';assert 0<file.stat().st_size<100000
                  proof=parse_proof(file.read_text(),phase,version)
                  assert proof==next(p for p in phases if p['phase']==phase)
                  shutil.copyfile(file,dest/f'api{api}-rich-probe-{phase}.txt')
              for label,(code,sha,source,artifact) in expected.items():
                  identity=data['release-apks.json'][label]
                  assert (identity['version_code'],identity['sha256'],identity['source'],identity['artifact'])==(code,sha,source,artifact)
              offline=data['offline-guest-proof.json']
              for key in ('emulator_only','airplane_mode','wifi_disabled'):assert offline[key] is True
              for key in ('notes_installed','active_default_network','uninstall_or_clear_data'):assert offline[key] is False
              assert offline['consecutive_checks']>=3 and offline['final_shell_uid']==2000
              for name in data:shutil.copyfile(folder/name,dest/f'api{api}-{name}')
              print('::notice title=Original signed update proof::'+json.dumps(report))
          (dest/'provenance.json').write_text(json.dumps({'capture_run':41813371404,'retention_run':os.environ['GITHUB_RUN_ID'],'api26_job':126519508722,'api34_job':126519509286,'physical_acceptance':False,'release_approval':False,'scope':'Four public rich repository-generated fixtures; old writer, cold restart, signed64 to66 install-over and candidate write/readback. Not real microphone audio, SAF, UI rendering, exhaustive user libraries or physical acceptance.'},indent=2)+'\n')
      - name: Test before preserving proofs on the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m pip install PyYAML==6.0.3 Pillow==11.3.0
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/recognition/updates/41813371404
          git commit -m 'Retain exact old-writer rich signed64 to66 public payload proofs on API26 and34 [skip ci]'
          git push origin arena/3caca636-tictic
