# Extra animation-enabled emulator evidence; not physical smoothness acceptance or a speed-up claim.
name: Candidate67 animation-enabled long-distance reorder evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate67-animated-reorder.yml']
permissions:
  contents: read
  actions: read
jobs:
  animated_reorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41874321912
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate runner emulator and avoid unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am start -n app.space.notes.debug/app.space.notes.NotesActivity
            adb shell dumpsys gfxinfo app.space.notes.debug reset > animation-frame-reset.txt
            adb shell settings get global animator_duration_scale > animation-scale.txt
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e class app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards
            adb shell dumpsys gfxinfo app.space.notes.debug framestats > animation-frame-statistics.txt
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - name: Require all native pilot assertions even after emulator failure
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: animation-enabled-reorder-${{ matrix.id }}
          path: |
            animation-*.txt
            refinement-captures.tar
            refinement-native*
            refinement-native-*.json
            refinement-native-*.txt
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn
