# Diagnostic round2: repair initial button measurement found by unchanged rotation test; add long-distance drag, scope propagation and test-only OCR study.
# Intermediate build67 interaction diagnostics. NOT full 13-item acceptance; no distributable APK.
name: Candidate67 four-profile viewer and selection diagnostics
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate67-interactions.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: notes-interactions67-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Prepare public ground-truth evaluation corpus, verify original licenses and hashes
        run: |
          python3 -m mynotes.tools.ci.module_corpus --output mynotes/benchmarks/assets/module-corpus
          cp mynotes/docs/regression/ocr-heldout-v1.json mynotes/benchmarks/assets/module-corpus/ocr-heldout-v1.json
          cp -r mynotes/report-assets/public-ocr-scenes-v2 mynotes/benchmarks/assets/public-scenes-v2
      - name: Compile debug app/instrumentation and lint without publication
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug :notes:assembleRelease :notes:lintRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/refinement-native-build.log
      - name: Verify exact executed JVM coverage
        if: always()
        run: python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/refinement-jvm.json
      - name: Bounded compiler and lint diagnostics in check annotations
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/refinement-native-build.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: module-foundation-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - name: Enforce previous 155MB-class release budget and account for bytes
        run: |
          python3 -m mynotes.tools.ci.apk_size_audit mynotes/app/build/outputs/apk/release/notes-release.apk evidence/release-apk-size.json
          python3 - <<'PY'
          from pathlib import Path
          # Existing qualified release was 155,165,372 bytes. Allow at most 1MiB
          # for code/resources; never silently add tens of MB of new model assets.
          size=Path('mynotes/app/build/outputs/apk/release/notes-release.apk').stat().st_size
          assert size <= 156213948, f'Release APK exceeds bounded growth budget: {size}'
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-foundation-lint
          path: |
            mynotes/runtime/build/generated/trained-whisper-assets/voice/trained-whisper.json
            evidence/refinement-jvm.json
            evidence/release-apk-size.json
            mynotes/app/build/reports/lint-results-debug.*
            mynotes/benchmarks/assets/module-corpus/manifest.json
            mynotes/benchmarks/assets/module-corpus/*-COPYING.txt
          retention-days: 7
          if-no-files-found: warn
  interactions:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate runner emulator and avoid unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e class app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - name: Require all native pilot assertions even after emulator failure
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recognition-focused-${{ matrix.id }}
          path: |
            refinement-captures.tar
            refinement-native.*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn

  smallfont_study:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate runner emulator and avoid unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation portrait
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_smallfont_scene_study.sh
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recognition-focused-smallfont-study
          path: |
            small-font-paired-study.json
            public-scene-study.json
            smallfont-native-verified.json
            refinement-captures.tar
            refinement-native.*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn

  preserve_original_diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41827950030
          pattern: recognition-focused-*
          path: original-diagnostics
      - name: Retain original native failures and exact public evidence without rerunning them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,pathlib,subprocess,shutil,tarfile
          out=pathlib.Path('mynotes/docs/recognition/interactions/41827950030');out.mkdir(parents=True,exist_ok=True)
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+path],text=True))
          run=api('actions/runs/41827950030');assert run['head_sha']=='affcadbb8f12efc5e7bedaec343fc3f65a290110'
          jobs=api('actions/runs/41827950030/jobs?per_page=100')['jobs'];receipts=[]
          for folder in pathlib.Path('original-diagnostics').iterdir():
              if not folder.is_dir():continue
              dest=out/folder.name;dest.mkdir(exist_ok=True)
              for source in folder.iterdir():
                  if source.suffix in {'.txt','.json'} and source.stat().st_size<5000000:shutil.copyfile(source,dest/source.name)
              capture=folder/'refinement-captures.tar'
              if capture.exists():
                  with tarfile.open(capture) as bundle:
                      for member in bundle.getmembers():
                          if member.isfile() and pathlib.PurePosixPath(member.name).name in {'image-text-selection.png','word-synthetic-paper-page.png','spreadsheet-grid-viewport.png'}:
                              assert member.size<5000000
                              (dest/pathlib.PurePosixPath(member.name).name).write_bytes(bundle.extractfile(member).read())
              verified=json.loads((dest/'refinement-native-verified.json').read_text());receipts.append({'profile':folder.name,'verification':verified})
          assert len(receipts)==4
          for job in jobs:
              if job['name'].startswith('interactions'):
                  annotations=api(f"check-runs/{job['id']}/annotations");(out/(str(job['id'])+'-annotations.json')).write_text(json.dumps(annotations,indent=2)+'\n')
          target=next(job for job in jobs if job['name']=='interactions (light-portrait, no, portrait)')
          log=subprocess.check_output(['gh','api',f"repos/tarungittarun/TicTic/actions/jobs/{target['id']}/logs"])
          assert len(log)<10000000;(out/'original-light-portrait-job.log').write_bytes(log)
          (out/'provenance.json').write_text(json.dumps({'source':run['head_sha'],'run':run['id'],'jobs':jobs,'profiles':receipts,'tests_repeated':False,'full_acceptance':False,'physical_acceptance':False},indent=2)+'\n')
      - name: Root gate and retain on the session branch only
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          git checkout -B arena/3caca636-tictic
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/recognition/interactions/41827950030
          git commit -m 'Preserve original interaction diagnostic failures and public captures, not qualification [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
