name: Retain original candidate67 cancelled landscape diagnostics without rerunning assertions
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate67-landscape-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41876975461
          name: module-native-light-landscape-ordered
          path: actual-landscape
      - name: Preserve actual failed host and bounded raw diagnostics, never approve a cancelled profile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,pathlib,subprocess,shutil
          out=pathlib.Path('mynotes/docs/recognition/failures/41876975461-light-landscape');out.mkdir(parents=True,exist_ok=True)
          root='repos/tarungittarun/TicTic/'
          job=json.loads(subprocess.check_output(['gh','api',root+'actions/jobs/126746123067']))
          assert job['conclusion']=='cancelled'
          for source in pathlib.Path('actual-landscape').iterdir():
              assert source.is_file() and source.stat().st_size<=5000000
              if source.suffix in {'.txt','.json'}:shutil.copyfile(source,out/source.name)
          logs=subprocess.check_output(['gh','run','view','41876975461','--job','126746123067','--log'],timeout=90)
          assert len(logs)<=5000000
          (out/'original-job-log.txt').write_bytes(logs)
          annotations=json.loads(subprocess.check_output(['gh','api',root+'check-runs/126746123067/annotations']))
          (out/'provenance.json').write_text(json.dumps({'source':'acfd671d4afa4fceb09475cc6e70d1dabb77aefe','run':41876975461,'job':job,'annotations':annotations,'artifact':13351779319,'native_qualified':False,'tests_repeated':False,'physical_acceptance':False,'release_approval':False},indent=2)+'\n')
      - name: Root gate and retain actual diagnostics on the fixed branch
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/recognition/failures/41876975461-light-landscape
          git commit -m 'Preserve actual original cancelled landscape host diagnostics, no repeat or native approval [skip ci]'
          git push origin arena/3caca636-tictic
