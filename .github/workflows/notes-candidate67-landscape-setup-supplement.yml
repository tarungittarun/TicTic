# Original landscape never started native tests: svc power stayon stalled for62 minutes.
name: Candidate67 only missing landscape on exact original APK, bounded pre-native setup
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate67-landscape-setup-supplement.yml']
permissions:
  contents: read
  actions: read
jobs:
  missing_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-landscape, night: 'no', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - name: Require exact original APKs and independently verified pre-instrumentation host timeout
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json,subprocess,pathlib
          prior=subprocess.check_output(['gh','run','view','41890942364','--job','126787851381','--log'],timeout=90)
          pathlib.Path('prior-preflight-import-failure.txt').write_bytes(prior)
          assert b"ModuleNotFoundError: No module named 'mynotes'" in prior and b'MODULE 01/' not in prior
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+p]))
          artifact=api('actions/artifacts/13347602297')
          assert not artifact['expired'] and artifact['workflow_run']['id']==41876975461 and artifact['workflow_run']['head_sha']=='acfd671d4afa4fceb09475cc6e70d1dabb77aefe'
          assert artifact['digest']=='sha256:65a1312363456a8ccf087e9f7df60e9abf5e9358768f4e070cea15c17c0a49a1'
          from mynotes.tools.ci.pre_native_setup_evidence import verify,FILES
          p=pathlib.Path('mynotes/docs/recognition/failures/41876975461-light-landscape')
          assert {f.name for f in p.iterdir()}==FILES|{'provenance.json','original-job-log.txt'}
          proof=verify((p/'original-job-log.txt').read_text(),{n:(p/n).read_bytes() for n in FILES})
          job=api('actions/jobs/126746123067');assert job['conclusion']=='cancelled'
          raw=api('actions/artifacts/13351779319');assert raw['digest']=='sha256:852f2b7dba8d1f61dc392b0048eda8f78ff61c21f634aee9bd9f626a33c3edd4'
          assert raw['workflow_run']['head_sha']=='acfd671d4afa4fceb09475cc6e70d1dabb77aefe'
          pathlib.Path('original-pre-native-setup-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          subprocess.run(['git','fetch','origin','acfd671d4afa4fceb09475cc6e70d1dabb77aefe','--depth=1'],check=True)
          subprocess.run(['git','diff','--exit-code','acfd671d4afa4fceb09475cc6e70d1dabb77aefe','--','mynotes/app/src','mynotes/runtime/src','mynotes/domain/src','mynotes/app/build.gradle','mynotes/docs/module-e2e-method-order.json','mynotes/tools/ci/native_environment.py','mynotes/tools/ci/run_refinement_instrumentation.sh'],check=True)
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41876975461
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preflight runner emulator without unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 900
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            timeout 60s adb shell settings put global airplane_mode_on 1
            timeout 60s adb shell svc wifi disable
            timeout 60s adb shell svc data disable
            timeout 60s adb install -r refinement-apks/debug/notes-debug.apk
            timeout 60s adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            timeout 60s adb shell settings put system font_scale 1.0
            timeout 60s adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            timeout 30s adb shell settings put global stay_on_while_plugged_in 3
            timeout 60s adb shell settings put system screen_off_timeout 3600000
            timeout 60s adb shell input keyevent KEYCODE_WAKEUP
            timeout 60s adb shell wm dismiss-keyguard
            python3 -m mynotes.tools.ci.run_ordered_modules --night ${{ matrix.night }} --orientation ${{ matrix.orientation }}
            timeout 60s adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-native-${{ matrix.id }}-ordered
          path: |
            refinement-captures.tar
            refinement-native*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
            original-pre-native-setup-proof.json
            prior-preflight-import-failure.txt
          retention-days: 7
          if-no-files-found: warn
