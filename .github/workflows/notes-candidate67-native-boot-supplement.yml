# Recovery executes ONLY original zero-test light-portrait native lane, never rebuilds or repeats4752 measurements.
name: Candidate67 exact-build native boot supplement and explicit composite report
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate67-native-boot-supplement.yml']
permissions:
  contents: read
  actions: read
jobs:
  missing_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
    steps:
      - uses: actions/checkout@v5
      - name: Require exact original APKs and independently verified zero-test boot failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,subprocess,pathlib
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+p]))
          artifact=api('actions/artifacts/13347602297')
          assert not artifact['expired'] and artifact['workflow_run']['id']==41876975461 and artifact['workflow_run']['head_sha']=='acfd671d4afa4fceb09475cc6e70d1dabb77aefe'
          assert artifact['digest']=='sha256:65a1312363456a8ccf087e9f7df60e9abf5e9358768f4e070cea15c17c0a49a1'
          annotations=api('check-runs/126746123138/annotations');assert any(a['message']=='Timeout waiting for emulator to boot.' for a in annotations)
          assert 'module-native-light-portrait-ordered' not in {a['name'] for a in api('actions/runs/41876975461/artifacts?per_page=100')['artifacts']}
          pathlib.Path('original-boot-timeout-annotations.json').write_text(json.dumps(annotations,indent=2)+'\n')
          subprocess.run(['git','fetch','origin','acfd671d4afa4fceb09475cc6e70d1dabb77aefe','--depth=1'],check=True)
          subprocess.run(['git','diff','--exit-code','acfd671d4afa4fceb09475cc6e70d1dabb77aefe','--','mynotes/app/src','mynotes/runtime/src','mynotes/domain/src','mynotes/app/build.gradle','mynotes/docs/module-e2e-method-order.json','mynotes/tools/ci/run_ordered_modules.py','mynotes/tools/ci/native_environment.py','mynotes/tools/ci/run_refinement_instrumentation.sh'],check=True)
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41876975461
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preflight runner emulator without unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 900
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 -m mynotes.tools.ci.run_ordered_modules --night ${{ matrix.night }} --orientation ${{ matrix.orientation }}
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-native-${{ matrix.id }}-ordered
          path: |
            refinement-captures.tar
            refinement-native*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
            original-boot-timeout-annotations.json
          retention-days: 7
          if-no-files-found: warn

  report:
    needs: missing_native
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Wait for original evidence and verify there was no other failure to hide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch 41876975461 --exit-status --interval 60
          set -e
          python3 - <<'PROOF'
          import json,pathlib,subprocess,os
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+p]))
          original=api('actions/runs/41876975461?exclude_pull_requests=true');assert original['conclusion']=='failure' and original['head_sha']=='acfd671d4afa4fceb09475cc6e70d1dabb77aefe'
          failed=[j for j in api('actions/runs/41876975461/jobs?per_page=100')['jobs'] if j['conclusion']=='failure']
          assert {j['id'] for j in failed}=={126746123138},[(j['name'],j['conclusion']) for j in failed]
          annotations=api('check-runs/126746123138/annotations');assert any(a['message']=='Timeout waiting for emulator to boot.' for a in annotations)
          names=[a['name'] for a in api('actions/runs/41876975461/artifacts?per_page=100')['artifacts']]
          assert 'module-native-light-portrait-ordered' not in names
          receipt={'source':original['head_sha'],'original_source':original['head_sha'],'build_run':41876975461,'original_conclusion':'failure','original_failed_jobs':[{'job':126746123138,'lane':'light-portrait-ordered','conclusion':'failure','boot_timeout_verified':True,'tests_executed':0,'annotations':annotations}],'original_artifact_names':names,'missing_lanes':['light-portrait-ordered'],'lane_capture_runs':{'light-portrait-ordered':int(os.environ['GITHUB_RUN_ID'])},'foundation_artifact':13347602297,'foundation_digest':'sha256:65a1312363456a8ccf087e9f7df60e9abf5e9358768f4e070cea15c17c0a49a1','release_apk_artifact':13347771946,'release_apk_sha256':'91dd4b679027b747d6f5e7d55d5b12b697992a2bf29ed9bc1e20256312e007de','application_rebuilt':False,'models_changed':False,'assertion_failures_replaced':False}
          pathlib.Path('boot-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PROOF
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41876975461
          pattern: module-native-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41876975461
          pattern: module-benchmark-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41876975461
          name: module-foundation-lint
          path: module-artifacts/foundation
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-native-light-portrait-ordered
          path: module-artifacts/module-native-light-portrait-ordered
      - name: Require all1748 native outcomes,4752 original inferences and8 separate public observations; no green relabelling
        run: |
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          python3 -m mynotes.tools.ci.build_boot_supplement_report --additional-scenes-required --artifacts module-artifacts --output mynotes/docs/module-e2e/${{ github.run_id }} --receipt boot-receipt.json --run ${{ github.run_id }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: candidate67-explicit-composite-report
          path: mynotes/docs/module-e2e/${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
      - name: Root gate and preserve explicit composite on session branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'arena/3caca636-tictic'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/module-e2e/${{ github.run_id }}
          git commit -m 'Retain complete exact-build67 composite with original failed boot visible, no repeated corpus [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
