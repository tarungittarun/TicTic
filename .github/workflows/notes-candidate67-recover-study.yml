name: Recover executed candidate67 public study and round2 evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate67-recover-study.yml']
permissions:
  contents: read
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41830346993
          pattern: recognition-focused-*
          path: recovered
      - name: Independently score existing native measurements and retain failures, no device rerun
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json,pathlib,subprocess,shutil,re
          from mynotes.tools.ci.results import android
          from mynotes.tools.ci.test_plan import mask_comments_and_strings
          from mynotes.tools.ci.retain_public_captures import retain
          from mynotes.tools.ci.smallfont_scene_report import build
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/'+path],text=True))
          run=api('actions/runs/41830346993');assert run['head_sha']=='cba7533f2a1a58fd90fed1a54d36a3bd68ab960d'
          out=pathlib.Path('mynotes/docs/recognition/interactions/41830346993');out.mkdir(parents=True,exist_ok=True)
          subprocess.run(['git','fetch','origin',run['head_sha'],'--depth=1'],check=True)
          expected=[]
          for cls in ['ViewedFileJourneysTest','ImageSelectionTest']:
              path='mynotes/app/src/androidTest/java/app/space/notes/runtime/'+cls+'.java'
              source=subprocess.check_output(['git','show',run['head_sha']+':'+path],text=True)
              expected+=['app.space.notes.runtime.'+cls+'#'+name for name in re.findall(r'@Test\s+public\s+void\s+(\w+)\s*\(',mask_comments_and_strings(source))]
          expected+=['app.space.notes.CoreJourneysTest#'+name for name in ['nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments','nativeNotesBottomToTopDragScrollsAcrossThirtySixCards','nativeDocBottomToTopDragScrollsAcrossThirtySixCards','wholeAppLibraryTraversalRecordsEachVisitedPage','wholeAppSettingsTraversalRecordsEachVisitedPage']]
          assert len(expected)==43
          study_names=['app.space.notes.SmallFontSceneStudy#frozenPhotoDialogAndNegativeSceneInputsRetainFailures','app.space.notes.SmallFontSceneStudy#pairedSmallFontCropEnlargementRecordsActualOutputsBeforeAdoption']
          receipts=[]
          for folder in pathlib.Path('recovered').iterdir():
              assert folder.is_dir()
              dest=out/folder.name;dest.mkdir(exist_ok=True)
              for source in folder.iterdir():
                  if source.suffix in {'.txt','.json'} and source.stat().st_size<5000000:shutil.copyfile(source,dest/source.name)
              study=folder.name.endswith('smallfont-study')
              native=android((dest/'refinement-native.txt').read_text(),study_names if study else expected)
              (dest/'independent-native-verification.json').write_text(json.dumps(native,indent=2)+'\n')
              (dest/'capture-status.json').write_text(json.dumps(retain(folder/'refinement-captures.tar',dest),indent=2)+'\n')
              receipts.append({'artifact':folder.name,'native':native})
              if study:
                  assert native['ok'],native
                  build(dest/'small-font-paired-study.json',dest/'public-scene-study.json','mynotes/report-assets/public-ocr-scenes-v2/manifest.json',dest)
          assert len(receipts)==5
          jobs=api('actions/runs/41830346993/jobs?per_page=100')['jobs']
          for job in jobs:
              if job['name'].startswith('interactions') or job['name']=='smallfont-study':
                  (out/(str(job['id'])+'-annotations.json')).write_text(json.dumps(api(f"check-runs/{job['id']}/annotations"),indent=2)+'\n')
          (out/'provenance.json').write_text(json.dumps({'run':run['id'],'source':run['head_sha'],'jobs':jobs,'receipts':receipts,'inference_repeated':False,'full_acceptance':False,'physical_acceptance':False},indent=2)+'\n')
      - name: Root gate and preserve evidence on fixed session branch
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          test "$(git branch --show-current)" = 'arena/3caca636-tictic'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/recognition/interactions/41830346993
          git commit -m 'Retain actual paired OCR measurements and round2 failures, not qualification [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done

# Evidence recovery only: no Android build or inference in this workflow.
