# Public generated fixtures only. This gallery is focused evidence, NOT full E2E acceptance.
name: Preserve source-qualified candidate68 viewer window review
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate68-viewer-review.yml']
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Require exact successful focused execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41951373044']))
          assert run['head_sha']=='adf705ff29b9487ed7cbdf84bd02ff08c59bbbfc' and run['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41951373044
          pattern: pdf68-focused-*
          path: viewer-artifacts
      - name: Build bounded unaltered-window review and explicit provenance
        run: |
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          python3 - <<'PY'
          from pathlib import Path
          import json,tarfile,hashlib,io
          from PIL import Image
          root=Path('mynotes/docs/viewer68/41951373044');root.mkdir(parents=True,exist_ok=True)
          profiles={'light-portrait','dark-portrait','light-landscape','dark-landscape','dark-portrait-api36-small-font'}
          selected={'e2e-large-txt-page-one','e2e-large-txt-page-two','spreadsheet-grid-viewport'}
          records=[];outcomes={};seen=set()
          for folder in sorted(Path('viewer-artifacts').iterdir()):
              profile=folder.name.removeprefix('pdf68-focused-');assert profile in profiles and profile not in seen;seen.add(profile)
              result=json.loads((folder/'refinement-native-verified.json').read_text());assert result['ok'] and result['expected']==59 and result['passed']==59
              assert not result.get('missing') and not result.get('failures') and not result.get('duplicates')
              outcomes[profile]={'expected':59,'passed':59}
              archive=folder/'refinement-captures.tar';assert 0<archive.stat().st_size<40*1024*1024
              with tarfile.open(archive) as bundle:
                  for member in bundle.getmembers():
                      if not member.isfile() or not member.name.startswith('ux-review/') or not member.name.endswith('.png'):continue
                      scene=Path(member.name).stem
                      if not (scene.startswith('pdf68-') or scene.startswith('word68-') or scene in selected):continue
                      assert member.name=='ux-review/'+scene+'.png' and 0<member.size<8*1024*1024
                      raw=bundle.extractfile(member).read();image=Image.open(io.BytesIO(raw));assert image.width*image.height<12000000
                      image=image.convert('RGB');original_size=image.size;image.thumbnail((720,1600))
                      name=profile+'-'+scene+'.jpg';image.save(root/name,quality=88)
                      records.append({'profile':profile,'scene':scene,'path':name,'original_size':original_size,'original_png_sha256':hashlib.sha256(raw).hexdigest(),'review_jpeg_sha256':hashlib.sha256((root/name).read_bytes()).hexdigest(),'transformation':'Aspect-preserving thumbnail only; no crop, reconstruction or generated pixels.'})
          assert seen==profiles
          for profile in profiles:
              names={r['scene'] for r in records if r['profile']==profile}
              assert {'pdf68-search-above-keyboard','pdf68-search-result-highlight','pdf68-file-zoom-distant-page','pdf68-pen-and-highlighter-tools','word68-attached-filename-toolbar'}<=names
          receipt={'source':'adf705ff29b9487ed7cbdf84bd02ff08c59bbbfc','run':41951373044,'scope':'Focused 59 native methods per profile, not full module E2E','expected':295,'passed':295,'profiles':outcomes,'physical_acceptance':False,'full_e2e_acceptance':False,'private_inputs_uploaded':False,'screens':records}
          (root/'provenance.json').write_text(json.dumps(receipt,indent=2)+'\n')
          text=['# Candidate68 focused viewer windows','', '295/295 source-qualified native checks. These are public fixture captures, not full E2E or physical acceptance.', '', 'JPEGs are aspect-preserving review thumbnails. Original PNG hashes and exact source/run are retained in provenance.json.', '']
          for profile in sorted(profiles):
              text.extend(['## '+profile,''])
              for row in records:
                  if row['profile']==profile:text.extend(['### '+row['scene'],'', '!['+row['scene']+']('+row['path']+')',''])
          (root/'README.md').write_text('\n'.join(text)+'\n')
          PY
      - name: Gate and preserve public review without changing app source
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'arena/3caca636-tictic'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/viewer68/41951373044
          git commit -m 'Preserve public source-qualified viewer windows and exact focused outcomes [skip ci]'
          git push origin arena/3caca636-tictic
