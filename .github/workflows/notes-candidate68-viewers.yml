# Round2: actual whole-file measurement fix, persistent search, real pointer/key input and SAF copies.
# Focused qualification only: no distributable release, not full E2E acceptance.
name: Candidate68 PDF viewer compilation and interaction diagnostics
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-candidate68-viewers.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: notes-viewers68-r2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Retain each exact initial native cause in bounded annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41913118570 --name pdf68-focused-dark-landscape --dir /tmp/pdf68-initial
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/pdf68-initial/refinement-native-verified.json').read_text())
          for failure in result.get('failures',[]):
              excerpt='\n'.join(failure.splitlines()[:12])[:1800]
              print('::warning title=Initial68 native cause (not this source)::'+excerpt.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
      - uses: ./.github/actions/setup-mynotes
      - name: Prepare public ground-truth evaluation corpus, verify original licenses and hashes
        run: |
          python3 -m mynotes.tools.ci.module_corpus --output mynotes/benchmarks/assets/module-corpus
          cp mynotes/docs/regression/ocr-heldout-v1.json mynotes/benchmarks/assets/module-corpus/ocr-heldout-v1.json
          cp -r mynotes/report-assets/public-ocr-scenes-v2 mynotes/benchmarks/assets/public-scenes-v2
      - name: Compile debug app/instrumentation and lint without publication
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug :notes:assembleRelease :notes:lintRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/refinement-native-build.log
      - name: Verify exact executed JVM coverage
        if: always()
        run: python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/refinement-jvm.json
      - name: Bounded compiler and lint diagnostics in check annotations
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/refinement-native-build.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: module-foundation-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - name: Enforce previous 155MB-class release budget and account for bytes
        run: |
          python3 -m mynotes.tools.ci.apk_size_audit mynotes/app/build/outputs/apk/release/notes-release.apk evidence/release-apk-size.json
          python3 - <<'PY'
          from pathlib import Path
          # Existing qualified release was 155,165,372 bytes. Allow at most 1MiB
          # for code/resources; never silently add tens of MB of new model assets.
          size=Path('mynotes/app/build/outputs/apk/release/notes-release.apk').stat().st_size
          assert size <= 156213948, f'Release APK exceeds bounded growth budget: {size}'
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-foundation-lint
          path: |
            mynotes/runtime/build/generated/trained-whisper-assets/voice/trained-whisper.json
            evidence/refinement-jvm.json
            evidence/release-apk-size.json
            mynotes/app/build/reports/lint-results-debug.*
            mynotes/benchmarks/assets/module-corpus/manifest.json
            mynotes/benchmarks/assets/module-corpus/*-COPYING.txt
          retention-days: 7
          if-no-files-found: warn
  interactions:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait, api: 34, font: 1.0}
          - {id: dark-portrait, night: 'yes', orientation: portrait, api: 34, font: 1.0}
          - {id: light-landscape, night: 'no', orientation: landscape, api: 34, font: 1.0}
          - {id: dark-landscape, night: 'yes', orientation: landscape, api: 34, font: 1.0}
          - {id: dark-portrait-api36-small-font, night: 'yes', orientation: portrait, api: 36, font: 0.85}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate runner emulator and avoid unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e expectedFont ${{ matrix.font }} -e expectedNight ${{ matrix.night }} -e expectedOrientation ${{ matrix.orientation }} -e class app.space.notes.RealFolderStorageTest#largerTxtUsesLosslessPagesAndNeverCreatesAHomeNote,app.space.notes.RealFolderStorageTest#originalByteCopyUsesVerifiedWritableDescriptorAndNeverTruncatesExistingFiles,app.space.notes.RealFolderStorageTest#nativePdfPreviewPagesWithoutChangingSelectedFile,app.space.notes.RealFolderStorageTest#spreadsheetRotationKeepsViewerQueryAndReturnsToHomeWithoutImport,app.space.notes.runtime.PdfViewerInteractionTest,app.space.notes.EnvironmentQualificationTest,app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#nativeNotesSelectionSurvivesUnselectedAreaScroll,app.space.notes.CoreJourneysTest#nativeDocSelectionSurvivesUnselectedAreaScroll
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.RealFolderStorageTest#largerTxtUsesLosslessPagesAndNeverCreatesAHomeNote,app.space.notes.RealFolderStorageTest#originalByteCopyUsesVerifiedWritableDescriptorAndNeverTruncatesExistingFiles,app.space.notes.RealFolderStorageTest#nativePdfPreviewPagesWithoutChangingSelectedFile,app.space.notes.RealFolderStorageTest#spreadsheetRotationKeepsViewerQueryAndReturnsToHomeWithoutImport,app.space.notes.runtime.PdfViewerInteractionTest,app.space.notes.EnvironmentQualificationTest,app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#nativeNotesSelectionSurvivesUnselectedAreaScroll,app.space.notes.CoreJourneysTest#nativeDocSelectionSurvivesUnselectedAreaScroll
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - name: Require all native pilot assertions even after emulator failure
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.RealFolderStorageTest#largerTxtUsesLosslessPagesAndNeverCreatesAHomeNote,app.space.notes.RealFolderStorageTest#originalByteCopyUsesVerifiedWritableDescriptorAndNeverTruncatesExistingFiles,app.space.notes.RealFolderStorageTest#nativePdfPreviewPagesWithoutChangingSelectedFile,app.space.notes.RealFolderStorageTest#spreadsheetRotationKeepsViewerQueryAndReturnsToHomeWithoutImport,app.space.notes.runtime.PdfViewerInteractionTest,app.space.notes.EnvironmentQualificationTest,app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#nativeNotesSelectionSurvivesUnselectedAreaScroll,app.space.notes.CoreJourneysTest#nativeDocSelectionSurvivesUnselectedAreaScroll
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pdf68-focused-${{ matrix.id }}
          path: |
            refinement-captures.tar
            refinement-native*
            refinement-native-*.json
            refinement-native-*.txt
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn
