name: MyNotes standalone
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths:
      - 'mynotes/**'
      - '.github/workflows/notes-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: MyNotes source and protocol checks only
        run: python3 -m unittest discover -s mynotes/qa -t .
      - name: Domain tests and standalone release
        working-directory: mynotes
        run: sh gradlew :notes-domain:test :notes:assembleRelease :notes:assembleDebugAndroidTest --stacktrace
      - name: Package with checksum
        run: |
          mkdir -p mynotes/notes-dist
          cp mynotes/app/build/outputs/apk/release/notes-release.apk mynotes/notes-dist/MyNotes-v0.1.0-1.apk
          cd mynotes/notes-dist
          sha256sum MyNotes-v0.1.0-1.apk > MyNotes-v0.1.0-1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MyNotes-v0.1.0-1
          path: mynotes/notes-dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MyNotes-test-reports
          path: mynotes/domain/build/reports/tests/
          if-no-files-found: ignore
      - name: Publish first standalone APK to this branch
        if: github.ref == 'refs/heads/arena/3caca636-tictic'
        run: |
          set -euo pipefail
          DEST=mynotes/releases/MyNotes-v0.1.0-1.apk
          if [ -f "$DEST" ]; then
            echo "Version already published; bump version before replacing it."
            exit 0
          fi
          mkdir -p mynotes/releases
          cp mynotes/notes-dist/MyNotes-v0.1.0-1.apk "$DEST"
          cp mynotes/notes-dist/MyNotes-v0.1.0-1.apk.sha256 mynotes/releases/
          echo "$GITHUB_SHA" > mynotes/releases/MyNotes-v0.1.0-1.source.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mynotes/releases/
          git commit -m "Publish MyNotes 0.1.0 (1) standalone APK [skip ci]"
          git pull --rebase origin arena/3caca636-tictic
          git push origin arena/3caca636-tictic
