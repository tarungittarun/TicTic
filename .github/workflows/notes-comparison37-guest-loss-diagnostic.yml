# Reproduce on the software-host mode used by the successful full comparison grid, without ptrace.
# Explicit SwiftShader crashed untraced too; compare against the known-grid Mesa configuration.
name: Comparison37 guest-loss control; untraced software-host QEMU diagnostics
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths:
      - '.github/workflows/notes-comparison37-guest-loss-diagnostic.yml'
      - 'mynotes/tools/comparisons/apport_crash_metadata.py'
      - 'mynotes/tools/comparisons/emulator_exit_trace.py'
      - 'mynotes/tools/comparisons/guest_loss_lifecycle_replay.py'
      - 'mynotes/tools/comparisons/run_with_host_diagnostics.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: comparison37-guest-loss-diagnostic-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPARISON_CAPTURE_POLICY: adb_only
      LIBGL_ALWAYS_SOFTWARE: '1'
      COMPARISON_RANGE: '31-37'
      COMPARISON_PROFILE: dark-landscape
      COMPARISON_NIGHT: 'yes'
      COMPARISON_ORIENTATION: landscape
      COMPARISON_GUEST_LOSS_REPLAY: 'yes'
      COMPARISON_GUEST_LOSS_REPLAY_CYCLES: '20'
      COMPARISON_WAIT_FOR_CRASH_REPORT: 'yes'
      COMPARISON_CRASH_REPORT_WAIT_SECONDS: '120'
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mynotes/tools/comparisons
            mynotes/tools/ci
            mynotes/docs/ux-improvement-ledger/ledger.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websocket-client==1.8.0 Pillow==11.3.0 reportlab==4.4.4 python-docx==1.2.0 python-pptx==1.0.2 odfpy==1.4.1
      - uses: actions/download-artifact@v8.0.2
        id: pinned-apks
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 42277337133
          name: full71-internal-release-and-probe
          path: /tmp/comparison37-apks
      - name: Retry only a failed pinned-artifact transport
        if: steps.pinned-apks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42277337133 --name full71-internal-release-and-probe --dir /tmp/comparison37-apks
      - name: Pin exact signed apps; no build, re-signing or public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/comparison37-official comparison37-evidence
          gh release download v1.15.0 --repo obsidianmd/obsidian-releases --pattern Obsidian-1.15.0.apk --dir /tmp/comparison37-official
          echo 'a7d6f685992c68fe4ffc7f3a5705d0514986c9d9fd82ca67c6f68d392ca41de3  /tmp/comparison37-apks/release/notes-release.apk' | sha256sum --check
          echo '2d92966fba5441a8976ae86b39cf138c0a845d3dcd318e6f0d29d304950bca5d  /tmp/comparison37-official/Obsidian-1.15.0.apk' | sha256sum --check
          sha256sum /tmp/comparison37-apks/release/notes-release.apk /tmp/comparison37-official/Obsidian-1.15.0.apk > comparison37-evidence/apk-digests.txt
      - name: Prepare emulator only
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 strace
          bash mynotes/tools/ci/use_installed_emulator.sh
          sudo -n strace --version
      - name: Reproduce on software-host renderer without ptrace instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          emulator-build: 16428233
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: false
          emulator-options: -no-window -gpu host -memory 3072 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          script: |
            python -m mynotes.tools.ci.offline_guest
            cp offline-guest-proof.json comparison37-evidence/
            adb install /tmp/comparison37-apks/release/notes-release.apk
            adb install /tmp/comparison37-official/Obsidian-1.15.0.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night yes
            python -m mynotes.tools.ci.native_environment --orientation landscape
            python -m mynotes.tools.ci.native_environment --snapshot configured
            python mynotes/tools/comparisons/run_with_host_diagnostics.py
      - name: Summarize trace, replay, and original attempts without reclassifying a failure
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('comparison37-evidence')
          for name in ['emulator-exit-trace-receipt.json','fatal.json','modules.json','host-after.json','guest-loss-lifecycle-replay.json']:
              path=root/name
              if not path.exists():
                  print(name,'not produced')
                  continue
              if name=='emulator-exit-trace-receipt.json':
                  data=json.loads(path.read_text())
                  print(name,json.dumps({key:data.get(key) for key in
                        ['pid','matching_process_count','not_started','tracer_early_returncode',
                         'returncode_before_harness_stop','returncode_after_harness_stop',
                         'stopped_by_harness','target_qemu_terminated_at_harness_stop',
                         'signal_process_identities',
                         'signal_process_identity_events_dropped']},sort_keys=True)[:5000])
              elif name=='modules.json':
                  data=json.loads(path.read_text()); rows=data.get('results',[])
                  print(name,'records=',len(rows),'capture_errors=',sum(bool(r.get('capture_error')) for r in rows),'whole_module_acceptance=',data.get('whole_module_acceptance'))
              elif name=='host-after.json':
                  data=json.loads(path.read_text()); procs=data.get('processes',{}).get('stdout','')
                  print(name,'qemu_visible_after=',any('qemu-system' in line for line in procs.splitlines()),
                        'qemu_process=',data.get('qemu_process'),
                        'crash_metadata=',data.get('emulator_crash_metadata'),
                        'apport_crash_metadata=',data.get('apport_crash_metadata'))
              elif name=='guest-loss-lifecycle-replay.json':
                  data=json.loads(path.read_text())
                  fields=['status','error_type','error_excerpt','completed_groups',
                          'qemu_pids_at_start','current_qemu_pids','qemu_pid_change_observed',
                          'guest_reboot_observed','guest_loss_observed','guest_boot_id_stable',
                          'identity_change_at_failure','wall_elapsed_seconds']
                  print(name,json.dumps({key:data.get(key) for key in fields},sort_keys=True))
              else:
                  print(name,json.dumps(json.loads(path.read_text()),sort_keys=True)[:3000])
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: comparison37-dark-landscape-guest-loss-diagnostic
          path: |
            comparison37-evidence
            obsidian-evidence
            refinement-environment-*
          retention-days: 30
          if-no-files-found: warn
