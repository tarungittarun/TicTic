name: Inspect isolated light-landscape onboarding blocker
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-comparison37-inspect.yml']
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42344599145
          name: comparison37-light-landscape
          path: original
      - name: Surface exact original errors without editing or rescuing assertions
        run: |
          python - <<'PY'
          import pathlib,json
          files=list(pathlib.Path('original').rglob('fatal.json'))
          assert len(files)==1,'Expected original light-landscape fatal record'
          for path in files:
              data=json.loads(path.read_text())
              message=(str(path)+': '+json.dumps(data))[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Original fatal comparison record::'+message)
          PY
          for path in pathlib.Path('original').rglob('runtime-discovery.json'):
              data=json.loads(path.read_text())
              message=('Observed onboarding body: '+str(data.get('body'))+';hasApp='+str(data.get('hasApp')))[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Original onboarding state, not an app defect::'+message)
