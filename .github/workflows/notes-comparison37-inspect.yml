name: Inspect original landscape comparison provisioning failures
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-comparison37-inspect.yml']
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42342628990
          pattern: comparison37-*-landscape
          path: original
      - name: Surface exact original errors without editing or rescuing assertions
        run: |
          python - <<'PY'
          import pathlib,json
          files=list(pathlib.Path('original').rglob('fatal.json'))
          assert len(files)==2,'Expected both original landscape fatal records'
          for path in files:
              data=json.loads(path.read_text())
              message=(str(path)+': '+json.dumps(data))[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Original fatal comparison record::'+message)
          PY
