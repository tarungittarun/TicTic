name: Retain first37-family comparison originals and honest coverage report
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-comparison37-retain.yml']
permissions:
  actions: read
  contents: write
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN: '42343158423'
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: mynotes/docs/comparisons/comparison37/42343158423
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3 Pillow==11.3.0 reportlab==4.4.4 PyMuPDF==1.26.7 python-docx==1.2.0 python-pptx==1.0.2 odfpy==1.4.1
      - name: Read actual completed job outcomes, never infer coverage from workflow conclusion
        run: |
          python - <<'PY'
          import os,json,subprocess,time,pathlib
          for _ in range(90):
              result=json.loads(subprocess.check_output(['gh','run','view',os.environ['SOURCE_RUN'],'--json','databaseId,headSha,status,conclusion,url,jobs']))
              if result['status']=='completed':
                  assert result['headSha']=='2014f5d890b3cb73df851883d0eec065965b261b'
                  result['artifacts']=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/'+os.environ['SOURCE_RUN']+'/artifacts']))
                  pathlib.Path('/tmp/comparison37-run.json').write_text(json.dumps(result,indent=2));break
              time.sleep(10)
          else:raise SystemExit('Original not complete; no final coverage report')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: comparison37-*
          path: /tmp/comparison37-originals
      - name: Preserve exact originals, including fatal and partial results
        run: |
          python mynotes/tools/comparisons/comparison37_report.py retain --source /tmp/comparison37-originals --output "$EVIDENCE" --metadata /tmp/comparison37-run.json
          python - <<'PY'
          import json,pathlib
          for path in pathlib.Path('/tmp/comparison37-originals').rglob('fatal.json'):
              message=(str(path)+': '+path.read_text())[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Original comparison provisioning blocker::'+message)
          PY
      - name: Retain original completed job logs including the prior lost-guest diagnostics
        run: |
          python mynotes/tools/comparisons/collect_comparison_logs.py 42342628990 mynotes/docs/comparisons/comparison37/42342628990/host-logs
          python mynotes/tools/comparisons/collect_comparison_logs.py "$SOURCE_RUN" "$EVIDENCE/host-logs"
      - name: Gate and commit immutable originals locally
        run: |
          git fetch origin arena/3caca636-tictic
          git merge --ff-only origin/arena/3caca636-tictic
          python -m unittest discover -s qa
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/comparisons/comparison37
          if ! git diff --cached --quiet; then
            git commit -m 'Retain original37-family paired attempts, including failures [skip ci]'
          fi
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate report with immutable links, not coverage claims
        run: |
          python mynotes/tools/comparisons/comparison37_report.py render --output "$EVIDENCE" --commit "$EVIDENCE_COMMIT"
          python - <<'PY'
          import fitz,pathlib,os
          path=pathlib.Path(os.environ['EVIDENCE'])/'Comparison37_Runtime_Probes.pdf'
          document=fitz.open(path)
          assert 'acceptance still open' in ' '.join(document[0].get_text().split())
          assert sum(len(page.get_links()) for page in document)>2
          print('PDF pages:',len(document),'linked originals:',sum(len(page.get_links()) for page in document))
          PY
      - name: Root gate before publishing only to this active branch
        run: |
          git fetch origin arena/3caca636-tictic
          git merge --no-edit origin/arena/3caca636-tictic
          python -m unittest discover -s qa && git diff --check && git add mynotes/docs/comparisons/comparison37 && git commit -m 'Publish actual paired-probe coverage and remaining acceptance gaps [skip ci]' && git push origin arena/3caca636-tictic
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: comparison37-retention-and-report
          path: mynotes/docs/comparisons/comparison37
          retention-days: 30
          if-no-files-found: error
