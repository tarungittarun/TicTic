# Recover singleton download layout using the original artifact name; preserve source bytes.
# Recover exact completed-job logs after gh ANSI-output refusal; no emulator rerun.
name: Publish completed long-session and short-session comparison evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-comparison37-retain.yml']
permissions:
  actions: read
  contents: write
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_RUNS: '42608740772 42610424422 42611730935'
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_ROOT: mynotes/docs/comparisons/comparison37
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3 Pillow==11.3.0 reportlab==4.4.4 PyMuPDF==1.26.7 python-docx==1.2.0 python-pptx==1.0.2 odfpy==1.4.1
      - name: Read actual completed job outcomes, never infer coverage from workflow conclusion
        run: |
          python - <<'PY'
          import os,json,subprocess,pathlib
          pins={'42608740772':'1e3583fcea2aba3a365678ee84d18619a6d51c51','42610424422':'dff600dfe44f939eb010c5039093f5ac4a67f927','42611730935':'939eed649bb21969a77b2578a81651b7f0da8d68'}
          pathlib.Path('/tmp/comparison37-runs').mkdir()
          for run in os.environ['SOURCE_RUNS'].split():
              result=json.loads(subprocess.check_output(['gh','run','view',run,'--json','databaseId,headSha,status,conclusion,url,jobs']))
              assert result['status']=='completed','No pending execution may be published as final evidence'
              assert result['headSha']==pins[run]
              result['artifacts']=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/'+run+'/artifacts']))
              pathlib.Path('/tmp/comparison37-runs',run+'.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42608740772
          pattern: comparison37-*
          path: /tmp/comparison37-originals/42608740772
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42610424422
          pattern: comparison37-*
          path: /tmp/comparison37-originals/42610424422
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42611730935
          pattern: comparison37-*
          path: /tmp/comparison37-originals/42611730935
      - name: Preserve exact originals, including fatal and partial results
        run: |
          for run in $SOURCE_RUNS; do
            python mynotes/tools/comparisons/comparison37_report.py retain --source "/tmp/comparison37-originals/$run" --output "$EVIDENCE_ROOT/$run" --metadata "/tmp/comparison37-runs/$run.json"
          done
          python - <<'PY'
          import json,pathlib
          for path in pathlib.Path('/tmp/comparison37-originals').rglob('fatal.json'):
              message=(str(path)+': '+path.read_text())[:3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Original comparison provisioning blocker::'+message)
          PY
      - name: Preserve log retrieval receipts without attributing missing logs to either app
        run: |
          for run in $SOURCE_RUNS; do
            python mynotes/tools/comparisons/collect_comparison_logs.py "$run" "$EVIDENCE_ROOT/$run/host-logs/lookup-${{ github.run_id }}"
          done
      - name: Gate and commit immutable originals locally
        run: |
          git fetch origin arena/3caca636-tictic
          git merge --ff-only origin/arena/3caca636-tictic
          python -m unittest discover -s qa
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/comparisons/comparison37
          if ! git diff --cached --quiet; then
            git commit -m 'Retain original37-family paired attempts, including failures [skip ci]'
          fi
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate report with immutable links, not coverage claims
        run: |
          for run in $SOURCE_RUNS; do
            python mynotes/tools/comparisons/comparison37_report.py render --output "$EVIDENCE_ROOT/$run" --commit "$EVIDENCE_COMMIT"
          done
          python - <<'PY'
          import fitz,pathlib,os
          for run in os.environ['SOURCE_RUNS'].split():
              path=pathlib.Path(os.environ['EVIDENCE_ROOT'])/run/'Comparison37_Runtime_Probes.pdf'
              document=fitz.open(path)
              assert 'acceptance still open' in ' '.join(document[0].get_text().split())
              assert sum(len(page.get_links()) for page in document)>2
              print(run,'PDF pages:',len(document),'linked originals:',sum(len(page.get_links()) for page in document))
          PY
      - name: Root gate before publishing only to this active branch
        run: |
          git fetch origin arena/3caca636-tictic
          git merge --no-edit origin/arena/3caca636-tictic
          python -m unittest discover -s qa && git diff --check && git add mynotes/docs/comparisons/comparison37 && git commit -m 'Publish actual paired-probe coverage and remaining acceptance gaps [skip ci]' && git push origin arena/3caca636-tictic
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: comparison37-retention-and-report
          path: mynotes/docs/comparisons/comparison37
          retention-days: 30
          if-no-files-found: error
