name: Recover immutable consensus results without rebuilding or rerunning assertions
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-consensus-retained-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41779636217
          pattern: consensus-original-ocr-api*
          path: retained
      - name: Parse original logs first, never mask them with optional diagnostic JSON
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          from mynotes.tools.ci.results import android
          expected=['app.space.notes.OfflineOcrTest#'+m for m in re.findall(r'@Test\s+public\s+void\s+(\w+)\(',pathlib.Path('mynotes/app/src/androidTest/java/app/space/notes/OfflineOcrTest.java').read_text())]+['app.space.notes.ModuleCorpusBenchmark#variedImageCorpusMeasuresGroundTruthAndElapsedTime','app.space.notes.ModuleCorpusBenchmark#heldOutOcrReferencesMeasureIndependentRecognition']
          reports=[]
          for api in (26,34):
              root=pathlib.Path('retained')/('consensus-original-ocr-api'+str(api))
              r=android((root/'refinement-native.txt').read_text(errors='replace'),expected)
              report={'api':api,'original':r,'corpora':[]}
              for name,n in [('ocr',384),('ocr-holdout',128)]:
                  corpus=json.loads((root/(name+'.json')).read_text())
                  assert len(corpus['cases'])==corpus['expected']==n
                  report['corpora'].append({'name':name,'observations':n,'errors':sum(c['status']!='OK' for c in corpus['cases']),'targets_met':sum(c['accuracy_target_met'] for c in corpus['cases'])})
              probe=root/'public-native-ocr-probe.json'
              if probe.exists():
                  try:report['optional_probe']=json.loads(probe.read_text())
                  except ValueError:report['optional_probe_error']='Not JSON; retained verbatim, never substituted for original result'
              history=root/'historical-consensus.json'
              if history.exists():report['historical']={k:v for k,v in json.loads(history.read_text()).items() if k!='pairs'}
              reports.append(report)
              print('::notice title=Immutable original native results::'+json.dumps(report).replace('%','%25'))
          pathlib.Path('recovered-consensus.json').write_text(json.dumps({'source_run':41779636217,'adopted':False,'scope':'Read-only recovery, no test retries, model adoption or training','reports':reports},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recovered-immutable-consensus-evidence
          path: |
            recovered-consensus.json
            retained/
          retention-days: 7
          if-no-files-found: error
