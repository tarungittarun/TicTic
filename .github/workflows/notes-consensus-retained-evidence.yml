name: Recover public consensus gate inputs without rebuilding or rerunning assertions
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-consensus-retained-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41781175749
          pattern: consensus-original-ocr-api*
          path: retained
      - name: Expose bounded gate inputs separately to avoid annotation truncation
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('retained/consensus-original-ocr-api26')
          original=json.loads((root/'original-assertion.json').read_text())
          report=json.loads((root/'public-native-ocr-probe.json').read_text())
          print('::notice title=Original immutable assertion::'+json.dumps(original))
          print('::notice title=Public baseline gate inputs::'+json.dumps(report['baseline'],ensure_ascii=False))
          for row in report['cases']:
              if row['language']=='kan' and row['psm']==3:
                  print('::notice title=Public Kannada candidate geometry::'+json.dumps(row,ensure_ascii=False))
          pathlib.Path('recovered-consensus.json').write_text(json.dumps({'source_run':41781175749,'original':original,'probe':report,'adopted':False},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recovered-immutable-consensus-evidence
          path: |
            recovered-consensus.json
            retained/
          retention-days: 7
          if-no-files-found: error
