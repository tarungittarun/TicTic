# Exact public signed-release probe diagnostics and preservation-only recovery.
# No Android build, assertion retry, private input or public release.
name: MyNotes exact57 public probe diagnostics
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-e2e-native-triage.yml']
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41591928821
          name: source-pinned-release40-to57-update-smoke
          path: public-update-evidence
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41591928777
          name: public-reader-process-recovery-release57
          path: public-reader-evidence
      - name: Preserve exact bounded public job traces and already-executed upgrade report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,shutil
          from pathlib import Path
          repo='repos/tarungittarun/TicTic/'
          for run in [41591928777,41591928821]:
              meta=json.loads(subprocess.check_output(['gh','api',repo+'actions/runs/'+str(run)]))
              assert meta['head_sha']=='06196442419f34be1b21a047ec956e31ec4a432a' and meta['status']=='completed'
          dest=Path('mynotes/docs/native-triage/41591928777');dest.mkdir(parents=True,exist_ok=True)
          for job in [125770387056,125770387356]:
              raw=subprocess.check_output(['gh','api','--allow-escape-sequences',repo+'actions/jobs/'+str(job)+'/logs'])
              assert len(raw)<32*1024*1024
              text=raw.decode(errors='replace');excerpt=text[-30000:]
              (dest/(str(job)+'.txt')).write_text(excerpt)
              lines=[line for line in excerpt.splitlines() if any(word in line.lower() for word in ['traceback','error','exception','timeout','failed','wait_until','export_public','pick(','saved','rejected','rebase','conflict'])]
              for index in range(0,len(lines),8):print('::notice title=Public probe exact trace::'+'\n'.join(lines[index:index+8])[:3000].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          apks=json.loads(Path('public-update-evidence/release-apks.json').read_text());report=json.loads(Path('public-update-evidence/release-update-smoke.json').read_text())
          assert apks['candidate']['source_sha']=='38401d2c6c18334c3dcd20baea845930c6344a6b' and apks['candidate']['version_code']==57 and apks['candidate']['sha256']=='2bf60ea6029439437b2a6c0af8a24dccb5962543d43fec3b4ab2184affc7f2a1'
          assert report['ok'] is True and report['from']['version_code']==40 and report['to']['version_code']==57
          assert report['notes_and_doc_retained'] is True and report['uninstall_or_clear_data'] is False and report['release_approval'] is False
          assert report['from']['first_install_time']==report['to']['first_install_time']
          out=Path('mynotes/docs/design-2026-10-29/updates/41591928821/40-to57');out.mkdir(parents=True,exist_ok=True)
          for filename in ['release-apks.json','release-update-smoke.json']:shutil.copyfile(Path('public-update-evidence')/filename,out/filename)
          (out/'provenance.json').write_text(json.dumps({'run_id':41591928821,'recovered_from_uploaded_artifact':True,'assertions_retried':False,'scope':'Already-executed public update report; original retention step failed, see exact job excerpt. Not a new emulator execution or physical sign-off.'},indent=2)+'\n')
          for file in Path('public-reader-evidence').rglob('screenshot-manifest.json'):
              data=json.loads(file.read_text());(dest/'partial-screen-manifest.json').write_text(json.dumps(data,indent=2)+'\n');print('::notice title=Public failed probe reached screens::'+','.join(x['name'] for x in data['captures']))
          PY
      - name: Gate and preserve only exact public evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/native-triage/41591928777 mynotes/docs/design-2026-10-29/updates/41591928821/40-to57
          git commit -m 'Preserve exact57 public probe diagnostics and executed40 install-over evidence [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
