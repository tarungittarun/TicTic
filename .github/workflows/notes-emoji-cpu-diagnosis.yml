# Resolve normalized Unicode keys against actual pinned archive names, including retained FE0F in ZWJ assets.
# Diagnose the failed pilot; tiny memorization checks are not held-out accuracy.
name: MyNotes public emoji feature-collapse diagnosis (not runtime approval)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-emoji-cpu-diagnosis.yml']
permissions:
  contents: read
  actions: read
jobs:
  public-cpu-diagnosis:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Gate source and exact successful experiment identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s qa
          python - <<'PY'
          import json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41457619334']))
          assert run['head_sha']=='c1da367f982688f22f9bff3e740529847d1b1d14' and run['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41457619334
          name: EXPERIMENTAL-NOT-RUNTIME-emoji-public-cpu-pilot
          path: immutable-pilot
      - name: Install pinned CPU-only research dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install Pillow==11.3.0
      - name: Diagnose exact archived features and two fixed tiny-training-set sanity experiments
        run: python -u -m mynotes.tools.ci.emoji_cpu_diagnosis --pilot immutable-pilot --output evidence/emoji-public-cpu-diagnosis
      - name: Retain report and graphics notices only, no new weights or glyph dataset
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PUBLIC-RESEARCH-NOT-ACCURACY-emoji-feature-diagnosis
          path: evidence/emoji-public-cpu-diagnosis
          retention-days: 7
          if-no-files-found: warn
      - name: Surface bounded true measurements without calling training memorization accuracy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/emoji-public-cpu-diagnosis/diagnosis.json').read_text())
          assert report['runtime_models_changed'] is False and report['new_weights_saved'] is False and report['release_approval'] is False
          measured={key:report[key] for key in ['archived_seen_style_sample_not_held_out','archived_layer_statistics','small_training_set_memorization_sanity_only']}
          print('::notice title=Feature diagnosis and tiny TRAINING memorization only::'+json.dumps(measured))
          PY
