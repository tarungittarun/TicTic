# Fixed candidate selected from dead-feature/training-only diagnosis, not OpenMoji score tuning.
name: MyNotes stabilized full-label public CPU experiment (not runtime approval)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-emoji-stabilized-pilot.yml']
permissions:
  contents: read
jobs:
  public-cpu-experiment:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Gate public identity, alias handling and non-adoption policy
        run: python -m unittest discover -s qa
      - name: Install pinned CPU-only experiment tools
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install Pillow==11.3.0
      - name: Fixed20-epoch full3941-class fit with centered input LeakyReLU LayerNorm lower learning rate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u -m mynotes.tools.ci.emoji_cpu_pilot --variant centered-leaky-layernorm --epochs 20 --output evidence/emoji-stabilized-public-cpu
      - name: Retain experimental weights and full public graphics notices, never release them as runtime
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: EXPERIMENTAL-NOT-RUNTIME-emoji-stabilized-full-labels
          path: evidence/emoji-stabilized-public-cpu
          retention-days: 7
          if-no-files-found: warn
      - name: Surface bounded measurements with honest development-only evaluation scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/emoji-stabilized-public-cpu/report.json').read_text())
          assert report['runtime_models_changed'] is False and report['release_approval'] is False
          assert report['epochs']==20 and report['pixel_alias_classes']==3941
          measured={key:value for key,value in report.items() if key!='held_out_asset_identities'}
          print('::notice title=Experimental full-label CPU measurements NOT runtime accuracy approval::'+json.dumps(measured))
          PY
