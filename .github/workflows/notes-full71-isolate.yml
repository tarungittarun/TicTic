name: Candidate71 isolate broad-run navigation and large-text findings
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-full71-isolate.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: full71-isolate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: api36-portrait, api: 36, target: google_apis, font: '1.0', night: 'no', orientation: portrait, cases: 'app.space.notes.CoreJourneysTest#notesAndDocCreationRemainSeparateEvenAfterAnOldOptIn'}
          - {id: api34-large, api: 34, target: google_apis, font: '2.0', night: 'yes', orientation: portrait, cases: 'app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.runtime.ImageSelectionTest#selectionViewportRetainsUsefulAreaInPortraitAndLandscape'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42280357507
          name: supplement71-test-apks
          path: improvement-apks
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42277337133
          name: full71-test-apks
          path: original-target
      - name: Record exact unchanged candidate target bytes
        run: sha256sum original-target/debug/notes-debug.apk > refinement-native-target-sha256.txt
      - name: Prepare emulator
        run: |
          sudo chmod 666 /dev/kvm
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 -m mynotes.tools.ci.offline_guest
            adb install -r original-target/debug/notes-debug.apk
            adb install -r improvement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            export CASES='${{ matrix.cases }}'
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e expectedFont ${{ matrix.font }} -e expectedNight ${{ matrix.night }} -e expectedOrientation ${{ matrix.orientation }} -e expectedMotion 1 -e class "$CASES"
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes "$CASES"
      - name: Reject absent or partial assertion results
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes '${{ matrix.cases }}'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: improvement71-${{ matrix.id }}
          path: |
            refinement-native*
            refinement-captures.tar
            refinement-environment-*
            offline-guest-proof.json
          retention-days: 14
          if-no-files-found: warn
