# Preserve invalid capture bytes when instrumentation never started.
name: Retain final candidate71 API26 and isolated recheck original evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-full71-recheck-retain.yml']
permissions:
  actions: read
  contents: write
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN: '42282354356'
      BUILD_RUN: '42280357507'
      NATIVE_FLAT_LANE: improvement71-api26-portrait
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3 Pillow==11.3.0 reportlab==4.4.4 PyMuPDF==1.26.7
      - name: Wait for exact source run, never equate its success with acceptance
        run: |
          python - <<'PY'
          import os,json,subprocess,time
          for _ in range(132):
              result=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/'+os.environ['SOURCE_RUN']]))
              if result['status']=='completed':
                  print('Source conclusion:',result['conclusion']);break
              time.sleep(10)
          else:raise SystemExit('Source qualification incomplete; do not invent evidence')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: improvement71-api*
          path: native-originals
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: supplement71-build-evidence
          path: build-originals
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42277337133
          name: full71-test-apks
          path: original-apks
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42280357507
          name: supplement71-test-apks
          path: recheck-apks
      - name: Retain exact original and recheck debug payload/signature provenance
        run: |
          python - <<'PYIDENTITY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from mynotes.tools.ci.resign_public_benchmark_apks import payload
          from mynotes.tools.verify_update import inspect
          old=Path('original-apks/debug/notes-debug.apk');new=Path('recheck-apks/debug/notes-debug.apk');test=Path('recheck-apks/androidTest/debug/notes-debug-androidTest.apk')
          a,b=payload(old),payload(new);sdk=os.environ['ANDROID_HOME'];first=inspect(old,sdk);second=inspect(new,sdk)
          assert first[:3]==second[:3]==('app.space.notes.debug',71,'0.71.0')
          cert=subprocess.check_output([str(Path(sdk)/'build-tools/34.0.0/apksigner'),'verify','--print-certs',str(test)],text=True)
          assert second[3] in cert,'Recheck debug app/test certificates must match'
          data={'original_app_run':'42277337133','used_app_and_test_build_run':'42280357507','qualification_run':'42282354356','original_app':{'sha256':hashlib.sha256(old.read_bytes()).hexdigest(),'identity':first},'used_app':{'sha256':hashlib.sha256(new.read_bytes()).hexdigest(),'identity':second},'test_sha256':hashlib.sha256(test.read_bytes()).hexdigest(),'app_test_same_certificate':True,'unsigned_payload_equal':a==b,'changed_unsigned_entries':sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k)),'scope':'Public synthetic debug fixtures only; original production inputs unchanged. No APK re-signing, user release or physical acceptance. Different debug certificates do not mean byte-identical APKs.'}
          Path('mynotes/docs/full-qualification/recheck-apk-identity.json').write_text(json.dumps(data,indent=2)+'\n')
          PYIDENTITY
      - name: Verify and alias the original shard receipt when a single artifact is flattened
        run: |
          python - <<'PYALIAS'
          import json,shutil
          from pathlib import Path
          from mynotes.tools.ci.results import android
          root=Path('native-originals')
          for receipt in root.rglob('refinement-native.json'):
              alias=receipt.with_name('refinement-native-verified.json')
              expected=receipt.with_name('refinement-expected.json')
              if not alias.exists() and expected.exists():
                  result=android(receipt.with_name('refinement-native.txt').read_text(),json.loads(expected.read_text()))
                  assert result==json.loads(receipt.read_text())
                  shutil.copyfile(receipt,alias)
                  receipt.with_name('receipt-alias-provenance.json').write_text(json.dumps({'alias':alias.name,'original':receipt.name,'bytes_identical':True,'independently_reparsed':True})+'\n')
          PYALIAS
      - name: Retain bounded public screenshots, exact assertions and new JVM regressions
        run: python mynotes/tools/comparisons/retain_improvement.py native-originals build-originals "$SOURCE_RUN" "$BUILD_RUN"
      - name: Gate evidence and save only on the active session branch
        run: |
          git pull --ff-only origin arena/3caca636-tictic
          python -m unittest discover -s qa
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/ux-improvement-ledger/implementations mynotes/docs/full-qualification/recheck-apk-identity.json
          git commit -m "Retain API26 supplemental originals and preserve prior failures, not whole-app acceptance [skip ci]"
          git push origin arena/3caca636-tictic
