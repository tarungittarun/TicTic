name: Retain full candidate71 originals with nonignored JVM and lint paths
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-full71-retain.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '42277337133'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3 Pillow==11.3.0 reportlab==4.4.4 PyMuPDF==1.26.7
      - name: Wait for exact completed run, preserving failure as failure
        run: |
          python - <<'PYWAIT'
          import json,os,subprocess,time
          for _ in range(180):
              data=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/'+os.environ['SOURCE_RUN']]))
              assert data['head_sha']=='3c1478b8c8b09d077d97b5481603387cbc47b06a'
              if data['status']=='completed':break
              time.sleep(15)
          else:raise SystemExit('Qualification not completed; no final result invented')
          PYWAIT
          gh run view "$SOURCE_RUN" --json databaseId,headSha,status,conclusion,url,jobs > full71-run.json
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: full71-native-*
          path: full71-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: full71-build-evidence
          path: full71-artifacts/full71-build-evidence
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: full71-release69-to71-*
          path: full71-artifacts
      - name: Reparse and retain bounded original evidence; never APKs/models
        run: |
          python -m mynotes.tools.comparisons.retain_full_qualification --artifacts full71-artifacts --metadata full71-run.json --output mynotes/docs/full-qualification/42277337133
      - name: Gate then save only evidence on the active session branch
        run: |
          set -euo pipefail
          git pull --ff-only origin arena/3caca636-tictic
          python -m unittest discover -s qa
          python -m unittest discover -s mynotes/qa -t .
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/full-qualification/42277337133
          git commit -m 'Retain full candidate71 automation originals, not whole-app acceptance [skip ci]'
          git push origin arena/3caca636-tictic
