# Exhaustive current candidate automation. No public release or paired/physical acceptance claim.
name: Candidate71 full native inventory and signed install-over qualification
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-full71.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: full71-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Compile actual candidate, JVM tests, instrumentation and lint (no publication)
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:assembleRelease :notes:lintDebug :notes:lintRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/full71-build.log
      - name: Require every JVM method exactly once
        if: always()
        run: python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/full-jvm.json
      - name: Compile separate same-signer CI-only migration probe
        working-directory: mynotes
        run: sh gradlew -I tools/ci/release_migration_probe.gradle :notes:assembleRelease :notes:assembleReleaseAndroidTest --no-daemon --max-workers=2 --console=plain --stacktrace
      - name: Check release identity, offline permissions and size
        run: |
          python3 - <<'PYAUDIT'
          import os,json,hashlib
          from pathlib import Path
          from mynotes.tools.verify_update import inspect
          from mynotes.tools.ci.audit import assert_manifest
          import subprocess
          apk=Path('mynotes/app/build/outputs/apk/release/notes-release.apk')
          probe=Path('mynotes/app/build/outputs/apk/androidTest/release/notes-release-androidTest.apk')
          sdk=os.environ['ANDROID_HOME'];tools=Path(sdk)/'build-tools/35.0.0'
          identity=inspect(apk,sdk)
          assert identity[:3]==('app.space.notes',71,'0.71.0'),identity
          assert identity[3]=='08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca'
          assert identity[3] in subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(probe)],text=True)
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          xml=subprocess.check_output([str(tools/'aapt'),'dump','xmltree',str(apk),'AndroidManifest.xml'],text=True)
          permissions=assert_manifest(badging,xml)
          assert apk.stat().st_size<=156213948,'APK size budget exceeded'
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/release-audit.json').write_text(json.dumps({'identity':identity,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'bytes':apk.stat().st_size,'permissions':permissions,'public_release':False},indent=2)+'\n')
          PYAUDIT
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: full71-internal-release-and-probe
          path: |
            mynotes/app/build/outputs/apk/release/notes-release.apk
            mynotes/app/build/outputs/apk/androidTest/release/notes-release-androidTest.apk
          retention-days: 7
          if-no-files-found: error
      - name: Surface bounded compiler diagnostics
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/full71-build.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full71-build-evidence
          path: |
            evidence/
            mynotes/domain/build/test-results
            mynotes/app/build/reports
            mynotes/runtime/build/reports
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: full71-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 3
          if-no-files-found: error
  native:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: api26-light-portrait-s0, api: 26, font: '1.0', night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 0, group: all}
          - {id: api26-light-portrait-s1, api: 26, font: '1.0', night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 1, group: all}
          - {id: api36-light-portrait-s0, api: 36, font: '1.0', night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 1, shard: 0, group: all}
          - {id: api36-light-portrait-s1, api: 36, font: '1.0', night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 1, shard: 1, group: all}
          - {id: api34-dark-portrait-s0, api: 34, font: '1.0', night: 'yes', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 0, group: all}
          - {id: api34-dark-portrait-s1, api: 34, font: '1.0', night: 'yes', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 1, group: all}
          - {id: api34-large-dark-s0, api: 34, font: '2.0', night: 'yes', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 0, group: all}
          - {id: api34-large-dark-s1, api: 34, font: '2.0', night: 'yes', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 1, group: all}
          - {id: api34-light-landscape-s0, api: 34, font: '1.0', night: 'no', orientation: landscape, profile: 'Nexus 5', motion: 0, shard: 0, group: all}
          - {id: api34-light-landscape-s1, api: 34, font: '1.0', night: 'no', orientation: landscape, profile: 'Nexus 5', motion: 0, shard: 1, group: all}
          - {id: api34-dark-landscape-s0, api: 34, font: '1.0', night: 'yes', orientation: landscape, profile: 'Nexus 5', motion: 0, shard: 0, group: all}
          - {id: api34-dark-landscape-s1, api: 34, font: '1.0', night: 'yes', orientation: landscape, profile: 'Nexus 5', motion: 0, shard: 1, group: all}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: full71-test-apks
          path: refinement-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare exact selected execution inventory
        env:
          REVIEW_GROUP: ${{ matrix.group }}
          REVIEW_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PYPLAN'
          import json,os
          from pathlib import Path
          from mynotes.tools.ci.test_plan import build_plan
          from mynotes.tools.ci.refinement_plan import selected_cases
          plan=build_plan()
          selected=selected_cases(plan,os.environ['REVIEW_GROUP'],int(os.environ['REVIEW_SHARD']))
          Path('refinement-expected.json').write_text(json.dumps(selected))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('REVIEW_CLASSES='+','.join(selected)+'\n')
          PYPLAN
      - name: Install Linux audio loader dependency before emulator version preflight
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Use verified installed emulator
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 26 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disk-size: 4G
          disable-animations: true
          # AVDs are recreated per job; do not spend shutdown time saving unused snapshots.
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            python3 -m mynotes.tools.ci.offline_guest
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            if test '${{ matrix.api }}' = 36; then adb shell pm grant app.space.notes.debug android.permission.RECORD_AUDIO; fi
            adb shell settings put system font_scale ${{ matrix.font }}
            # Enable app-owned motion on API36; retain OS window-transition determinism.
            adb shell settings put global animator_duration_scale ${{ matrix.motion }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --snapshot before
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            if test '${{ matrix.api }}' = 34; then python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home; fi
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb logcat -G 8M || true # Synthetic CI observer only; retain CPU timings beyond the final 500 lines.
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e timeout_msec 180000 -e expectedFont ${{ matrix.font }} -e expectedNight ${{ matrix.night }} -e expectedOrientation ${{ matrix.orientation }} -e expectedMotion ${{ matrix.motion }} -e expectedMic ${{ matrix.api == 36 && 'granted' || 'denied' }} -e class "$REVIEW_CLASSES"
            python3 -m mynotes.tools.ci.native_environment --snapshot after
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            if test '${{ matrix.shard }}' != 1; then adb exec-out run-as app.space.notes.debug tar -C files -cf - pdf-review > refinement-pdf-captures.tar; fi
            for report in ocr-common-text-report.json speech-degradation-report.json core-focus-failure.txt; do if adb shell run-as app.space.notes.debug ls "files/$report" >/dev/null 2>&1; then adb exec-out run-as app.space.notes.debug cat "files/$report" > "refinement-quality-$report"; fi; done
      - name: Verify selected quantitative reports are complete and independently scored
        if: always()
        run: python3 -m mynotes.tools.ci.quality_reports --expected refinement-expected.json
      - name: Independently validate actual exported PDF URI annotations and page geometry
        if: always() && matrix.shard != 1
        run: |
          python3 -m pip install 'pypdf==6.1.1'
          python3 -m mynotes.tools.ci.verify_pdf_features --archive refinement-pdf-captures.tar --output refinement-pdf-results.json
      - name: Require every selected method once, without skipped or duplicate outcomes
        if: always()
        run: |
          python3 - <<'PYRESULT'
          from pathlib import Path
          import json,sys,re
          from mynotes.tools.ci.results import android,write_report
          expected=json.loads(Path('refinement-expected.json').read_text())
          path=Path('refinement-native.txt')
          result=android(path.read_text(errors='replace') if path.exists() else '',expected)
          write_report(result,'refinement-native.json')
          cpu=Path('refinement-native-cpu-phases.txt')
          phases=cpu.read_text(errors='replace') if cpu.exists() else ''
          if path.exists():
              for observation in set(re.findall(r'trained_cpu_elapsed_ms=\d+',path.read_text(errors='replace'))):
                  if observation not in phases:phases+='\n'+observation+' (public fixture end-to-end, not physical-device timing)'
          if 'NotesCpuPhase' in phases or 'trained_cpu_elapsed_ms=' in phases:
              print('::notice title=Observed native CPU phases and elapsed time::'+json.dumps(phases[-4000:]))
          if not result['ok']:
              progress=Path('refinement-native-test-progress.txt')
              if progress.exists():print('::notice title=Last observed native method::'+json.dumps(progress.read_text(errors='replace')[-2000:]))
              sys.exit(1)
          print('::notice title=Native refinement coverage::'+str(result['passed'])+'/'+str(result['expected'])+' methods passed, exact inventory')
          PYRESULT
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full71-native-${{ matrix.id }}
          overwrite: true
          path: |
            refinement-native.*
            refinement-native*.txt
            refinement-expected.json
            offline-guest-proof.json
            refinement-environment-*
            refinement-captures.tar
            refinement-pdf-*
            refinement-quality-*
          retention-days: 7
          if-no-files-found: warn
  update:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, target: default}
          - {api: 34, target: google_apis}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42021523354
          name: MyNotes-v0.69.0-69-development.apk
          path: old-apk
      - uses: actions/download-artifact@v8.0.2
        with:
          name: full71-internal-release-and-probe
          path: migration-apks
      - name: Verify pinned old APK and same signed candidate identity
        run: |
          python3 - <<'PYIDENTITY'
          import hashlib,json,os
          from pathlib import Path
          from mynotes.tools.verify_update import inspect
          old=list(Path('old-apk').rglob('*.apk'));assert len(old)==1
          candidate=list(Path('migration-apks').rglob('notes-release.apk'));assert len(candidate)==1
          probe=list(Path('migration-apks').rglob('notes-release-androidTest.apk'));assert len(probe)==1
          assert hashlib.sha256(old[0].read_bytes()).hexdigest()=='03d839d58b828ac72e211b69a1904e00e5f44f9f5c2b37704d4312501431d167'
          identities=[inspect(p,os.environ['ANDROID_HOME']) for p in [old[0],candidate[0]]]
          assert [i[:3] for i in identities]==[('app.space.notes',69,'0.69.0'),('app.space.notes',71,'0.71.0')]
          assert identities[0][3]==identities[1][3]=='08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca'
          data={label:{'path':str(p),'identity':identity,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for label,p,identity in zip(['old','candidate'],[old[0],candidate[0]],identities)}
          data['probe']=str(probe[0]);Path('release-apks.json').write_text(json.dumps(data,indent=2)+'\n')
          PYIDENTITY
      - name: Enable KVM and use verified installed emulator
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            python3 -m mynotes.tools.ci.offline_guest
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 -c 'import json,subprocess,sys,pathlib; a=json.load(open("release-apks.json"));  subprocess.run([sys.executable,"-m","mynotes.tools.ci.release_rich_update_probe","--old",a["old"]["path"],"--candidate",a["candidate"]["path"],"--tester",a["probe"],"--old-code","69","--candidate-code","71","--output","release-rich-update-proof.json"],check=True)' 
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full71-release69-to71-api${{ matrix.api }}-rich-public-update-evidence
          path: |
            release-apks.json
            release-rich-update-proof.json
            rich-probe-*.txt
            offline-guest-proof.json
          retention-days: 7
          if-no-files-found: error
