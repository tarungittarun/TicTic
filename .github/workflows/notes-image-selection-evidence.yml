# Preserve already-captured synthetic JPEGs; the legacy baseline collector intentionally accepts PNG only.
# No new Android build, ML optimization, private screenshot or release publication.
name: MyNotes image selection synthetic preview evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-image-selection-evidence.yml']
permissions:
  contents: read
jobs:
  selection-previews:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_RUN: '41390921561'
      SOURCE_SHA: 590c9d10daf52ca6a1bdc15b7b088f6d7259f396
    steps:
      - uses: actions/checkout@v5
      - name: Wait for the exact source-pinned native artifacts, not a newer or different app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          base='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['SOURCE_RUN']
          for attempt in range(80):
              run=json.loads(subprocess.check_output(['gh','api',base],text=True))
              if run['head_sha']!=os.environ['SOURCE_SHA']:raise SystemExit('Wrong source run')
              inventory=json.loads(subprocess.check_output(['gh','api',base+'/artifacts'],text=True))['artifacts']
              names={row['name'] for row in inventory if row['size_in_bytes']>0}
              expected={'refinement-native-'+profile for profile in ['min-api26','min-api26-b','large-font-api34','large-font-api34-b','landscape-api34','landscape-api34-b','current-api36','current-api36-b']}
              if expected<=names:break
              time.sleep(15)
          else:raise SystemExit('Source profile artifacts unavailable; do not invent images')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: refinement-native-*
          path: selected-artifacts
      - name: Bound and retain only the real synthetic selection screenshot, not other artifact files
        run: |
          python3 -m pip install Pillow==11.3.0 PyYAML==6.0.3
          python3 - <<'PY'
          import hashlib,io,json,os,tarfile
          from pathlib import Path,PurePosixPath
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=16000000
          dest=Path('mynotes/docs/design-2026-10-29/native')/os.environ['SOURCE_RUN'];records=[]
          for folder in sorted(Path('selected-artifacts').iterdir()):
              archive=folder/'refinement-captures.tar'
              if not archive.is_file() or not archive.stat().st_size:continue
              lane=folder.name.removeprefix('refinement-native-')
              with tarfile.open(archive,'r:*') as bundle:
                  for member in bundle:
                      path=PurePosixPath(member.name)
                      if not member.isfile() or str(path)!='ux-review/image-text-selection.jpg':continue
                      if not 0<member.size<=8*1024*1024:raise ValueError('Screenshot exceeds bound')
                      raw=bundle.extractfile(member).read();image=Image.open(io.BytesIO(raw))
                      if image.format!='JPEG' or image.width*image.height>16000000:raise ValueError('Invalid screenshot')
                      image=image.convert('RGB');image.thumbnail((480,1800),Image.Resampling.LANCZOS)
                      for quality in [78,65,50,35]:
                          out=io.BytesIO();image.save(out,format='JPEG',quality=quality,optimize=True);preview=out.getvalue()
                          if len(preview)<=44000:break
                      if len(preview)>44000:raise ValueError('Preview exceeds bound')
                      target=dest/lane/'image-text-selection.jpg';target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(preview)
                      records.append({'lane':lane,'source_jpeg_sha256':hashlib.sha256(raw).hexdigest(),'preview_sha256':hashlib.sha256(preview).hexdigest(),'bytes':len(preview),'width':image.width,'height':image.height})
          if len(records)!=4:raise ValueError('Expected one source selection screenshot in each of four profiles; got '+str(len(records)))
          (dest/'image-selection-provenance.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'source_run':os.environ['SOURCE_RUN'],'scope':'actual synthetic native captures, not user photos; lossy previews, not pixel-exact assertions or physical acceptance','release_approval':False,'records':records},indent=2)+'\n')
          PY
      - name: Gate and append only source-pinned selection preview documentation
        run: |
          set -euo pipefail
          git checkout -B arena/3caca636-tictic "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add "mynotes/docs/design-2026-10-29/native/$SOURCE_RUN"
          git commit -m "Preserve source-pinned image selection previews from $SOURCE_RUN [skip ci]"
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
          done
