name: Candidate70 API26 focus-preflight supplement on exact existing APK
'on':
  push:
    branches:
    - arena/3caca636-tictic
    paths:
    - .github/workflows/notes-improvement70-api26.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: improvement70-api26-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: api26-portrait
          api: '26'
          target: default
          font: '1.0'
          night: 'no'
          orientation: portrait
    env:
      CASES: app.space.notes.CoreJourneysTest#searchPassageShowsBodyMatchWithoutChangingNote,app.space.notes.CoreJourneysTest#formattingBudgetPreservesWritingAndSelection,app.space.notes.CoreJourneysTest#adaptiveNotesFormatIncludesFontSizeAndParagraphNumbering,app.space.notes.CoreJourneysTest#adaptiveNotesPendingInlineStyleLeavesEarlierWordsAlone,app.space.notes.CoreJourneysTest#adaptiveEditorRailsKeepWritingBetweenActualToolColumns,app.space.notes.EnvironmentQualificationTest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v8.0.2
      with:
        name: improvement70-test-apks
        path: improvement-apks
        github-token: ${{ github.token }}
        run-id: '42228792197'
    - name: Prepare emulator
      run: 'sudo chmod 666 /dev/kvm

        bash mynotes/tools/ci/use_installed_emulator.sh

        '
    - uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api }}
        target: ${{ matrix.target }}
        arch: x86_64
        profile: Nexus 5
        disable-animations: 'false'
        emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores
          2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
        script: 'python3 -m mynotes.tools.ci.offline_guest

          adb install -r improvement-apks/debug/notes-debug.apk

          adb install -r improvement-apks/androidTest/debug/notes-debug-androidTest.apk

          sha256sum improvement-apks/debug/notes-debug.apk > refinement-native-apk-sha256.txt

          adb shell dumpsys package app.space.notes.debug > refinement-native-package.txt

          adb shell settings put system font_scale ${{ matrix.font }}

          adb shell cmd uimode night ${{ matrix.night }}

          python3 -m mynotes.tools.ci.native_environment --settle-app

          python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation
          }}

          python3 -m mynotes.tools.ci.native_environment --snapshot configured

          bash mynotes/tools/ci/run_refinement_instrumentation.sh -e expectedFont
          ${{ matrix.font }} -e expectedNight ${{ matrix.night }} -e expectedOrientation
          ${{ matrix.orientation }} -e expectedMotion 1 -e class "$CASES"

          python3 -m mynotes.tools.ci.verify_recognition_pilot --classes "$CASES"

          '
    - name: Reject absent or partial assertion results
      if: always()
      run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes "$CASES"
    - uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: improvement70-${{ matrix.id }}
        path: 'refinement-native*

          refinement-captures.tar

          refinement-environment-*

          offline-guest-proof.json

          '
        retention-days: '14'
        if-no-files-found: warn
