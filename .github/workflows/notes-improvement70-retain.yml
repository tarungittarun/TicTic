name: Retain candidate70 original qualification evidence
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-improvement70-retain.yml']
permissions:
  actions: read
  contents: write
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN: '42230660156'
      BUILD_RUN: '42228792197'
      NATIVE_FLAT_LANE: improvement70-api26-portrait
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3 Pillow==11.3.0 reportlab==4.4.4 PyMuPDF==1.26.7
      - name: Wait for exact source run, never equate its success with acceptance
        run: |
          python - <<'PY'
          import os,json,subprocess,time
          for _ in range(132):
              result=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/'+os.environ['SOURCE_RUN']]))
              if result['status']=='completed':
                  print('Source conclusion:',result['conclusion']);break
              time.sleep(10)
          else:raise SystemExit('Source qualification incomplete; do not invent evidence')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: improvement70-api*
          path: native-originals
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: improvement70-build-evidence
          path: build-originals
      - name: Retain bounded public screenshots, exact assertions and new JVM regressions
        run: python mynotes/tools/comparisons/retain_improvement.py native-originals build-originals "$SOURCE_RUN" "$BUILD_RUN"
      - name: Gate evidence and save only on the active session branch
        run: |
          git pull --ff-only origin arena/3caca636-tictic
          python -m unittest discover -s qa
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/ux-improvement-ledger/implementations
          git commit -m "Retain candidate70 qualification originals, not whole-app acceptance [skip ci]"
          git push origin arena/3caca636-tictic
