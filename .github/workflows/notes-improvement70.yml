# Candidate71: retain API26 three-line failure; compact actual header/scroll padding instead of lowering the assertion.
# Qualification correction: existing OfflineOcrTest imports require the opt-in instrumentation dependency; no assertion was run or weakened in first build.
name: Candidate71 compact Format follow-up and search and formatting qualification
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-improvement70.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: improvement71-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Compile actual candidate, JVM tests, instrumentation and lint (no publication)
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:assembleRelease :notes:lintDebug :notes:lintRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/improvement71-build.log
      - name: Surface bounded compiler diagnostics
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/improvement71-build.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: improvement71-build-evidence
          path: |
            mynotes/domain/build/test-results
            mynotes/app/build/reports
            mynotes/runtime/build/reports
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: improvement71-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 3
          if-no-files-found: error
  native:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: api36-portrait, api: 36, target: google_apis, font: '1.0', night: 'no', orientation: portrait}
          - {id: api34-large, api: 34, target: google_apis, font: '1.5', night: 'no', orientation: portrait}
          - {id: api34-landscape, api: 34, target: google_apis, font: '1.0', night: 'yes', orientation: landscape}
          - {id: api26-portrait, api: 26, target: default, font: '1.0', night: 'no', orientation: portrait}
    env:
      CASES: app.space.notes.CoreJourneysTest#searchPassageShowsBodyMatchWithoutChangingNote,app.space.notes.CoreJourneysTest#formattingBudgetPreservesWritingAndSelection,app.space.notes.CoreJourneysTest#adaptiveNotesFormatIncludesFontSizeAndParagraphNumbering,app.space.notes.CoreJourneysTest#adaptiveNotesPendingInlineStyleLeavesEarlierWordsAlone,app.space.notes.CoreJourneysTest#adaptiveEditorRailsKeepWritingBetweenActualToolColumns,app.space.notes.EnvironmentQualificationTest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: improvement71-test-apks
          path: improvement-apks
      - name: Prepare emulator
        run: |
          sudo chmod 666 /dev/kvm
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          script: |
            python3 -m mynotes.tools.ci.offline_guest
            adb install -r improvement-apks/debug/notes-debug.apk
            adb install -r improvement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e expectedFont ${{ matrix.font }} -e expectedNight ${{ matrix.night }} -e expectedOrientation ${{ matrix.orientation }} -e expectedMotion 1 -e class "$CASES"
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes "$CASES"
      - name: Reject absent or partial assertion results
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes "$CASES"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: improvement71-${{ matrix.id }}
          path: |
            refinement-native*
            refinement-captures.tar
            refinement-environment-*
            offline-guest-proof.json
          retention-days: 14
          if-no-files-found: warn
