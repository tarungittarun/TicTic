# Round 4: normalize ./ archive paths; retain verified primary web COPYING where not packed.
# KSP trains; SLT is a speaker-disjoint US regression control, NOT an Indian held-out benchmark.
# Research only: public CMU ARCTIC data + Whisper MIT; no user audio, app changes or publication.
# Primary source license + Indian training-speaker metadata and pinned archive hashes must pass first.
name: MyNotes licensed Indian speech training pilot (quarantined)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-indian-speech-pilot.yml']
permissions:
  contents: read
concurrency:
  group: notes-indian-speech-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  licensed-training-pilot:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PILOT: /tmp/mynotes-indian-speech-pilot
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify primary data licenses and speaker metadata; prepare bounded, speaker-disjoint public clips
        run: |
          set -o pipefail
          python -m mynotes.tools.ci.indian_speech_pilot prepare --output "$PILOT" 2>&1 | tee /tmp/indian-pilot-prepare.log
      - name: Install pinned CPU-only experimental training dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 numba==0.61.2 tiktoken==0.9.0 more-itertools==10.7.0 tqdm==4.67.1
          python -m pip install --no-deps openai-whisper==20250625
      - name: Optimize only final decoder block; score identical held-out clips before and after
        run: |
          set -o pipefail
          python -m mynotes.tools.ci.indian_speech_pilot train --output "$PILOT" 2>&1 | tee /tmp/indian-pilot-train.log
      - name: Annotate exact training result, never count a download or audit as optimization
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          output=Path(os.environ['PILOT']);report=output/'training-report.json'
          if report.is_file():
              data=json.loads(report.read_text())
              text={key:data[key] for key in ['optimizer_steps','modified_parameters','training_clips','training_seconds','elapsed_seconds','adopted']}
              text.update(baseline_wer=data['baseline']['wer'],adapted_wer=data['adapted']['wer'])
              print('::notice title=Quarantined training result::'+json.dumps(text))
          else:
              print('::warning title=No completed training result::No completed optimization report. Do not claim training or app model replacement; inspect failed step.')
              for name in ['prepare','train']:
                  log=Path('/tmp/indian-pilot-'+name+'.log')
                  if log.is_file():
                      excerpt=log.read_text()[-5000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::notice title=Pilot '+name+' diagnostics::'+excerpt)
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: indian-speech-pilot-research-only
          path: |
            ${{ env.PILOT }}/data-report.json
            ${{ env.PILOT }}/training-report.json
            ${{ env.PILOT }}/licenses/
            ${{ env.PILOT }}/MODIFICATIONS.txt
            ${{ env.PILOT }}/experimental-decoder-last-block.pt
          if-no-files-found: warn
          retention-days: 14
