name: Kannada best-weight Android study (nonshipping)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-kan-best-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mynotes/tools
      - name: Verify exact candidate62 debug foundation identity
        run: |
          python3 - <<'PY'
          import json,subprocess
          a=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13294803770']))
          assert not a['expired']
          assert a['workflow_run']['head_sha']=='84a02f6f954add7bf1b6a8ea3a8d0c12a59ebebd'
          assert a['workflow_run']['id']==41771337080
          assert a['digest']=='sha256:5f80459fe2bc4ea375af198c4822fd8e0884d2836df0d4447325a7e66a482871'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41771337080
          name: module-foundation-test-apks
          path: foundation
      - name: Fetch pinned Apache-2.0 Kannada best weights, preserve all other APK payloads
        run: |
          APP=$(find foundation -name notes-debug.apk -print -quit)
          test -n "$APP"
          python3 -m mynotes.tools.ci.kan_best_derivative --app "$APP" --output best-unsigned.apk
      - name: Sign debug-only derivatives with one ephemeral research key and retain payload proof
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from mynotes.tools.ci.resign_public_benchmark_apks import payload
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          key=pathlib.Path('ephemeral-kan-best-smoke.jks')
          subprocess.run(['keytool','-genkeypair','-keystore',str(key),'-storepass','android','-keypass','android','-alias','smoke','-keyalg','RSA','-validity','2','-dname','CN=Nonshipping public Kannada weight study'],check=True)
          proof={'adopted':False,'scope':'Debug-only research, same compiled Java/native/test payload. Not a release APK.','files':[]}
          originals=[('fast',next(pathlib.Path('foundation').rglob('notes-debug.apk'))),('best',pathlib.Path('best-unsigned.apk')),('test',next(pathlib.Path('foundation').rglob('*androidTest.apk')))]
          for role,file in originals:
              package=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(file)],text=True).splitlines()[0]
              expected='app.space.notes.debug.test' if role=='test' else 'app.space.notes.debug'
              assert "name='"+expected+"'" in package,package
              before=payload(file);aligned=pathlib.Path(role+'-aligned.apk');out=pathlib.Path(role+'-smoke.apk')
              subprocess.run([str(tools/'zipalign'),'-f','-P','16','4',str(file),str(aligned)],check=True)
              subprocess.run([str(tools/'apksigner'),'sign','--ks',str(key),'--ks-pass','pass:android','--key-pass','pass:android','--out',str(out),str(aligned)],check=True)
              subprocess.run([str(tools/'apksigner'),'verify',str(out)],check=True)
              assert payload(out)==before,'Unexpected code/resource modification'
              proof['files'].append({'role':role,'package':package,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'bytes':out.stat().st_size,'unchanged_unsigned_payload':True})
          key.unlink()
          pathlib.Path('signing-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nonshipping-kan-best-debug-apks
          path: |
            *-smoke.apk
            signing-proof.json
            best-unsigned.json
          if-no-files-found: error
          retention-days: 3
  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: min-api26, api: 26}
          - {id: api34, api: 34}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mynotes/tools
            mynotes/app/src/androidTest
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nonshipping-kan-best-debug-apks
      - name: Enable KVM and prefer the installed emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2 -feature -Vulkan
          disable-animations: true
          script: bash mynotes/tools/ci/run_kan_best_native.sh
      - name: Independently retain every native assertion for BOTH weight sets
        if: always()
        run: |
          failed=0
          for model in fast best; do
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.OfflineOcrTest --log "$model-native.txt" --output "$model-verified.json" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nonshipping-kan-best-native-${{ matrix.id }}
          path: |
            *-native.txt
            *-verified.json
            *-storage.txt
            *proof.json
            best-unsigned.json
            *refinement-native-*.txt
          if-no-files-found: error
          retention-days: 7
