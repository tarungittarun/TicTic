# Final67 qualification: native range ownership passed180/180 focused checks in41874321912; exact source, all437 methods/profile,4752 main inferences plus8 separately scored public-scene observations.
# Candidate67: preserve Notes manual range viewport through IME/relayout; retain strict after-layout scroll assertion that exposed this defect.
# Candidate67: honor manual selected-range viewport even for already queued / unconditional relayout caret reveals; reset intent on a real selection/caret change.
# Candidate67 followup: custom range-preserving dispatch now cancels Doc caret-reveal lease before manual scroll; source-qualified replacement, not a waiver of prior outcome.
# Candidate67: full437-method four-profile qualification after focused UI gates; additional public poster/sign observations separate from4752 main corpus. No physical acceptance.
# Candidate66: fix actual rotation clipping; pin primary image actions outside secondary scroll. Gate full corpus/native lanes on all four recognition-focus profiles first.
# Candidate65: exact-zero silence preflight, explicit image-text copy and image-led accessible tools. Full new-source qualification; no model added or speech attention adoption.
# Candidate63: bounded same-script consensus; retain tight native boxes, source pixels and exact original API26 assertion. 41782476953 passed both APIs and one-profile historical audit. No weight addition or training.
# Candidate62: preserve already readable paper ink; repair independently observed Kannada/mixed-script interpolation regressions.
# Candidate61: real-world screenshot source preservation, fresh-area inference, empty-only adaptive fallback and restrained motion. Models unchanged.
# Execute candidate60 production repair against complete native and original recognition corpus; source-pinned failed reproduction retained separately.
# Cycle60: reproduce stale hOCR versus UTF8 selection disagreement, repair correspondence, rerun exact full corpus and native assertions. No model training.
#331-method JVM gate found numeric fallback accepted a lower-confidence rewrite; fixed the production guard, unchanged failing test retained.
# Regression58 retry: Actions exposed diagnostic-only TessBaseAPI compile classpath; add exact runtime-matching test dependency only under moduleE2E. No runtime assertion or app fix changed.
# Regression cycle1 / v58: native labelled transactional PDF checkbox, unchanged OCR output plus separately timed PUBLIC failed-case segmentation diagnostics.
# Round2: original CMU archive omits COPYING; require exact retained primary-source grant bound to the same archive, not an assumed license. No app assertion/model change.
# Separate baseline evaluation: no model training, production APK publication or user uploads.
name: MyNotes ordered module E2E and recognition performance
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-module-e2e.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: notes-module-e2e-regression67-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Prepare public ground-truth evaluation corpus, verify original licenses and hashes
        run: |
          python3 -m mynotes.tools.ci.module_corpus --output mynotes/benchmarks/assets/module-corpus
          cp mynotes/docs/regression/ocr-heldout-v1.json mynotes/benchmarks/assets/module-corpus/ocr-heldout-v1.json
          cp -r mynotes/report-assets/public-ocr-scenes-v2 mynotes/benchmarks/assets/public-scenes-v2
          cp -r mynotes/report-assets/public-ocr-scenes-v3 mynotes/benchmarks/assets/public-scenes-v3
      - name: Compile debug app/instrumentation and lint without publication
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug :notes:assembleRelease :notes:lintRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/refinement-native-build.log
      - name: Verify exact executed JVM coverage
        if: always()
        run: python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/refinement-jvm.json
      - name: Bounded compiler and lint diagnostics in check annotations
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/refinement-native-build.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: module-foundation-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - name: Enforce previous 155MB-class release budget and account for bytes
        run: |
          python3 -m mynotes.tools.ci.apk_size_audit mynotes/app/build/outputs/apk/release/notes-release.apk evidence/release-apk-size.json
          python3 - <<'PY'
          from pathlib import Path
          # Existing qualified release was 155,165,372 bytes. Allow at most 1MiB
          # for code/resources; never silently add tens of MB of new model assets.
          size=Path('mynotes/app/build/outputs/apk/release/notes-release.apk').stat().st_size
          assert size <= 156213948, f'Release APK exceeds bounded growth budget: {size}'
          PY
      - name: Prepare genuinely new signed development APK, not a public release
        run: |
          set -euo pipefail
          cp mynotes/app/build/outputs/apk/release/notes-release.apk MyNotes-v0.67.0-67-development.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs MyNotes-v0.67.0-67-development.apk | tee notes-development-signature.txt
          grep -Fq '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' notes-development-signature.txt
          sha256sum MyNotes-v0.67.0-67-development.apk > notes-development-sha256.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: MyNotes-v0.67.0-67-development.apk
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-foundation-lint
          path: |
            mynotes/runtime/build/generated/trained-whisper-assets/voice/trained-whisper.json
            evidence/refinement-jvm.json
            evidence/release-apk-size.json
            mynotes/app/build/reports/lint-results-debug.*
            mynotes/benchmarks/assets/module-corpus/manifest.json
            mynotes/benchmarks/assets/module-corpus/*-COPYING.txt
          retention-days: 7
          if-no-files-found: warn
  native:
    needs: [build, recognition_focus]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preflight runner emulator without unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            timeout 60s adb shell settings put global airplane_mode_on 1
            timeout 60s adb shell svc wifi disable
            timeout 60s adb shell svc data disable
            timeout 60s adb install -r refinement-apks/debug/notes-debug.apk
            timeout 60s adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            timeout 60s adb shell settings put system font_scale 1.0
            timeout 60s adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            timeout 30s adb shell settings put global stay_on_while_plugged_in 3
            timeout 60s adb shell settings put system screen_off_timeout 3600000
            timeout 60s adb shell input keyevent KEYCODE_WAKEUP
            timeout 60s adb shell wm dismiss-keyguard
            python3 -m mynotes.tools.ci.run_ordered_modules --night ${{ matrix.night }} --orientation ${{ matrix.orientation }}
            timeout 60s adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-native-${{ matrix.id }}-ordered
          path: |
            refinement-captures.tar
            refinement-native*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn

  benchmark:
    needs: [build, recognition_focus]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait-ocr, night: 'no', orientation: portrait, workload: ocr}
          - {id: light-portrait-voice0, night: 'no', orientation: portrait, workload: voice0}
          - {id: light-portrait-voice1, night: 'no', orientation: portrait, workload: voice1}
          - {id: dark-portrait-ocr, night: 'yes', orientation: portrait, workload: ocr}
          - {id: dark-portrait-voice0, night: 'yes', orientation: portrait, workload: voice0}
          - {id: dark-portrait-voice1, night: 'yes', orientation: portrait, workload: voice1}
          - {id: light-landscape-ocr, night: 'no', orientation: landscape, workload: ocr}
          - {id: light-landscape-voice0, night: 'no', orientation: landscape, workload: voice0}
          - {id: light-landscape-voice1, night: 'no', orientation: landscape, workload: voice1}
          - {id: dark-landscape-ocr, night: 'yes', orientation: landscape, workload: ocr}
          - {id: dark-landscape-voice0, night: 'yes', orientation: landscape, workload: voice0}
          - {id: dark-landscape-voice1, night: 'yes', orientation: landscape, workload: voice1}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preflight runner emulator without unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            timeout 60s adb shell settings put global airplane_mode_on 1
            timeout 60s adb shell svc wifi disable
            timeout 60s adb shell svc data disable
            timeout 60s adb install -r refinement-apks/debug/notes-debug.apk
            timeout 60s adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            timeout 60s adb shell settings put system font_scale 1.0
            timeout 60s adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            timeout 30s adb shell settings put global stay_on_while_plugged_in 3
            timeout 60s adb shell settings put system screen_off_timeout 3600000
            timeout 60s adb shell input keyevent KEYCODE_WAKEUP
            timeout 60s adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_module_benchmark.sh ${{ matrix.workload }} ${{ matrix.night }} ${{ matrix.orientation }}
            if [ "${{ matrix.workload }}" = ocr ]; then bash mynotes/tools/ci/run_additional_public_scene_study.sh ${{ matrix.night }} ${{ matrix.orientation }}; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-benchmark-${{ matrix.id }}
          path: |
            module-benchmark.tar
            module-execution.json
            additional-public-*
            refinement-native.txt
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn
  recognition_focus:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate runner emulator and avoid unnecessary latest upgrade
        run: bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            timeout 60s adb shell settings put global airplane_mode_on 1
            timeout 60s adb shell svc wifi disable
            timeout 60s adb shell svc data disable
            timeout 60s adb install -r refinement-apks/debug/notes-debug.apk
            timeout 60s adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            timeout 60s adb shell settings put system font_scale 1.0
            timeout 60s adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            timeout 30s adb shell settings put global stay_on_while_plugged_in 3
            timeout 60s adb shell settings put system screen_off_timeout 3600000
            timeout 60s adb shell input keyevent KEYCODE_WAKEUP
            timeout 60s adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e class app.space.notes.OfflineOcrTest,app.space.notes.OfflineSpeechTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.runtime.NotesMotionTest,app.space.notes.runtime.ImageRegionTextTest,app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#nativeNotesSelectionSurvivesUnselectedAreaScroll,app.space.notes.CoreJourneysTest#nativeDocSelectionSurvivesUnselectedAreaScroll
            python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.OfflineOcrTest,app.space.notes.OfflineSpeechTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.runtime.NotesMotionTest,app.space.notes.runtime.ImageRegionTextTest,app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#nativeNotesSelectionSurvivesUnselectedAreaScroll,app.space.notes.CoreJourneysTest#nativeDocSelectionSurvivesUnselectedAreaScroll
            timeout 60s adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -m mynotes.tools.ci.native_environment --snapshot after
      - name: Require all native pilot assertions even after emulator failure
        if: always()
        run: python3 -m mynotes.tools.ci.verify_recognition_pilot --classes app.space.notes.OfflineOcrTest,app.space.notes.OfflineSpeechTest,app.space.notes.runtime.ImageSelectionTest,app.space.notes.runtime.NotesMotionTest,app.space.notes.runtime.ImageRegionTextTest,app.space.notes.runtime.ViewedFileJourneysTest,app.space.notes.CoreJourneysTest#nativeHomeLongHoldDragPersistsUserOrderWithoutChangingDocuments,app.space.notes.CoreJourneysTest#nativeNotesBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#nativeDocBottomToTopDragScrollsAcrossThirtySixCards,app.space.notes.CoreJourneysTest#wholeAppLibraryTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#wholeAppSettingsTraversalRecordsEachVisitedPage,app.space.notes.CoreJourneysTest#nativeNotesSelectionSurvivesUnselectedAreaScroll,app.space.notes.CoreJourneysTest#nativeDocSelectionSurvivesUnselectedAreaScroll
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recognition-focused-${{ matrix.id }}
          path: |
            refinement-captures.tar
            refinement-native*
            ordered-module-*
            refinement-environment-*
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: warn

  report:
    if: always() && github.ref == 'refs/heads/arena/3caca636-tictic'
    needs: [build, native, benchmark, recognition_focus]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: module-native-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: module-benchmark-*
          path: module-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: module-foundation-lint
          path: module-artifacts/foundation
      - name: Generate module-ordered results, independent scores and screenshot PDF even on failures
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3 uharfbuzz==0.52.0
          python3 -m mynotes.tools.build_module_e2e_report --additional-scenes-required --artifacts module-artifacts --output mynotes/docs/module-e2e/${RUN_ID} --source ${SOURCE_SHA} --run ${RUN_ID}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: module-ordered-executed-report
          path: mynotes/docs/module-e2e/${{ github.run_id }}
          retention-days: 7
      - name: Gate and preserve actual report evidence, including failures without relabelling
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'arena/3caca636-tictic'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/module-e2e/${{ github.run_id }}
          git commit -m 'Preserve separate module-ordered E2E, measured OCR/voice ground truth and performance [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
