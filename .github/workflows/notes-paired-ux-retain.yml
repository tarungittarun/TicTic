name: Retain fresh paired UX evidence on the active branch
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-paired-ux-retain.yml']
permissions:
  actions: read
  contents: write
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_RUN: '42217122419'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3
      - name: Wait for the named session without treating workflow success as UX quality
        run: |
          python - <<'PY'
          import os,json,subprocess,time
          run=os.environ['SOURCE_RUN']
          for _ in range(90):
              result=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/'+run]))
              if result['status']=='completed':
                  print('Source run conclusion:',result['conclusion'],'(not an app UX result)');break
              time.sleep(10)
          else:raise SystemExit('Source session not completed; no evidence retained or acceptance inferred')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: paired-ux-fresh-session
          path: source-session
      - name: Preserve exact native screenshots, UI trees, metrics and command trace
        run: |
          python mynotes/tools/comparisons/retain_paired_ux.py source-session "$SOURCE_RUN"
      - name: Gate and save evidence only on this session branch
        run: |
          git pull --ff-only origin arena/3caca636-tictic
          python -m unittest discover -s qa
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/ux-improvement-ledger/sessions
          git commit -m 'Retain fresh paired-app native evidence without inventing usability acceptance [skip ci]'
          git push origin arena/3caca636-tictic
