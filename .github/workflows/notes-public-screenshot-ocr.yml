name: Public real Android screenshot OCR baseline, unchanged production engine
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-public-screenshot-ocr.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Verify exact public source bytes and prepare test-only assets
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,shutil
          root=pathlib.Path('mynotes/report-assets/public-ocr-screenshots');manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['production_packaged'] is False and manifest['license']=='Apache-2.0'
          def gitblob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          license=(root/'LICENSE').read_bytes();assert gitblob(license)==manifest['license_git_blob'] and hashlib.sha256(license).hexdigest()==manifest['license_sha256']
          for row in manifest['records']:
              data=(root/row['file']).read_bytes();assert gitblob(data)==row['git_blob'] and hashlib.sha256(data).hexdigest()==row['sha256']
          shutil.copytree(root,'mynotes/benchmarks/assets/public-screenshots')
          PY
      - name: Compile evaluation APKs only, no production publication
        working-directory: mynotes
        run: sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: public-screenshot-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
  evaluate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: public-screenshot-test-apks
          path: apks
      - name: Enable KVM and verified installed emulator
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            python3 -m mynotes.tools.ci.offline_guest
            adb install -r apks/debug/notes-debug.apk
            adb install -r apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell settings put system screen_off_timeout 3600000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --settle-app
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            bash -c 'set +e; python3 mynotes/tools/ci/instrumentation_watchdog.py timeout 900s adb shell am instrument -w -r -e timeout_msec 840000 -e expectedNight "${{ matrix.night }}" -e expectedOrientation "${{ matrix.orientation }}" -e class app.space.notes.EnvironmentQualificationTest,app.space.notes.PublicScreenshotBenchmark app.space.notes.debug.test/androidx.test.runner.AndroidJUnitRunner; code=$?; adb exec-out run-as app.space.notes.debug cat files/public-screenshot-benchmark.json > public-screenshot-benchmark.json; exit "$code"'
      - name: Independently score retained text and require every case and environment assertion
        if: always()
        run: python3 -m mynotes.tools.ci.verify_public_screenshots
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: public-screenshot-${{ matrix.id }}-evidence
          path: |
            public-screenshot-benchmark.json
            public-screenshot-independent.json
            refinement-native.*
            refinement-environment-*
            offline-guest-proof.json
            emulator-preflight.txt
          retention-days: 7
          if-no-files-found: error
