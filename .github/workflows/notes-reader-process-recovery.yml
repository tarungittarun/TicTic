# Infrastructure-only fresh attempt:41471654194 timed out booting before any probe assertion; rerun API refused this branch-only workflow. Same raw38 bytes and unchanged assertions.
# Pin final candidate38 bytes; parse actual ActivityRecord whitespace and retain stopped-state observations without relaxing PID/query/page/source-byte checks.
# Navigate the real scrollable Library menu to Open file; keep actual PID, state and source-byte assertions.
# Probe retry: use the real local SAF picker, explicitly choose MyNotes Word pages, retain failure phase before interpreting recovery.
# Exact already-built release38 bytes; public disposable-emulator process recovery only.
name: MyNotes release38 actual reader process recovery (nonpublishing)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-reader-process-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  public-recovery-probe:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gate source and verified APK source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s qa
          python3 - <<'PY'
          import json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41469717511']))
          assert run['head_sha']=='62c3c22b827c46dcc1a3c4af56c907f6f27015b2'
          jobs=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41469717511/jobs?per_page=100']))['jobs']
          assert next(job for job in jobs if job['name']=='build')['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41469717511
          name: MyNotes-v0.35.0-38-development.apk
          path: candidate-apk
      - name: Verify exact bytes signer package version minimum API and no Internet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          files=list(Path('candidate-apk').rglob('*.apk'));assert len(files)==1
          file=files[0];sha=hashlib.sha256(file.read_bytes()).hexdigest()
          meta=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13155455677']))
          assert meta['workflow_run']['id']==41469717511 and meta['workflow_run']['head_sha']=='62c3c22b827c46dcc1a3c4af56c907f6f27015b2'
          assert sha=='d0285d28318211854cb175bfb983f3f3c1f8180bc8d4106349ee2dd35c2ff3c7'==meta['digest'].removeprefix('sha256:')
          assert file.stat().st_size==155142244==meta['size_in_bytes']
          tools=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(file)],text=True)
          assert '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' in cert
          manifest=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(file)],text=True)
          assert "package: name='app.space.notes' versionCode='38' versionName='0.35.0'" in manifest
          assert "sdkVersion:'26'" in manifest and 'android.permission.INTERNET' not in manifest
          Path('reader-apk-identity.json').write_text(json.dumps({'artifact_id':13155455677,'source_run':41469717511,'source_sha':meta['workflow_run']['head_sha'],'sha256':sha,'bytes':file.stat().st_size,'release_approval':False},indent=2)+'\n')
          PY
      - name: Prepare emulator host dependencies and KVM
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Bounded SDK-only bootstrap, never retry the recovery assertions
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 2>&1 | tee -a reader-sdk-bootstrap.txt; then
              if "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee -a reader-sdk-bootstrap.txt; then installed=true; break; fi
            fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then echo '::error::Emulator SDK bootstrap failed; no recovery result'; exit 1; fi
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install candidate-apk/MyNotes-v0.35.0-38-development.apk
            python3 -m mynotes.tools.ci.reader_process_recovery_smoke --expected-code 38 --output evidence/reader-process-recovery
      - name: Retain only public fixture evidence, not a release
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-reader-process-recovery-release38
          path: |
            reader-apk-identity.json
            reader-sdk-bootstrap.txt
            evidence/reader-process-recovery
          retention-days: 7
          if-no-files-found: warn
      - name: Surface true recovery results only after all fixture assertions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/reader-process-recovery/reader-process-recovery.json').read_text())
          assert report['ok'] is True and len(report['records'])==3
          print('::notice title=Actual emulator process recovery public fixtures only::'+json.dumps(report))
          PY
