# Pin code48 exact already-built bytes; qualification still pending. No public release, private input, uninstall or clear-data; synthetic emulator only.
# Match the qualified native guest RAM after pre-reader UIAutomator collector exit137; no assertion retries or app force-stop.
# Prepopulate all three public fixture files before SAF opens; retain meaningful picker labels on a navigation failure. No APK or recovery assertion changes.
# Infrastructure-only fresh attempt:41471654194 timed out booting before any probe assertion; rerun API refused this branch-only workflow. Same raw38 bytes and unchanged assertions.
# Pin final candidate38 bytes; parse actual ActivityRecord whitespace and retain stopped-state observations without relaxing PID/query/page/source-byte checks.
# Navigate the real scrollable Library menu to Open file; keep actual PID, state and source-byte assertions.
# Probe retry: use the real local SAF picker, explicitly choose MyNotes Word pages, retain failure phase before interpreting recovery.
# Exact already-built release48 bytes; public disposable-emulator process recovery only.
name: MyNotes release48 actual reader process recovery (nonpublishing)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-reader-process-recovery.yml']
permissions:
  contents: write
  actions: read
jobs:
  public-recovery-probe:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gate source and verified APK source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s qa
          python3 - <<'PY'
          import json,subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41563381532']))
          assert run['head_sha']=='1c029ad144d96f6b9ce761a725677b91b67a1710'
          jobs=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/41563381532/jobs?per_page=100']))['jobs']
          assert next(job for job in jobs if job['name']=='build')['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41563381532
          name: MyNotes-v0.45.0-48-development.apk
          path: candidate-apk
      - name: Verify exact bytes signer package version minimum API and no Internet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          files=list(Path('candidate-apk').rglob('*.apk'));assert len(files)==1
          file=files[0];sha=hashlib.sha256(file.read_bytes()).hexdigest()
          meta=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/artifacts/13198317853']))
          assert meta['workflow_run']['id']==41563381532 and meta['workflow_run']['head_sha']=='1c029ad144d96f6b9ce761a725677b91b67a1710'
          assert sha=='ce7bffd1f8973d0ea6c4c7c1fc9e55bf7b687eabc94a330fbf2bcd6080ae8dff'==meta['digest'].removeprefix('sha256:')
          assert file.stat().st_size==155153404==meta['size_in_bytes']
          tools=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(file)],text=True)
          assert '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' in cert
          manifest=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(file)],text=True)
          assert "package: name='app.space.notes' versionCode='48' versionName='0.45.0'" in manifest
          assert "sdkVersion:'26'" in manifest and 'android.permission.INTERNET' not in manifest
          Path('reader-apk-identity.json').write_text(json.dumps({'artifact_id':13198317853,'source_run':41563381532,'source_sha':meta['workflow_run']['head_sha'],'sha256':sha,'bytes':file.stat().st_size,'release_approval':False},indent=2)+'\n')
          PY
      - name: Prepare emulator host dependencies and KVM
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Bounded SDK-only bootstrap, never retry the recovery assertions
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 2>&1 | tee -a reader-sdk-bootstrap.txt; then
              if "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee -a reader-sdk-bootstrap.txt; then installed=true; break; fi
            fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then echo '::error::Emulator SDK bootstrap failed; no recovery result'; exit 1; fi
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -memory 3072 -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install candidate-apk/MyNotes-v0.45.0-48-development.apk
            python3 -m mynotes.tools.ci.reader_process_recovery_smoke --expected-code 48 --output evidence/reader-process-recovery
      - name: Retain only public fixture evidence, not a release
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-reader-process-recovery-release48
          path: |
            reader-apk-identity.json
            reader-sdk-bootstrap.txt
            evidence/reader-process-recovery
          retention-days: 7
          if-no-files-found: warn
      - name: Surface true recovery results only after all fixture assertions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/reader-process-recovery/reader-process-recovery.json').read_text())
          assert report['ok'] is True and len(report['records'])==3
          print('::notice title=Actual emulator process recovery public fixtures only::'+json.dumps(report))
          PY
      - name: Preserve successful actual-process public reports only
        run: |
          python3 - <<'PYRETAIN'
          import json,os,shutil
          from pathlib import Path
          source=Path('evidence/reader-process-recovery/reader-process-recovery.json')
          report=json.loads(source.read_text())
          assert report['ok'] is True and report['package_code']==48 and report['api']==34
          assert report['force_stop_uninstall_clear_data'] is False and report['release_approval'] is False
          assert {record['name'] for record in report['records']}=={'ReaderRecovery.pdf','ReaderRecovery.docx','ReaderRecovery.csv'} and len(report['records'])==3
          for record in report['records']:
              assert record['before_pid']!=record['after_pid'] and record['before_pid']>0 and record['after_pid']>0
              assert record['stopped_before_kill'] is True and record['query_restored'] is True and record['original_unchanged'] is True
              assert record['visible_row_restored']==41 if record['name'].endswith('.csv') else record['page_2_restored'] is True
          root=Path('mynotes/docs/design-2026-10-29/process-recovery')/os.environ['GITHUB_RUN_ID'];root.mkdir(parents=True,exist_ok=True)
          for file in (source,Path('reader-apk-identity.json')):
              assert 0<file.stat().st_size<20000;shutil.copyfile(file,root/file.name)
          (root/'provenance.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['GITHUB_SHA'],'release_approval':False,'scope':report['scope']},indent=2)+'\n')
          PYRETAIN
      - name: Gate and commit only successful public evidence to session branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add "mynotes/docs/design-2026-10-29/process-recovery/${{ github.run_id }}"
          git commit -m 'Preserve successful exact-byte48 synthetic verification evidence, limited scope [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
            git diff --check
          done
