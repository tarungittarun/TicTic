name: Retain original recognition failure causes (no test retries)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-recognition-failure-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve completed job logs with explicit download failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, subprocess, re
          for job in (126578249961,):
              result = subprocess.run(['gh','api','--allow-escape-sequences',f'repos/tarungittarun/TicTic/actions/jobs/{job}/logs'],capture_output=True,text=True)
              pathlib.Path(f'job-{job}.txt').write_text(result.stdout)
              # Do not print storage URLs with signed query strings.
              stderr = '\n'.join(line.split('?')[0] for line in result.stderr.splitlines())
              clean = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', result.stdout)
              lines = clean.splitlines()
              selected = set(range(max(0,len(lines)-25),len(lines)))
              for i, line in enumerate(lines):
                  if any(word in line.lower() for word in ('panic:', 'error:', '##[error]', 'fatal', 'insufficient', 'not enough', 'emulator: error', 'no space', 'failed to', 'connection refused', 'killed', 'exit code 137', 'out of memory', 'traceback', 'runtimeerror', 'external emulator home', 'modulenotfounderror', 'valueerror', 'syntaxerror', 'importerror', 'externally-managed', 'no matching distribution', 'no module named')):
                      selected.update(range(max(0,i-4), min(len(lines),i+5)))
              # Large missing-test JSON must not push the original provisioning
              # error out of the bounded annotation. Keep earliest causes + tail.
              excerpt = '\n'.join(lines[i][:700] for i in sorted(selected))
              text = (excerpt if len(excerpt) <= 10000 else excerpt[:7500]+'\n[bounded middle omitted]\n'+excerpt[-2000:]) if result.returncode == 0 else f'Log download failed with code {result.returncode}: {stderr}'
              pathlib.Path(f'job-{job}-retrieval.txt').write_text(f'exit={result.returncode}\n'+stderr)
              for i in range(0,len(text),3500):
                  msg=text[i:i+3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::warning title=Retained job {job}::{msg}',flush=True)
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recognition-original-failure-logs
          path: job-*.txt
          if-no-files-found: error
          retention-days: 7
