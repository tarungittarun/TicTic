# Round40: candidate53 API36 Notes IME failure: settle the prior Doc resize before a Notes request, require served visibility twice, recover only unowned focus, observe rather than re-show after acknowledgement, record fail-only startup phase. Original repeated native transitions and every assertion retained. Preserve candidate54 evidence.
# Round39: repair real half-height filter clipping by reclaiming decorative vertical padding; retain full native touch targets, caller hierarchy and cap. TXT test follows view-only default while retaining source/no-import/edit/find checks. Save-pending indicator survives navigation. Preserve candidate53 evidence.
# Round38: code52 physical crash/storage/UI feedback. Defer layout-time drag completion; verify private saves separately from pending folder copies; reviewed selected-folder merge, bounded paged TXT and read-only default, stable half-screen filters, Back/diagram/rename/native-selection fixes. Every prior assertion retained; new regression journeys added.
# Round37: scope IME resize/animation settling to one-time new-document handoff, not ordinary inserted fields. Keep insertion keyboard requests immediate so a following explicit hide is not overridden by a delayed first show. No native assertion changed.
# Round36: API36 Notes/Doc handoff uses the same insets controller to hide/show; defer initial document IME request until resize/IME animation settles. Retain no-reissue, lifecycle bounds and every original visibility assertion.
# Round35: latch Home target during stationary hover to prevent reordering twice before StaggeredGrid layout settles; recover only unowned document focus during startup, never steal another field, and add fail-only IME phase capture. All prior actual gestures/assertions retained.
# Round34: after Android accepts the document IME request, observe visibility but never issue another show against a later user/system hide. Original native List insertion/closeKeyboard/screenshot assertions retained.
# Round33: safe header Back bypasses mutation-only tap guard; queued writes keep running. Document IME startup waits for focused current field/window and actual served visibility, bounded and cancelled on render/detach. Preserve original failing assertions, add stale callback regression.
# Round32: Home drop targets accept selected-card center inside the target, without default far-edge overshoot; preserve pin/cancel/content/persistence/real-input checks. Fail-only drag phase capture and distinct blocked-backup Back assertion phases.
# Round31: anchor floating PDF actions at actual selection and make Copy primary; native probe retrieves real interactive popup windows and retains actual accessibility click/clipboard equality.45 is separate evidence.
# Round30: preserve qualified44 Home drag implementation. Dismiss editor IME on returning Home; use actual Home swipes in the repeated Notes/Doc creation journey (all original IME/content assertions retained). Disclose actual inline-image downscaling.
# Round29: keep unchanged card image previews, targeted selection notifications, fence late backup/storage page jumps, preserve nested caller refresh, correct exact/minimum Word line height, actual PDF long-hold endpoint/accessibility Copy and exact handbook restoration checks. Retain43 evidence independently.
# Round28: fix final-listener initialization caught by42 compiler; initial on-page embedded PDF glyph selection, authored Word spacing/alignment, and exact116-page handbook asset reader checks. No rotated/scanned selection or full Word fidelity claim.
# Round27: physical Home drag ordering and portable presentation state, Library deduplication, diagram context duplicate/delete units and split connector junction. Restore private folder explanation/Backups; retain all original native assertions.
# Round26: physical feedback first patch: non-destructive confirmation icons, Home dock cleanup, independent private library reads, compact inbox, caller Back and styled viewed history. Native checks keep writer blocked to prove read responsiveness.
# Round25: reject unacknowledged/old-target IME readiness; preserve all repeated-transition assertions and original bounds. Candidate40, no retroactive qualification from39.
# Round24: CSV platform MIME aliases and real intercepted picker Intent contract; candidate39, original inventories plus new method. Preinstall API26 SDK/platform/image with bounded SDK-only retries.
# Round23: drawn-host pre-measure restoration regression and real-width offset listener, increasing candidate38. Prior candidate37 run41465255273 passed1314/391; preserve its evidence unchanged.
# Round22 retry: preflight must install libpulse0 before invoking emulator -version, not depend on the later runner action. No app/instrumentation assertion changed.
# Round22: preserve normalized current-page zoom/pan and page offset across width/reconstruction; bounded SDK-only bootstrap retries, never retry test assertions.
# Round21 retry: actual AlertDialog Cancel callback fence; previous API26 SDK emulator ZIP bootstrap failed before any instrumentation. Retain all profiles/cases/assertions.
# Round21: explicit offline scanned-page OCR, bounded viewer reconstruction, request-generation fences and window-specific grid captures.
# Round20: retained image-selector responsive reflow and attached spreadsheet capture; no training/physical acceptance claim.
# Round 19: correct synthetic spreadsheet night-palette/background capture; keep density-aware pinch and all 381 native cases.
# Round 18: density-correct two-pointer fixture; preserve round17 peer evidence rather than cancelling its final shards.
# Round 17: use a multi-line tall-image paragraph to exercise non-final-line spacing in the Word fit regression.
# Round 16: physical-feedback rotation retention, caller-aware Back, fitted Word lines, PDF pinch/share/text access and image selection-first.
# Round 15: correct Word namespace/image-width local scope; qualify all 378 native methods.
# Round 14: 378 owned methods; attached spreadsheet viewport/strict Word checks; viewport-aware PDF scroll fixture.
# Round 13: 377 owned methods; native Word/logo, race-free copy, actual scroll and shared-lock deadlock regression.
# Round 12: fix owned viewer-test compile classpath/PdfDocument cleanup; harden per-request IPC cancellation.
# Previous round 11: optimized CPU + IPC phases; continuous PDF, spreadsheet grid, viewed search and diagnostic filters.
# Source inventory:372 native methods; no missing cases accepted; exact selected partitions computed at runtime.
# Previous round 10: corrected F16 trained payloads, complete GGML validation, private native-fault containment.
# Includes latest private-first startup/far-edge filter tests and intentional speech-worker death.
# Offline image-selection and playback qualification, previous round 9: actual bundled trained Whisper CPU integration, experimental opt-in.
# Retains Vosk default; no private recordings, new Internet permission, or silent model substitution.
# Previous round 8: request IME for the new Notes field,
# never accept transient previous-Doc visibility before issuing that request. Repeated transition regression.
# Independent debug-only Java stack observer and fail-only progress watchdog; no assertion removed.
# 9 jobs planned; 294 JVM; native inventory is computed exhaustively, including actual trained-model inference/cancellation.
# Includes real Tesseract word boxes, selectable viewport/crop ownership, controller save/cancel,
# all 327 baseline methods, and untouched stored audio. No speech training/physical accuracy claim.
# Build + eight parallel native shards; all four profile inventories remain exhaustive.
# Previous24 exhausted; previous10 used4, unused6 kept separate (not silently added).
# Documentation pushes use [skip ci]; cap is not a target or monetary guarantee.
name: MyNotes user refinement qualification (nonpublishing)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-refinement-native.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: notes-refinement-native-round40-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Compile debug app/instrumentation and lint without publication
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug :notes:assembleRelease :notes:lintRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/refinement-native-build.log
      - name: Verify exact executed JVM coverage
        if: always()
        run: python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/refinement-jvm.json
      - name: Bounded compiler and lint diagnostics in check annotations
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/refinement-native-build.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: refinement-foundation-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - name: Prepare clearly named installable development APK
        run: |
          set -euo pipefail
          cp mynotes/app/build/outputs/apk/release/notes-release.apk MyNotes-v0.52.0-55-development.apk
          sha256sum MyNotes-v0.52.0-55-development.apk | tee notes-development-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs MyNotes-v0.52.0-55-development.apk | tee notes-development-signature.txt
          grep -Fq '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' notes-development-signature.txt
      - name: Upload APK directly without ZIP wrapping (not a public Release)
        uses: actions/upload-artifact@v7.0.2
        with:
          path: MyNotes-v0.52.0-55-development.apk
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: refinement-foundation-lint
          path: |
            mynotes/runtime/build/generated/trained-whisper-assets/voice/trained-whisper.json
            evidence/refinement-jvm.json
            mynotes/app/build/reports/lint-results-debug.*
            notes-development-sha256.txt
            notes-development-signature.txt
          retention-days: 7
          if-no-files-found: warn
  native:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.id == 'min-api26' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: min-api26, api: 26, font: 1.0, night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 0, group: all}
          - {id: min-api26-b, api: 26, font: 1.0, night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 1, group: all}
          - {id: large-font-api34, api: 34, font: 2.0, night: 'yes', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 0, group: focused}
          - {id: large-font-api34-b, api: 34, font: 2.0, night: 'yes', orientation: portrait, profile: 'Nexus 5', motion: 0, shard: 1, group: focused}
          - {id: landscape-api34, api: 34, font: 1.0, night: 'no', orientation: landscape, profile: 'Nexus 5', motion: 0, shard: 0, group: focused}
          - {id: landscape-api34-b, api: 34, font: 1.0, night: 'no', orientation: landscape, profile: 'Nexus 5', motion: 0, shard: 1, group: focused}
          - {id: current-api36, api: 36, font: 1.0, night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 1, shard: 0, group: all}
          - {id: current-api36-b, api: 36, font: 1.0, night: 'no', orientation: portrait, profile: 'Nexus 5', motion: 1, shard: 1, group: all}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: refinement-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare exact selected execution inventory
        env:
          REVIEW_GROUP: ${{ matrix.group }}
          REVIEW_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PYPLAN'
          import json,os
          from pathlib import Path
          from mynotes.tools.ci.test_plan import build_plan
          from mynotes.tools.ci.refinement_plan import selected_cases
          plan=build_plan()
          selected=selected_cases(plan,os.environ['REVIEW_GROUP'],int(os.environ['REVIEW_SHARD']))
          Path('refinement-expected.json').write_text(json.dumps(selected))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('REVIEW_CLASSES='+','.join(selected)+'\n')
          PYPLAN
      - name: Install Linux audio loader dependency before emulator version preflight
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Bootstrap emulator package with bounded SDK-only retries
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          installed=false
          packages=(emulator)
          if [ '${{ matrix.api }}' = 26 ]; then packages+=('platforms;android-26' 'system-images;android-26;google_apis;x86_64'); fi
          for attempt in 1 2 3; do
            echo "SDK emulator package bootstrap attempt $attempt/3; no app test has started" | tee -a refinement-native-sdk-bootstrap.txt
            if timeout 180 "$SDK/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}" 2>&1 | tee -a refinement-native-sdk-bootstrap.txt; then
              if "$SDK/emulator/emulator" -version 2>&1 | tee -a refinement-native-sdk-bootstrap.txt; then
                if [ '${{ matrix.api }}' = 26 ]; then
                  if ! python3 -c 'import os,zipfile; from pathlib import Path; p=Path(os.environ["ANDROID_HOME"]); z=zipfile.ZipFile(p/"platforms/android-26/android.jar"); assert z.testzip() is None; assert (p/"system-images/android-26/google_apis/x86_64/system.img").stat().st_size>1048576'; then continue; fi
                fi
                installed=true; break
              fi
            fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then echo '::error::Emulator SDK bootstrap failed after three attempts; no native qualification claimed'; exit 1; fi
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          # AVDs are recreated per job; do not spend shutdown time saving unused snapshots.
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            if test '${{ matrix.api }}' = 26; then adb root; python3 -m mynotes.tools.ci.adb_state --uid 0; fi
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            if test '${{ matrix.api }}' = 26; then adb unroot; python3 -m mynotes.tools.ci.adb_state --uid 2000; fi
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            if test '${{ matrix.api }}' = 36; then adb shell pm grant app.space.notes.debug android.permission.RECORD_AUDIO; fi
            adb shell settings put system font_scale ${{ matrix.font }}
            # Enable app-owned motion on API36; retain OS window-transition determinism.
            adb shell settings put global animator_duration_scale ${{ matrix.motion }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --snapshot before
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            if test '${{ matrix.api }}' = 34; then python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home; fi
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb logcat -G 8M || true # Synthetic CI observer only; retain CPU timings beyond the final 500 lines.
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_refinement_instrumentation.sh -e timeout_msec 180000 -e expectedFont ${{ matrix.font }} -e expectedNight ${{ matrix.night }} -e expectedOrientation ${{ matrix.orientation }} -e expectedMotion ${{ matrix.motion }} -e expectedMic ${{ matrix.api == 36 && 'granted' || 'denied' }} -e class "$REVIEW_CLASSES"
            python3 -m mynotes.tools.ci.native_environment --snapshot after
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            if test '${{ matrix.shard }}' != 1; then adb exec-out run-as app.space.notes.debug tar -C files -cf - pdf-review > refinement-pdf-captures.tar; fi
            for report in ocr-common-text-report.json speech-degradation-report.json core-focus-failure.txt; do if adb shell run-as app.space.notes.debug ls "files/$report" >/dev/null 2>&1; then adb exec-out run-as app.space.notes.debug cat "files/$report" > "refinement-quality-$report"; fi; done
      - name: Verify selected quantitative reports are complete and independently scored
        if: always()
        run: python3 -m mynotes.tools.ci.quality_reports --expected refinement-expected.json
      - name: Independently validate actual exported PDF URI annotations and page geometry
        if: always() && matrix.shard != 1
        run: |
          python3 -m pip install 'pypdf==6.1.1'
          python3 -m mynotes.tools.ci.verify_pdf_features --archive refinement-pdf-captures.tar --output refinement-pdf-results.json
      - name: Require every selected method once, without skipped or duplicate outcomes
        if: always()
        run: |
          python3 - <<'PYRESULT'
          from pathlib import Path
          import json,sys,re
          from mynotes.tools.ci.results import android,write_report
          expected=json.loads(Path('refinement-expected.json').read_text())
          path=Path('refinement-native.txt')
          result=android(path.read_text(errors='replace') if path.exists() else '',expected)
          write_report(result,'refinement-native.json')
          cpu=Path('refinement-native-cpu-phases.txt')
          phases=cpu.read_text(errors='replace') if cpu.exists() else ''
          if path.exists():
              for observation in set(re.findall(r'trained_cpu_elapsed_ms=\d+',path.read_text(errors='replace'))):
                  if observation not in phases:phases+='\n'+observation+' (public fixture end-to-end, not physical-device timing)'
          if 'NotesCpuPhase' in phases or 'trained_cpu_elapsed_ms=' in phases:
              print('::notice title=Observed native CPU phases and elapsed time::'+json.dumps(phases[-4000:]))
          if not result['ok']:
              progress=Path('refinement-native-test-progress.txt')
              if progress.exists():print('::notice title=Last observed native method::'+json.dumps(progress.read_text(errors='replace')[-2000:]))
              sys.exit(1)
          print('::notice title=Native refinement coverage::'+str(result['passed'])+'/'+str(result['expected'])+' methods passed, exact inventory')
          PYRESULT
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: refinement-native-${{ matrix.id }}
          overwrite: true
          path: |
            refinement-native.*
            refinement-native*.txt
            refinement-expected.json
            refinement-environment-*
            refinement-captures.tar
            refinement-pdf-*
            refinement-quality-*
          retention-days: 7
          if-no-files-found: warn
      - name: Await peer profile uploads without another runner job
        if: always() && matrix.id == 'min-api26'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYWAIT'
          import json,os,subprocess,time
          url='repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+os.environ['GITHUB_SHA']+'/check-runs'
          for attempt in range(120):
              try:jobs=json.loads(subprocess.check_output(['gh','api',url],text=True))['check_runs']
              except (subprocess.CalledProcessError,json.JSONDecodeError):
                  time.sleep(15);continue
              peers=[job for job in jobs if job['name'].startswith('native (') and not job['name'].startswith('native (min-api26,')]
              if len(peers)==7 and all(job['status']=='completed' for job in peers):
                  try:artifacts=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/artifacts'],text=True))['artifacts']
                  except (subprocess.CalledProcessError,json.JSONDecodeError):
                      time.sleep(15);continue
                  required={'refinement-native-min-api26','refinement-native-large-font-api34','refinement-native-landscape-api34','refinement-native-current-api36','refinement-native-min-api26-b','refinement-native-current-api36-b','refinement-native-large-font-api34-b','refinement-native-landscape-api34-b'}
                  if required <= {item['name'] for item in artifacts if item['size_in_bytes']>0}:break
              time.sleep(15)
          else:raise SystemExit('Peer native jobs did not complete; do not claim full qualification')
          PYWAIT
      - uses: actions/download-artifact@v8.0.2
        if: always() && matrix.id == 'min-api26'
        with:
          pattern: refinement-native-*
          path: fixture-artifacts
      - name: Preserve source-pinned synthetic fixtures and exact native reports
        if: always() && matrix.id == 'min-api26'
        run: |
          python3 -m pip install 'Pillow==11.3.0' 'PyYAML==6.0.3'
          python3 - <<'PYREVIEW'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path('mynotes/docs/design-2026-10-29/native')/os.environ['GITHUB_RUN_ID']
          results={}
          for artifact in sorted(Path('fixture-artifacts').iterdir()):
              lane=artifact.name.removeprefix('refinement-native-')
              output=root/lane
              report=artifact/'refinement-native.json'
              if report.exists():
                  output.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(report,output/'native-results.json')
                  parsed=json.loads(report.read_text());results[lane]={k:parsed.get(k) for k in ['ok','expected','passed','missing','failures']}
              for environment in artifact.glob('refinement-environment-*.json'):
                  output.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(environment,output/environment.name)
              for extra in list(artifact.glob('refinement-pdf-*'))+list(artifact.glob('refinement-quality-*'))+list(artifact.glob('refinement-native*.txt')):
                  output.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(extra,output/extra.name)
              capture=artifact/'refinement-captures.tar'
              if capture.exists() and capture.stat().st_size:
                  subprocess.run(['python3','-m','mynotes.tools.ci.render_review','--archive',str(capture),'--output',str(output)],check=True)
          if not results:raise SystemExit('No native execution reports to preserve')
          missing_profiles=sorted({'min-api26','large-font-api34','landscape-api34','current-api36','min-api26-b','current-api36-b','large-font-api34-b','landscape-api34-b'}-set(results))
          root.mkdir(parents=True,exist_ok=True)
          (root/'provenance.json').write_text(json.dumps({'schema':1,'source_sha':os.environ['GITHUB_SHA'],'capture_run':os.environ['GITHUB_RUN_ID'],'scope':'synthetic debug-host fixtures only; not user screenshots','results':results,'missing_profiles':missing_profiles,'release_approval':False},indent=2)+'\n')
          (root/'README.md').write_text('# Native refinement review fixtures\n\nSource: `'+os.environ['GITHUB_SHA']+'`. Run: '+os.environ['GITHUB_RUN_ID']+'. These are synthetic notes rendered by Android. JPEG previews support inspection; original PNG hashes are recorded in each manifest.\n\n**Not a release approval.** Inspect provenance and each native-results.json for exact successes/failures. Passing automation and preserved screenshots do not constitute Motorola physical-device acceptance.\n')
          if missing_profiles:raise SystemExit('Incomplete native evidence; missing profiles: '+','.join(missing_profiles))
          PYREVIEW
      - name: Gate and commit only fixture documentation on the session branch
        if: always() && matrix.id == 'min-api26'
        run: |
          set -euo pipefail
          trap 'code=$?; if [ "$code" -ne 0 ]; then python3 -m mynotes.tools.ci.results build --path /tmp/refinement-doc-gate.log; fi; exit "$code"' EXIT
          git checkout -B arena/3caca636-tictic "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            if git pull --ff-only origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
          { python3 -m unittest discover -s qa && python3 -m unittest discover -s mynotes/qa -t . && git diff --check; } 2>&1 | tee /tmp/refinement-doc-gate.log
          git add mynotes/docs/design-2026-10-29/native/${{ github.run_id }} && git commit -m 'Preserve source-pinned refinement qualification fixtures [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
          done
