# Iteration 1: actual drawing, clipboard, resize and editor journeys; no publication.
name: MyNotes user refinement qualification (nonpublishing)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-refinement-native.yml']
permissions:
  contents: read
concurrency:
  group: notes-refinement-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Compile debug app/instrumentation and lint without publication
        working-directory: mynotes
        run: |
          set -o pipefail
          sh gradlew :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee /tmp/refinement-native-build.log
      - name: Verify exact executed JVM coverage
        if: always()
        run: python3 -m mynotes.tools.ci.results jvm --path mynotes/domain/build/test-results/test --output evidence/refinement-jvm.json
      - name: Bounded compiler and lint diagnostics in check annotations
        if: failure()
        run: python3 -m mynotes.tools.ci.results build --path /tmp/refinement-native-build.log
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: refinement-foundation-test-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: refinement-foundation-lint
          path: mynotes/app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: warn
  native:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            font: 1.0
            night: 'no'
          - api: 34
            font: 2.0
            night: 'yes' 
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: refinement-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell cmd uimode night ${{ matrix.night }}
            adb shell am instrument -w -r -e class app.space.notes.runtime.DrawingToolsTest,app.space.notes.runtime.DiagramResizeViewTest,app.space.notes.DiagramJourneysTest,app.space.notes.CoreJourneysTest app.space.notes.debug.test/androidx.test.runner.AndroidJUnitRunner > refinement-native.txt
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar

      - name: Require every selected UI method once with successful completion
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          from mynotes.tools.ci.results import android,write_report
          from mynotes.tools.ci.test_plan import build_plan
          classes=['app.space.notes.runtime.DrawingToolsTest','app.space.notes.runtime.DiagramResizeViewTest','app.space.notes.DiagramJourneysTest','app.space.notes.CoreJourneysTest']
          plan=build_plan()
          expected=[cls+'#'+method for cls in classes for method in plan['android'][cls]]
          path=Path('refinement-native.txt')
          result=android(path.read_text(errors='replace') if path.exists() else '',expected)
          write_report(result,'refinement-native.json')
          print(json.dumps(result,indent=2))
          if not result['ok']: sys.exit(1)
          print('::notice title=Native refinement coverage::'+str(result['passed'])+'/'+str(result['expected'])+' methods passed; no missing/skipped/duplicate methods')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: refinement-native-api${{ matrix.api }}
          path: |
            refinement-native.*
            refinement-captures.tar
          retention-days: 7
          if-no-files-found: warn
