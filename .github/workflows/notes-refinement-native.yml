# Reservation4: one evidence-only recovery job; total9/35, no Android rebuild/rerun.
name: MyNotes user refinement qualification (nonpublishing)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-refinement-native.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      CAPTURE_RUN: '41049424165'
      QUALIFIED_SOURCE_SHA: '9a932cb155044645c74cf1efe3321f683b438de3'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - name: Verify original source and mandatory native/PDF gate conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYPROVENANCE'
          import json,os,subprocess
          base='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/'
          run=json.loads(subprocess.check_output(['gh','api',base+'runs/'+os.environ['CAPTURE_RUN']],text=True))
          assert run['head_sha']==os.environ['QUALIFIED_SOURCE_SHA']
          job=json.loads(subprocess.check_output(['gh','api',base+'jobs/124042456206'],text=True))
          required={'Independently validate actual exported PDF URI annotations and page geometry','Require every selected method once, without skipped or duplicate outcomes'}
          passed={s['name'] for s in job['steps'] if s['conclusion']=='success'}
          assert required <= passed, 'Do not recover failed native/PDF gates as successful'
          PYPROVENANCE
      - uses: actions/download-artifact@v8.0.2
        with:
          name: refinement-native-landscape-api34
          run-id: ${{ env.CAPTURE_RUN }}
          github-token: ${{ github.token }}
          path: fixture-artifacts/refinement-native-landscape-api34
      - name: Preserve source-pinned synthetic fixtures and exact native reports
        run: |
          set -Eeuo pipefail
          exec > >(tee -a /tmp/style-evidence.log) 2>&1
          evidence_diagnostic() {
            python3 - <<'PYDIAG'
          from pathlib import Path
          text=Path('/tmp/style-evidence.log').read_text(errors='replace')[-9000:]
          print('::error title=Evidence preservation diagnostic::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYDIAG
          }
          trap evidence_diagnostic ERR
          python3 -m pip install 'Pillow==11.3.0' 'PyYAML==6.0.3'
          python3 - <<'PYREVIEW'
          import json,os,shutil,subprocess
          from pathlib import Path
          root=Path('mynotes/docs/design-2026-10-29/native')/os.environ['CAPTURE_RUN']
          results={}
          for artifact in sorted(Path('fixture-artifacts').iterdir()):
              lane=artifact.name.removeprefix('refinement-native-')
              output=root/lane
              report=artifact/'refinement-native.json'
              if report.exists():
                  output.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(report,output/'native-results.json')
                  parsed=json.loads(report.read_text());assert parsed['ok'] and parsed['passed']==parsed['expected']==100 and not parsed['missing'] and not parsed['failures'];assert json.loads((artifact/'refinement-pdf-results.json').read_text())['ok'];results[lane]={k:parsed.get(k) for k in ['ok','expected','passed','missing','failures']}
              for environment in artifact.glob('refinement-environment-*.json'):
                  output.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(environment,output/environment.name)
              for extra in artifact.glob('refinement-pdf-*'):
                  output.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(extra,output/extra.name)
              capture=artifact/'refinement-captures.tar'
              if capture.exists() and capture.stat().st_size:
                  subprocess.run(['python3','-m','mynotes.tools.ci.render_review','--archive',str(capture),'--output',str(output)],check=True)
          if not results:raise SystemExit('No native execution reports to preserve')
          root.mkdir(parents=True,exist_ok=True)
          (root/'provenance.json').write_text(json.dumps({'schema':1,'source_sha':os.environ['QUALIFIED_SOURCE_SHA'],'capture_run':os.environ['CAPTURE_RUN'],'preservation_run':os.environ['GITHUB_RUN_ID'],'scope':'synthetic debug-host fixtures only; not user screenshots','results':results,'release_approval':False},indent=2)+'\n')
          (root/'README.md').write_text('# Native refinement review fixtures\n\nSource: `'+os.environ['QUALIFIED_SOURCE_SHA']+'`. Run: '+os.environ['CAPTURE_RUN']+'. These are synthetic notes rendered by Android. JPEG previews support inspection; original PNG hashes are recorded in each manifest.\n\n**Not a release approval.** Inspect provenance and each native-results.json for exact successes/failures. Passing automation and preserved screenshots do not constitute Motorola physical-device acceptance.\n')
          PYREVIEW
      - name: Gate and commit only fixture documentation on the session branch
        run: |
          set -Eeuo pipefail
          exec > >(tee -a /tmp/style-evidence.log) 2>&1
          evidence_diagnostic() {
            python3 - <<'PYDIAG'
          from pathlib import Path
          text=Path('/tmp/style-evidence.log').read_text(errors='replace')[-9000:]
          print('::error title=Evidence preservation diagnostic::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYDIAG
          }
          trap evidence_diagnostic ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa && python3 -m unittest discover -s mynotes/qa -t . && git diff --check && git add mynotes/docs/design-2026-10-29/native/${{ env.CAPTURE_RUN }} && git commit -m 'Preserve source-pinned refinement qualification fixtures [skip ci]' && git push origin arena/3caca636-tictic
