# Original failed method, original click action plus stronger checkbox/state/Cancel assertions. Exact58 APKs from41670830610; no rebuild, no retry.
name: MyNotes58 focused original PDF regression recheck
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-regression-pdf-recheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  original-failure-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: light-portrait, night: 'no', orientation: portrait}
          - {id: dark-portrait, night: 'yes', orientation: portrait}
          - {id: light-landscape, night: 'no', orientation: landscape}
          - {id: dark-landscape, night: 'yes', orientation: landscape}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41670830610
          name: module-foundation-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home
            adb shell am start -W -n app.space.notes.debug/app.space.notes.NotesActivity
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            set +e
            sha256sum refinement-apks/debug/notes-debug.apk refinement-apks/androidTest/debug/notes-debug-androidTest.apk > actual-apk-sha256.txt
            python3 mynotes/tools/ci/instrumentation_watchdog.py timeout 300s adb shell am instrument -w -r -e timeout_msec 240000 -e expectedNight ${{ matrix.night }} -e expectedOrientation ${{ matrix.orientation }} -e class 'app.space.notes.EnvironmentQualificationTest,app.space.notes.CoreJourneysTest#canonicalPdfOptionsAreDiscoverableAndCancelLeavesDocumentUnchanged' app.space.notes.debug.test/androidx.test.runner.AndroidJUnitRunner
            code=$?
            adb exec-out run-as app.space.notes.debug tar -C files -cf - ux-review > refinement-captures.tar
            python3 -c 'from pathlib import Path;import json;from mynotes.tools.ci.results import android;e=["app.space.notes.EnvironmentQualificationTest#"+m for m in ["fontScaleMatchesRequestedLane","orientationMatchesRequestedLane","nightResourcesMatchRequestedLane"]]+["app.space.notes.CoreJourneysTest#canonicalPdfOptionsAreDiscoverableAndCancelLeavesDocumentUnchanged"];r=android(Path("refinement-native.txt").read_text(errors="replace"),e);Path("pdf-regression.json").write_text(json.dumps(r,indent=2));print(json.dumps(r));raise SystemExit(0 if r["ok"] else 1)'
            verified=$?
            if [ "$code" -ne 0 ]; then exit "$code"; fi
            exit "$verified"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: regression58-pdf-${{ matrix.id }}
          path: |
            pdf-regression.json
            actual-apk-sha256.txt
            refinement-captures.tar
            refinement-native.txt
            refinement-environment-*
          retention-days: 7
          if-no-files-found: warn
