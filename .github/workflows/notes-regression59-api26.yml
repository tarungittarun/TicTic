# Restore the already-qualified legacy API26 SDK validation and root-only radio setup, returning to shell UID2000 before any app test. Prior137 attempts emitted no native outcomes.
# Source41678235867 compiled59 APKs, same direct action and state/Cancel assertions. Previous API26 guest died137 before instrumentation; only guest RAM/Vulkan configuration changes. PDF focus only, not a new OCR qualification.
name: MyNotes59 low-memory API26 live PDF regression
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-regression59-api26.yml']
permissions:
  contents: read
  actions: read
jobs:
  original-failure-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: api26-largefont, night: 'no', orientation: portrait, api: 26, font: '2.0'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41678235867
          name: regression59-heldout-test-apks
          path: refinement-apks
      - name: Enable KVM and audio loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bootstrap emulator package with bounded SDK-only retries
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          installed=false
          packages=(emulator)
          if [ '${{ matrix.api }}' = 26 ]; then packages+=('platforms;android-26' 'system-images;android-26;google_apis;x86_64'); fi
          for attempt in 1 2 3; do
            echo "SDK emulator package bootstrap attempt $attempt/3; no app test has started" | tee -a refinement-native-sdk-bootstrap.txt
            if timeout 180 "$SDK/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}" 2>&1 | tee -a refinement-native-sdk-bootstrap.txt; then
              if "$SDK/emulator/emulator" -version 2>&1 | tee -a refinement-native-sdk-bootstrap.txt; then
                if [ '${{ matrix.api }}' = 26 ]; then
                  if ! python3 -c 'import os,zipfile; from pathlib import Path; p=Path(os.environ["ANDROID_HOME"]); z=zipfile.ZipFile(p/"platforms/android-26/android.jar"); assert z.testzip() is None; assert (p/"system-images/android-26/google_apis/x86_64/system.img").stat().st_size>1048576'; then continue; fi
                fi
                installed=true; break
              fi
            fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then echo '::error::Emulator SDK bootstrap failed after three attempts; no native qualification claimed'; exit 1; fi
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 1536 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            adb root
            python3 -m mynotes.tools.ci.adb_state --uid 0
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb unroot
            python3 -m mynotes.tools.ci.adb_state --uid 2000
            adb install -r refinement-apks/debug/notes-debug.apk
            adb install -r refinement-apks/androidTest/debug/notes-debug-androidTest.apk
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell cmd uimode night ${{ matrix.night }}
            python3 -m mynotes.tools.ci.native_environment --stop-pixel-launcher --settle-home
            adb shell am start -W -n app.space.notes.debug/app.space.notes.NotesActivity
            python3 -m mynotes.tools.ci.native_environment --orientation ${{ matrix.orientation }}
            python3 -m mynotes.tools.ci.native_environment --snapshot configured
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 3600000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash mynotes/tools/ci/run_pdf_regression.sh ${{ matrix.night }} ${{ matrix.orientation }} ${{ matrix.font }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: regression59-api26-${{ matrix.id }}
          path: |
            refinement-native-sdk-bootstrap.txt
            pdf-regression.json
            actual-apk-sha256.txt
            refinement-captures.tar
            refinement-native.txt
            refinement-environment-*
          retention-days: 7
          if-no-files-found: warn
