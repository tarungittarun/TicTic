# Pin code52 exact already-built bytes; qualification still pending. No public release, private input, uninstall or clear-data; synthetic emulator only.
# Already-built release APKs only. Fresh synthetic emulator; no phone/private input.
name: MyNotes release33,35 and40 to52 install-over smokes
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-release-update-smoke.yml']
permissions:
  contents: write
  actions: read
jobs:
  release-update:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: 33
            version: '0.30.0'
            run: 41422422562
            artifact: 13129993413
            source: '98a8bc3d141c11403c3cf53a9b7ffb6adf0c34dd'
            sha256: '45d7472fa7989c4f925bab2ad90d2b7a0b4bce41bbae62d515e2b85d1c8ad120'
          - code: 35
            version: '0.32.0'
            run: 41449624652
            artifact: 13144272420
            source: 'fe6a0ded6b727f7b08c179187d671648e51db560'
            sha256: '2568af3d33e8856b288a2f76a9d36cde9aa116a25571eac272c0d5cdf0981813'
          - code: 40
            version: '0.37.0'
            run: 41482387741
            artifact: 13160229081
            source: '8ee7a31e1ff0f6f93d41bbac38e7c358fdb45e0f'
            sha256: '2937d56e11914ad634bd033109a88a1e50711e93bd67b186708caf20d48fa009'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: MyNotes-v${{ matrix.version }}-${{ matrix.code }}-development.apk
          path: old-apk
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41568986562
          name: MyNotes-v0.49.0-52-development.apk
          path: candidate-apk
      - name: Verify exact raw bytes, source, manifest and common signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_SPEC: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 - <<'PY'
          import hashlib,json,os,subprocess,sys,traceback
          def diagnostic(kind,error,tb):
              traceback.print_exception(kind,error,tb)
              print("::error title=Release APK verification::"+kind.__name__+": "+str(error).replace("%","%25").replace("\n","%0A"))
          sys.excepthook=diagnostic
          from pathlib import Path
          old=json.loads(os.environ['OLD_SPEC'])
          specs=[('old',old['artifact'],old['run'],old['source'],old['code'],old['version'],old['sha256']),('candidate',13200841464,41568986562,'7f4c0884b2090b5bf4ff59e8d8750093e0afe0bb',52,'0.49.0','5a68f33fa8a8ba25b278b2dfa70e511272787953edf88543fcaa5f575e3995f2')]
          apks={};tools=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          for label,artifact,run,source,code,version,expected in specs:
              files=list(Path(label+'-apk').rglob('*.apk'));assert len(files)==1,files
              file=files[0];sha=hashlib.file_digest(file.open('rb'),'sha256').hexdigest()
              meta=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(artifact)],text=True))
              assert meta['workflow_run']['id']==run and meta['workflow_run']['head_sha']==source
              assert sha==expected==meta['digest'].removeprefix('sha256:') and file.stat().st_size==meta['size_in_bytes']
              cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(file)],text=True)
              assert '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' in cert
              manifest=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(file)],text=True)
              assert "package: name='app.space.notes' versionCode='"+str(code)+"' versionName='"+version+"'" in manifest
              assert "sdkVersion:'26'" in manifest and 'android.permission.INTERNET' not in manifest
              apks[label]={'path':str(file),'sha256':sha,'artifact_id':artifact,'source_run':run,'source_sha':source,'version_code':code}
          Path('release-apks.json').write_text(json.dumps(apks,indent=2)+'\n')
          PY
      - name: Prepare emulator host dependencies and KVM
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Bounded SDK-only bootstrap, never retry migration assertions
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator'; then
              if "$ANDROID_HOME/emulator/emulator" -version; then installed=true; break; fi
            fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then echo '::error::Emulator SDK bootstrap failed; no migration result'; exit 1; fi
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            python3 -c 'import json,subprocess,sys; a=json.load(open("release-apks.json")); subprocess.run([sys.executable,"-m","mynotes.tools.ci.release_update_smoke","--old",a["old"]["path"],"--candidate",a["candidate"]["path"],"--old-code",str(a["old"]["version_code"]),"--candidate-code",str(a["candidate"]["version_code"]),"--output","release-update-smoke.json"],check=True)'
      - name: Publish only small synthetic verification evidence, not a release
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-pinned-release${{ matrix.code }}-to52-update-smoke
          path: |
            release-apks.json
            release-update-smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve successful synthetic update reports only
        env:
          OLD_CODE: ${{ matrix.code }}
        run: |
          python3 - <<'PYRETAIN'
          import json,os,shutil
          from pathlib import Path
          report=json.loads(Path('release-update-smoke.json').read_text())
          assert report['ok'] is True and report['notes_and_doc_retained'] is True
          assert report['uninstall_or_clear_data'] is False and report['release_approval'] is False
          assert report['from']['version_code']==int(os.environ['OLD_CODE']) and report['to']['version_code']==52
          assert report['from']['first_install_time']==report['to']['first_install_time']
          root=Path('mynotes/docs/design-2026-10-29/updates')/os.environ['GITHUB_RUN_ID']/(os.environ['OLD_CODE']+'-to52');root.mkdir(parents=True,exist_ok=True)
          for name in ('release-apks.json','release-update-smoke.json'):
              source=Path(name);assert 0<source.stat().st_size<20000;shutil.copyfile(source,root/name)
          (root/'provenance.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['GITHUB_SHA'],'scope':'Two public ASCII Note/Doc fixtures only. Force-stop cold restart is used here, unlike the separate actual-process probe. Not exhaustive rich-library or physical acceptance.','release_approval':False},indent=2)+'\n')
          PYRETAIN
      - name: Gate and commit only successful public evidence to session branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add "mynotes/docs/design-2026-10-29/updates/${{ github.run_id }}"
          git commit -m 'Preserve successful exact-byte52 synthetic verification evidence, limited scope [skip ci]'
          for attempt in 1 2 3; do
            if git push origin arena/3caca636-tictic; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin arena/3caca636-tictic
            python3 -m unittest discover -s qa
            git diff --check
          done
