# Already-built release APKs only. Fresh synthetic emulator; no phone/private input.
name: MyNotes release33 to34 install-over smoke
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-release-update-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  release-update:
    if: github.ref == 'refs/heads/arena/3caca636-tictic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41422422562
          name: MyNotes-v0.30.0-33-development.apk
          path: old-apk
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41432202683
          name: MyNotes-v0.31.0-34-development.apk
          path: candidate-apk
      - name: Verify exact raw bytes, source, manifest and common signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 - <<'PY'
          import hashlib,json,os,subprocess,sys,traceback
          def diagnostic(kind,error,tb):
              traceback.print_exception(kind,error,tb)
              print("::error title=Release APK verification::"+kind.__name__+": "+str(error).replace("%","%25").replace("\n","%0A"))
          sys.excepthook=diagnostic
          from pathlib import Path
          specs=[('old',13129993413,41422422562,'98a8bc3d141c11403c3cf53a9b7ffb6adf0c34dd',33,'0.30.0','45d7472fa7989c4f925bab2ad90d2b7a0b4bce41bbae62d515e2b85d1c8ad120'),('candidate',13135456219,41432202683,'fec11f1985a190643d8e9af4e9f4d960696dcb8c',34,'0.31.0','a3f8cb0168cab69aaa3e40ef32815fde76afde2c8d0672a39c930968b368ad3b')]
          apks={};tools=Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          for label,artifact,run,source,code,version,expected in specs:
              files=list(Path(label+'-apk').rglob('*.apk'));assert len(files)==1,files
              file=files[0];sha=hashlib.file_digest(file.open('rb'),'sha256').hexdigest()
              meta=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(artifact)],text=True))
              assert meta['workflow_run']['id']==run and meta['workflow_run']['head_sha']==source
              assert sha==expected==meta['digest'].removeprefix('sha256:') and file.stat().st_size==meta['size_in_bytes']
              cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(file)],text=True)
              assert '08cd7d693078ef665b7acd427d71fa3aa477cc6af2cab2a00c310f9d66198fca' in cert
              manifest=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(file)],text=True)
              assert "package: name='app.space.notes' versionCode='"+str(code)+"' versionName='"+version+"'" in manifest
              assert "sdkVersion:'26'" in manifest and 'android.permission.INTERNET' not in manifest
              apks[label]={'path':str(file),'sha256':sha,'artifact_id':artifact,'source_run':run,'source_sha':source,'version_code':code}
          Path('release-apks.json').write_text(json.dumps(apks,indent=2)+'\n')
          PY
      - name: Enable KVM for the disposable CI emulator
        run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            python3 -c 'import json,subprocess,sys; a=json.load(open("release-apks.json")); subprocess.run([sys.executable,"-m","mynotes.tools.ci.release_update_smoke","--old",a["old"]["path"],"--candidate",a["candidate"]["path"],"--output","release-update-smoke.json"],check=True)'
      - name: Publish only small synthetic verification evidence, not a release
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-pinned-release-update-smoke
          path: |
            release-apks.json
            release-update-smoke.json
          if-no-files-found: warn
          retention-days: 7
