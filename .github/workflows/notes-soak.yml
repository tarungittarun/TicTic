name: MyNotes extended native soak
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths:
      # Long soak is explicit, never an incidental consequence of a version bump.
      - '.github/workflows/notes-soak.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notes-soak-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    name: Compile isolated soak host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Build only standalone Notes instrumentation
        working-directory: mynotes
        run: sh gradlew --build-cache :notes:assembleDebug :notes:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: notes-soak-apks
          path: |
            mynotes/app/build/outputs/apk/debug/notes-debug.apk
            mynotes/app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error
  soak:
    name: 70-minute native/durable cycles API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: notes-soak-apks
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash mynotes/tools/ci/native_soak.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: notes-soak-evidence-api${{ matrix.api }}
          path: evidence/soak/
          retention-days: 14
          if-no-files-found: warn
      - name: Evidence summary
        if: always()
        run: |
          echo '## Native soak API ${{ matrix.api }}' >> "$GITHUB_STEP_SUMMARY"
          if test -f evidence/soak/report.json; then cat evidence/soak/report.json >> "$GITHUB_STEP_SUMMARY"; else echo 'No successful completion report. Inspect bounded logs; no release is published by this workflow.' >> "$GITHUB_STEP_SUMMARY"; fi
