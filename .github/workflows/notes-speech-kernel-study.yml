# Public per-observation progress keeps the bounded watchdog meaningful; initial preflight 41784821798 lacks this progress; cancellation was denied by integration permissions, not claimed successful.
name: Exact-weight CPU attention speech study (nonshipping, default stays off)
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-speech-kernel-study.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mynotes
      - name: Verify licensed public corpus and compile baseline debug/test APKs only
        working-directory: mynotes
        run: |
          python3 -m tools.ci.module_corpus --output benchmarks/assets/module-corpus
          cp docs/regression/ocr-heldout-v1.json benchmarks/assets/module-corpus/ocr-heldout-v1.json
          sh gradlew -PmoduleE2E :notes-domain:test :notes:assembleDebug :notes:assembleDebugAndroidTest :notes:lintDebug --no-daemon --max-workers=2 --console=plain --stacktrace
          mkdir -p ../kernel-apks
          cp app/build/outputs/apk/debug/notes-debug.apk ../kernel-apks/standard-unsigned.apk
          cp app/build/outputs/apk/androidTest/debug/notes-debug-androidTest.apk ../kernel-apks/test-unsigned.apk
      - name: Compile opt-in debug CPU attention, never a release or default swap
        working-directory: mynotes
        run: |
          sh gradlew -PmoduleE2E -PflashAttentionResearch :notes:assembleDebug --no-daemon --max-workers=2 --console=plain --stacktrace
          cp app/build/outputs/apk/debug/notes-debug.apk ../kernel-apks/flash-unsigned.apk
      - name: Prove only three native wrappers changed, verify exact same F16 weights, share debug signature
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          from mynotes.tools.ci.resign_public_benchmark_apks import payload
          from mynotes.tools.ci.q8_native_derivative import checked,MODEL
          root=pathlib.Path('kernel-apks');standard=root/'standard-unsigned.apk';flash=root/'flash-unsigned.apk'
          a,b=payload(standard),payload(flash)
          changed={k for k in a if a[k]!=b.get(k)}
          expected={'lib/'+abi+'/libnotes_whisper.so' for abi in ['armeabi-v7a','arm64-v8a','x86_64']}
          assert a.keys()==b.keys() and changed==expected,changed
          for file in (standard,flash):
              with zipfile.ZipFile(file) as z:checked(z.read(MODEL),'f16')
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0';key=root/'ephemeral.jks'
          subprocess.run(['keytool','-genkeypair','-keystore',str(key),'-storepass','android','-keypass','android','-alias','research','-keyalg','RSA','-validity','2','-dname','CN=Nonshipping public CPU study'],check=True)
          proof={'adopted':False,'training_steps':0,'scope':'Same exact F16 model/Java/test/resources. Debug-only CPU attention study, release/default off. No accuracy, speed, storage-saving or physical adoption claim.','changed_unsigned_payload_entries':sorted(changed),'files':[]}
          for role in ('standard','flash','test'):
              file=root/(role+'-unsigned.apk');before=payload(file);aligned=root/(role+'-aligned.apk');out=root/(role+'-kernel.apk')
              package=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(file)],text=True).splitlines()[0]
              assert "name='"+('app.space.notes.debug.test' if role=='test' else 'app.space.notes.debug')+"'" in package
              subprocess.run([str(tools/'zipalign'),'-f','-P','16','4',str(file),str(aligned)],check=True)
              subprocess.run([str(tools/'apksigner'),'sign','--ks',str(key),'--ks-pass','pass:android','--key-pass','pass:android','--out',str(out),str(aligned)],check=True)
              subprocess.run([str(tools/'apksigner'),'verify',str(out)],check=True);assert payload(out)==before
              proof['files'].append({'role':role,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'bytes':out.stat().st_size,'package':package,'unchanged_unsigned_payload':True})
          key.unlink();(root/'kernel-payload-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nonshipping-speech-kernel-apks
          path: |
            kernel-apks/*-kernel.apk
            kernel-apks/kernel-payload-proof.json
          retention-days: 3
          if-no-files-found: error
  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, shard: 0, first: standard}
          - {api: 26, shard: 1, first: flash}
          - {api: 34, shard: 0, first: flash}
          - {api: 34, shard: 1, first: standard}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nonshipping-speech-kernel-apks
      - name: Enable KVM and installed emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash mynotes/tools/ci/run_speech_kernel_study.sh ${{ matrix.shard }} ${{ matrix.first }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: speech-kernel-api${{ matrix.api }}-shard${{ matrix.shard }}
          path: |
            *-native.txt
            *-execution.json
            standard-*.json
            flash-*.json
            speech-kernel-comparison.json
            kernel-payload-proof.json
            refinement-native-*.txt
          retention-days: 7
          if-no-files-found: error
