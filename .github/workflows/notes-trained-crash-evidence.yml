# One evidence relay, no build/training/emulator/public release. Synthetic CI only.
name: MyNotes trained CPU crash evidence relay
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/notes-trained-crash-evidence.yml']
permissions:
  contents: write
  actions: read
jobs:
  preserve-crash-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/3caca636-tictic
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41406961762
          pattern: refinement-native-*-b
          path: crash-evidence
      - name: Preserve bounded synthetic fatal/abort evidence, not private phone logs
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          output=Path('mynotes/docs/trained-whisper/41406961762');output.mkdir(parents=True,exist_ok=True)
          reports=[]
          for source in Path('crash-evidence').glob('*/refinement-native-diagnostics.txt'):
              if source.stat().st_size>2000000:raise ValueError('Diagnostic budget exceeded')
              lines=source.read_text(errors='replace').splitlines();selected=set()
              for i,line in enumerate(lines):
                  if re.search('Fatal signal|SIGSEGV|SIGILL|SIGABRT|GGML_ASSERT|backtrace:|Abort message|FATAL EXCEPTION|libnotes_whisper|libggml|whisper.cpp|TrainedWhisper',line,re.I):selected.update(range(max(0,i-5),min(len(lines),i+32)))
              report={'profile':source.parent.name,'matched':len(selected),'lines':[lines[i] for i in sorted(selected)][:600]};reports.append(report)
          result={'run':41406961762,'source_sha':'c0140302','scope':'Public synthetic emulator fixtures only; never attached phone report','profiles':reports}
          (output/'native-crash-excerpts.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Gate and retain small evidence on the session branch only
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==11.3.0 PyYAML==6.0.3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/3caca636-tictic
          python3 -m unittest discover -s qa
          git diff --check
          git add mynotes/docs/trained-whisper/41406961762/native-crash-excerpts.json
          git commit -m "Preserve synthetic trained CPU native crash evidence [skip ci]"
          git push origin arena/3caca636-tictic
