# Variant repair: bounded post-force-stop WebView readiness; reuse three original exact-APK sessions with their provenance.
name: Obsidian Android complete command census and screenshot PDFs
on:
  push:
    branches: ['arena/3caca636-tictic']
    paths: ['.github/workflows/obsidian-feature-audit.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: obsidian-feature-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        phase: [variants]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mynotes/tools/comparisons
            mynotes/tools/ci/use_installed_emulator.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websocket-client==1.8.0
      - name: Verify official pinned APK, never patch or re-sign it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p obsidian-evidence /tmp/obsidian-apk
          gh release download v1.15.0 --repo obsidianmd/obsidian-releases --pattern Obsidian-1.15.0.apk --dir /tmp/obsidian-apk
          echo '2d92966fba5441a8976ae86b39cf138c0a845d3dcd318e6f0d29d304950bca5d  /tmp/obsidian-apk/Obsidian-1.15.0.apk' | sha256sum --check
          python - <<'PY'
          import json,pathlib
          pathlib.Path('obsidian-evidence/apk-identity.json').write_text(json.dumps({'publisher_repository':'obsidianmd/obsidian-releases','version':'1.15.0','apk_sha256':'2d92966fba5441a8976ae86b39cf138c0a845d3dcd318e6f0d29d304950bca5d','source_sha':'${{ github.sha }}','run':'${{ github.run_id }}','phase':'${{ matrix.phase }}','api':36,'scope':'Real mobile UI inspection, not exhaustive functional acceptance'},indent=2))
          PY
      - name: Enable software-rendered emulator acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          sudo chmod 666 /dev/kvm
          bash mynotes/tools/ci/use_installed_emulator.sh
      - uses: ReactiveCircus/android-emulator-runner@v2
        env:
          OBSIDIAN_PHASE: ${{ matrix.phase }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 2048 -cores 2 -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install /tmp/obsidian-apk/Obsidian-1.15.0.apk
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            python mynotes/tools/comparisons/obsidian_audit.py
      - name: Preserve host/device health diagnostics on failure
        if: failure()
        run: |
          free -h > obsidian-evidence/host-memory.txt
          dmesg 2>&1 | tail -100 > obsidian-evidence/host-kernel.txt || true
          adb devices -l > obsidian-evidence/adb-state.txt || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: obsidian-session-${{ matrix.phase }}
          path: obsidian-evidence
          retention-days: 7
  report:
    needs: inspect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 reportlab==4.4.4 PyYAML==6.0.3
      - name: Wait for preserved completed reference sessions, never rerun them silently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import json,subprocess,time
          required={'obsidian-session-walkthrough','obsidian-session-commands','obsidian-session-settings'}
          for attempt in range(90):
              data=json.loads(subprocess.check_output(['gh','api','repos/tarungittarun/TicTic/actions/runs/42174080714/artifacts']))
              if required <= {a['name'] for a in data['artifacts']}:break
              time.sleep(10)
          else:raise SystemExit('Completed reference-session artifacts did not become available; no coverage claim')
          PYWAIT
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 42174080714
          pattern: obsidian-session-*
          path: obsidian-sessions
      - name: Replace only the failed variant session; retain other exact-APK original sessions
        run: rm -rf obsidian-sessions/obsidian-session-variants
      - uses: actions/download-artifact@v8.0.2
        with:
          name: obsidian-session-variants
          path: obsidian-sessions/obsidian-session-variants
      - name: Build evidence PDFs without concealing blocked/incomplete sessions
        run: |
          python mynotes/tools/comparisons/obsidian_merge.py
          python mynotes/tools/comparisons/obsidian_feature_report.py
      - name: Root gate and preserve public dummy-data PDF/screenshots on this branch only
        run: |
          git pull --ff-only origin arena/3caca636-tictic
          python -m unittest discover -s qa
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mynotes/docs/comparisons/obsidian/audit/${{ github.run_id }}
          git commit -m 'Preserve official Obsidian real-session screenshot PDFs and honest command coverage [skip ci]'
          git push origin arena/3caca636-tictic
      - name: Require completed inspection sessions, not 100 percent functional acceptance
        run: |
          python - <<'PY'
          import json
          x=json.load(open('obsidian-evidence/coverage-summary.json'))
          assert x['session_execution_complete'], 'At least one actual inspection session is incomplete; evidence is retained without a pass claim'
          PY
