name: Publish installable APK

# On demand only. Committing a build output back to the branch would otherwise retrigger CI on
# every push, and an APK differs byte-for-byte between builds with no source change, so an
# automatic commit would produce a commit per run for no reason.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and commit the debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runners ship the Android SDK. The setup-android action was tried early in this
      # project and broke the build; it must not be reintroduced.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      # Shell only, deliberately: an earlier version of this step used a nested Python heredoc
      # whose terminator was indented by the YAML block. Bash requires the terminator at column
      # zero, so the heredoc never closed, the step could not run, and an invalid workflow file
      # in the push stopped GitHub from creating runs for the whole commit.
      - name: Stage the APK into artifacts/
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "versionName '[^']+'" app/build.gradle | head -1 | cut -d"'" -f2)
          CODE=$(grep -oE "versionCode [0-9]+" app/build.gradle | head -1 | awk '{print $2}')
          BUILT=$(find . -path '*/build/outputs/apk/*' -name '*.apk' | head -1)
          if [ -z "$BUILT" ]; then echo "no APK was produced"; exit 1; fi
          NAME="MySpace-v${VERSION}-${CODE}-debug.apk"
          cp "$BUILT" "artifacts/$NAME"
          sha256sum "artifacts/$NAME" | awk '{print $1}' > "artifacts/$NAME.sha256"
          SIZE=$(stat -c %s "artifacts/$NAME")
          HASH=$(cat "artifacts/$NAME.sha256")
          ROW="| ${VERSION} (build ${CODE}) | [Download APK](${NAME}) | ${SIZE} bytes | \`${HASH}\` |"
          # Insert after the last table row so the newest build sits at the bottom of the list.
          LAST=$(grep -n '^| ' artifacts/APK-INDEX.md | tail -1 | cut -d: -f1)
          awk -v row="$ROW" -v last="$LAST" 'NR==last{print; print row; next} {print}' \
            artifacts/APK-INDEX.md > /tmp/index.md
          sed -e 's/^# TicTic debug APKs$/# MySpace debug APKs/' \
              -e 's/^Five retained debug APK versions\./Retained debug APK versions./' \
              /tmp/index.md > artifacts/APK-INDEX.md
          echo "indexed $NAME ($SIZE bytes)"

      - name: Commit the APK back to the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Publish debug APK for on-device testing [skip ci]" -m "Built by the publish-apk workflow and committed into artifacts/, where this repository has always kept installable debug builds with a SHA-256 sidecar and an index. Committed rather than left as a workflow artifact because artifacts are only reachable from the Actions UI and they expire, whereas a file on the branch can be downloaded straight from github.com and stays put."
          git push
