# The owner's 2026-10-26 instruction: "Have end to end test of application in terms of
# all aspects and have a seperate workflow for testing alone." This workflow is that
# separation: android-ci builds and publishes; THIS one only tests, in three layers --
# source contracts (the promises pinned in code), JVM journeys (the full rules pipeline,
# key by key), and UI end-to-end on a real Android emulator (touches, gestures, caret).
name: Tests

on:
  push:
    branches: [ "arena/3caca636-tictic", "myspace" ]
  pull_request:
  workflow_dispatch:

jobs:
  source-contracts:
    name: Source contracts (qa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the contract suite
        run: python -m unittest discover -s qa -v

  jvm-journeys:
    name: JVM unit + end-to-end journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Unit tests, all modules
        run: ./gradlew test --stacktrace 2>&1 | tee /tmp/unit.log; exit ${PIPESTATUS[0]}
      - name: Surface unit test errors as annotations
        if: failure()
        run: |
          # Run logs are not downloadable from the review sandbox, so a red run re-emits
          # its own tail as a check-run annotation -- the same trick android-ci uses.
          if [ -f /tmp/unit.log ]; then
            # Annotations keep only the FIRST 4096 characters of the message, so emit
            # the END of the log -- the failure block -- not a 60k window whose head
            # lands mid-task-list. Round 15: two red runs whose reason was invisible.
            body=$(tail -c 3800 /tmp/unit.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=unit.log tail::$body"
            hits=$(grep -n "FAILED\|error:\|What went wrong" -A 6 /tmp/unit.log | tail -c 3800 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=unit.log failures::$hits"
          else
            echo "::error title=unit.log::unit log missing"
          fi
          exit 1
  ui-e2e:
    name: UI end-to-end on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-emulator-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-emulator-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner hosts the emulator AND the build; the first attempt died of memory
      # pressure with the log stopping mid-task. So: compile everything BEFORE the
      # emulator exists, then inside the emulator step run only the tests, daemonless
      # and heap-bounded, reusing the compiled outputs.
      - name: Prebuild the app and test APKs
        run: ./gradlew :calc:assembleDebug :calc:assembleDebugAndroidTest --stacktrace 2>&1 | tee /tmp/pre.log; exit ${PIPESTATUS[0]}
      - name: Surface prebuild errors as annotations
        if: failure()
        run: |
          if [ -f /tmp/pre.log ]; then
            body=$(grep -E "error:|FAILED|Exception|expected|Caused by" /tmp/pre.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            tailb=$(tail -c 40000 /tmp/pre.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pre.log::$body%%0A== tail ==%%0A$tailb"
          fi
          exit 1
      - name: Instrumented tests on a real Android screen
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          ram-size: 2048M
          # No Gradle inside the emulator step: two attempts died there mid-build with the
          # log stopping between tasks -- the runner hosts the emulator AND the JVM, and
          # the pair does not fit. The prebuilt APKs install with adb and run through
          # am instrument, which is all connectedAndroidTest would have done anyway.
          script: |
            set -x
            adb wait-for-device
            adb install -r calc/build/outputs/apk/debug/calc-debug.apk
            adb install -r calc/build/outputs/apk/androidTest/debug/calc-debug-androidTest.apk
            adb shell am instrument -w app.space.calc.debug.test/androidx.test.runner.AndroidJUnitRunner > /tmp/ui.log 2>&1
            code=$?
            cat /tmp/ui.log
            grep -q "OK (" /tmp/ui.log || code=1
            exit $code
      - name: Surface emulator test errors as annotations
        if: failure()
        run: |
          if [ -f /tmp/ui.log ]; then
            body=$(tail -c 60000 /tmp/ui.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ui.log::$body"
          else
            echo "::error title=ui.log::emulator log missing; the runner failed before gradle wrote anything"
          fi
          exit 1
