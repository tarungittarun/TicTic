name: Widget Concepts CI

# Narrow, non-publishing qualification for the fifteen alarm/routine/time widget concepts.
# The existing Android CI is paused and retains its historical publish steps. This
# workflow is workflow_dispatch-only: it runs contracts, JVM tests and a debug compile,
# but never uploads or commits an APK.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-concepts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Widget source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run project and widget-contract suites
        run: python3 -m unittest qa.test_source_contracts qa.test_widget_concepts -v

  android-build:
    name: JVM tests and Android debug compile
    runs-on: ubuntu-24.04
    needs: contracts
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 34 SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools were not found in ANDROID_HOME/ANDROID_SDK_ROOT."
            exit 1
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Run JVM tests and compile the sideload-neutral debug variant
        run: sh gradlew --no-daemon --stacktrace test :app:assembleLiteDebug
