name: Widget Concepts CI

# Narrow, non-publishing qualification for the fifteen alarm/routine/time widget concepts.
# The existing Android CI is paused and retains its historical publish steps. This
# workflow runs contracts, JVM tests and a debug compile on pushes to the active branch.
# It also supports manual dispatch once present on the default branch. It never uploads
# or commits an APK.
on:
  push:
    branches:
      - arena/3caca636-tictic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-concepts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Widget source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run project and widget-contract suites
        run: python3 -m unittest qa.test_source_contracts qa.test_widget_concepts -v

  android-build:
    name: JVM tests and Android debug compile
    runs-on: ubuntu-24.04
    needs: contracts
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 34 SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools were not found in ANDROID_HOME/ANDROID_SDK_ROOT."
            exit 1
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-jdk17-
      - name: Run JVM test tasks
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sh gradlew --no-daemon --stacktrace test 2>&1 | tee /tmp/widget-unit.log
      - name: Assemble Lite debug variant
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          sh gradlew --no-daemon --stacktrace :app:assembleLiteDebug 2>&1 | tee /tmp/widget-build.log
      - name: Surface Gradle failure details
        if: steps.unit.outcome == 'failure' || steps.build.outcome == 'failure'
        shell: bash
        run: |
          escape() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }'; }
          summarize() {
            label="$1"
            file="$2"
            if [ ! -f "$file" ]; then
              echo "::error title=$label::Gradle log missing on runner"
              return
            fi
            excerpt=$(grep -nE 'error:|symbol:|location:|required:|found:|What went wrong|Execution failed for task' "$file" | tail -60 || true)
            if [ -z "$excerpt" ]; then excerpt=$(tail -40 "$file"); fi
            {
              printf '\n#### %s\n\n```text\n' "$label"
              printf '%s\n' "$excerpt"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            body=$(printf '%s\n' "$excerpt" | escape)
            echo "::error title=$label::$body"
          }
          echo "::notice::Gradle outcomes unit=${{ steps.unit.outcome }} assemble=${{ steps.build.outcome }}"
          if [ "${{ steps.unit.outcome }}" = "failure" ]; then summarize "JVM test failure context" /tmp/widget-unit.log; fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then summarize "Lite debug assemble failure context" /tmp/widget-build.log; fi
          exit 1
