plugins { id 'com.android.application' }

android {
    namespace 'app.tictic.clock'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'app.tictic.clock'
        minSdk 23
        targetSdk 34
        versionCode 23
        versionName '1.11.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Test-only jars are vendored so the JVM regression suite runs even in offline/TLS-restricted builds.
    testImplementation files('libs/junit-4.13.2.jar', 'libs/hamcrest-core-1.3.jar')
}
