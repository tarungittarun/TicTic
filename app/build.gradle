plugins { id 'com.android.application' }

android {
    // Deliberately NOT renamed to app.space.one yet. The namespace drives the R
    // class and resolves the manifest's relative component names (".MainActivity"
    // and the 24 widget providers). Keeping it at app.tictic.clock lets the
    // MySpace rebrand land as a small, CI-verifiable change; the package rename
    // happens with the :feature-clock extraction in Phase 1. See SUITE-PLAN.md §9.5.
    namespace 'app.tictic.clock'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        // MySpace — "One for many." New id, so existing app.tictic.clock installs
        // do not upgrade in place; data moves via the export/import bundle and
        // placed widgets are re-placed once (both accepted, SUITE-PLAN.md §4).
        applicationId 'app.space.one'
        // Raised from 23 (SUITE-PLAN.md §5.1): unlocks CameraX/ML Kit for the doc
        // scanner and modern AndroidX, and guarantees notification channels and
        // adaptive icons. Leaves 36 now-dead SDK_INT guards (>=21/23/24/26), which
        // are removed in a separate cleanup — they sit in behaviour-sensitive
        // notification and volume-key paths. Guards at >=27 remain live.
        minSdk 26
        targetSdk 34
        // New product line: MySpace starts at 2.0.0. The clock feature keeps its
        // v1.11.2 lineage in CHANGELOG.md.
        versionCode 53
        versionName '3.12.16'
    }
    signingConfigs {
        // One key for the sideload channel, kept in the repository. The default debug keystore
        // is generated per machine, and CI runs on a fresh machine every time: two builds of
        // identical source signed on two runners carry different certificates, and Android
        // refuses the upgrade with "App not installed as package conflicts with an existing
        // package". That is what happened to build 30 on the owner's phone. A key in the repo
        // makes every later build an upgrade of this one.
        //
        // This is the SIDELOAD key. It is deliberately not a secret -- anyone with the APK has
        // the APK -- and it is deliberately not a Play upload key, which stays with the owner.
        sideload {
            storeFile rootProject.file('signing/myspace.p12')
            storeType 'pkcs12'
            storePassword 'myspace-sideload'
            keyAlias 'myspace'
            keyPassword 'myspace-sideload'
        }
    }

    buildTypes {
        // dist is the build handed to a tester: signed so that it installs, but NOT debuggable.
        // A debuggable APK can be attached to over adb and its data read by anything holding a
        // cable, which is precisely what Play Protect means by "can put your device or data at
        // risk". The verdict on the previous APK was correct, not a false positive, and shipping
        // a debuggable build to a human was the defect. debug and release keep their defaults.
        dist {
            debuggable false
            // The workflow generates signing/myspace.p12 before the build if it is missing and
            // commits it with the APK, so it is present on CI; the fallback keeps a checkout
            // without it buildable instead of failing at configuration time.
            signingConfig file("${rootDir}/signing/myspace.p12").exists()
                    ? signingConfigs.sideload : signingConfigs.debug
            // Library modules declare only debug and release; map dist onto release for them.
            matchingFallbacks = ['release', 'debug']
        }
    }

    flavorDimensions "scope"
    productFlavors {
        // lite omits SMS access. Google Play Protect hard-blocks any APK installed outside the
        // Play Store that declares READ_SMS or SEND_SMS -- the install does not warn, it refuses.
        // Carrying the permission therefore made the entire suite uninstallable for the one app
        // that uses it. lite is the build a sideloaded install can actually be; full is the
        // Play-facing build, usable once the SMS declaration form is filed.
        lite { dimension "scope" }
        full { dimension "scope" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // MySpace core modules. :app is a thin application module and must hold no
    // feature code of its own (SUITE-PLAN.md §3.1); today it still does, and
    // Phase 1 moves it out module by module.
    implementation project(':core-domain')
    implementation project(':core-design')
    // api, not implementation: DataStore in :app exposes AppTheme's palette through
    // a package-visible field, and later slices will surface core-data types through
    // :app's own API. Modules that consume :app must therefore see core-data too.
    api project(':core-data')
    // :app is the only module permitted to see both the shell and every feature
    // module, because it is what assembles the registry and hands it over. Nothing in
    // :app calls into the shell yet — the contract lands first with no
    // implementations, so it is designed against the clock when the clock is
    // extracted next (SUITE-PLAN.md §6.1 step 1g/1h). The dependency is declared now
    // so both modules are compiled and wired on every CI run.
    implementation project(':shell')
    // The clock app module. :app is the only module allowed to depend on both
    // :shell and the :feature-* modules — it is where the suite is assembled.
    implementation project(':core-platform')
    implementation project(':feature-clock')
    implementation project(':feature-calculator')
    implementation project(':feature-notes')
    implementation project(':feature-habits')
    implementation project(':feature-expenses')
    implementation project(':feature-calendar')
    implementation project(':feature-tasks')
    implementation project(':feature-weather')
    implementation project(':feature-recorder')
    implementation project(':feature-files')
    implementation project(':feature-documents')
    implementation project(':feature-messages')
    implementation project(':feature-music')
    implementation project(':feature-scanner')
    implementation project(':feature-email')

    // Test-only jars are vendored so the JVM regression suite runs even in offline/TLS-restricted builds.
    testImplementation files('libs/junit-4.13.2.jar', 'libs/hamcrest-core-1.3.jar')
}
