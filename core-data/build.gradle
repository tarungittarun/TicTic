// Shared local data layer for MySpace: preference access, theme/appearance
// state, collection storage, and (later) the Room database, the JSON migration
// off tictic_local_v1, and CSV export. See SUITE-PLAN.md §3.1 and §5.
//
// Extraction is deliberately incremental. DataStore in :app currently holds 452
// references across 25 files — 144 of them in MainActivity alone — and about
// fifteen contract tests assert on its content and on DataStore.xxx(...) call
// sites elsewhere. Splitting it in one pass would be unattributable if the build
// broke, so implementations move here group by group while DataStore stays as a
// delegating facade. Call sites are rewritten only at the end, per group.
//
// This module must never depend on :app, :shell or any :feature-*.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.core.data'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    // The suite's first AndroidX dependency, Sprint 4: FileProvider, the standard door for
    // handing private files to other apps. Pinned to 1.12.0, the last line that is happy on
    // AGP 7.4. SharedPreferences and Resources.Configuration stay framework APIs.
    implementation 'androidx.core:core:1.12.0'

    // Sprint 4: Room is the in-app store of record for the collection data. api, not
    // implementation, because the stores in feature modules touch the entities directly.
    // 2.5.2 is the line that is happy on AGP 7.4 with Java 8 sources.
    api 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
}
