// Shared design system for MySpace: palette, accents, glass surfaces, motion,
// typography/corner/spacing scales and locally drawn icons. Every :feature-*
// module depends on this so all apps inherit one look (SUITE-PLAN.md §3.1).
//
// Scope today is deliberately narrow. Only TicIconView lives here so far, because
// it is the single design class with zero coupling to the data layer. The rest of
// the design system — GlassPreset, AppSurfaceStyle, AppGlassDrawable, GelMotion,
// AnalogClockView — all read theme/accent/preference values through DataStore, so
// they must wait for :core-data. Extracting them now would make :core-design
// depend on :app and invert the module rule.
//
// This module must never depend on :app, :shell or any :feature-*.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.core.design'
    compileSdk 34

    defaultConfig {
        minSdk 26
        // A library has no applicationId and no version of its own; the suite is
        // versioned once, in :app.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The design system reads appearance and settings state, so it sits on top of
    // :core-data. This dependency is the reason the design classes could not move
    // before step 1d: they all read theme/accent/preference values, and reaching
    // back into :app for them would have inverted the module rule.
    implementation project(':core-data')
    implementation project(':core-platform')

    // No AndroidX yet: the project still builds with android.useAndroidX=false,
    // and these classes need only framework Canvas/Paint/Path/View APIs.
    // AndroidX arrives with the modules that require it.
}
