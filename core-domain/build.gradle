// Pure-JVM domain logic for MySpace. No Android imports, no resources — this
// module must stay compilable and testable as plain Java so its rules can be
// verified without an emulator. Every :feature-* module may depend on it;
// it may not depend on any of them. See SUITE-PLAN.md §3.1.
plugins { id 'java-library' }

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    // Declared from Maven Central rather than vendored from app/libs: this
    // module is new, and CI has network access. :app keeps its vendored jars
    // so its offline test path is unchanged.
    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
