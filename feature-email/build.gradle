// Email app: Compose and a local archive, sending through the mail app already on the device. No credentials stored and no OAuth, which is why it needs no verification. Receiving over IMAP is the half that stays blocked.
// Dependency rule (SUITE-PLAN.md 3.1): :core-* only. Never :app, :shell or another
// :feature-*. Enforced by contract test.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.feature.email'
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':core-suite')
    implementation project(':core-data')
    implementation project(':core-design')
    testImplementation 'junit:junit:4.13.2'
}
