// Files app: Browse files this app owns. No storage permission and no SAF -- AndroidX is disabled in this project, so it uses app-private storage directly.
// Dependency rule (SUITE-PLAN.md 3.1): :core-* only. Never :app, :shell or another
// :feature-*. Enforced by contract test -- that rule is what lets an app be excluded from
// a lite build without anything else noticing.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.feature.files'
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':core-suite')
    implementation project(':core-data')
    // The CSV contract lives in core-domain since Documents folded into Files.
    implementation project(':core-domain')
    implementation project(':core-design')
    testImplementation 'junit:junit:4.13.2'
}
