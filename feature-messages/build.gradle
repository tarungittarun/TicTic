// Messages app: SMS via the framework SmsManager and Telephony provider. Play restricts SMS/Call Log to apps whose core function is SMS, so this ships on the direct APK path; the Play listing needs the SMS declaration form.
// Dependency rule (SUITE-PLAN.md 3.1): :core-* only. Never :app, :shell or another
// :feature-*. Enforced by contract test.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.feature.messages'
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':core-suite')
    implementation project(':core-data')
    implementation project(':core-design')
    testImplementation 'junit:junit:4.13.2'
}
