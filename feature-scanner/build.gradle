// Scanner app: Assembles picked images into a PDF using the framework PdfDocument. Zero new dependencies -- CameraX and ML Kit would add about 50 MB and are what the lite flavour cannot carry.
// Dependency rule (SUITE-PLAN.md 3.1): :core-* only. Never :app, :shell or another
// :feature-*. Enforced by contract test.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.feature.scanner'
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':core-suite')
    implementation project(':core-data')
    implementation project(':core-design')
    testImplementation 'junit:junit:4.13.2'
}
