// Tasks app: checklists with due dates and priority. Offline, no permissions, no network.
// Distinct from Notes -- a note is prose, a task has a done flag and a due date, and the
// ordering rules that follow from those two fields are what this module actually contains.
// Dependency rule (SUITE-PLAN.md 3.1): :core-* only. Enforced by contract test.
plugins { id 'com.android.library' }

android {
    namespace 'app.space.feature.tasks'
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':core-suite')
    implementation project(':core-data')
    implementation project(':core-design')
    testImplementation 'junit:junit:4.13.2'
}
