plugins { id 'com.android.application' }
android {
    namespace 'app.space.notes'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'app.space.notes'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        minSdk 26
        targetSdk 34
        versionCode 66
        versionName '0.66.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        sideload {
            storeFile rootProject.file('signing/notes.p12')
            storeType 'pkcs12'
            storePassword 'myspace-sideload'
            keyAlias 'myspace'
            keyPassword 'myspace-sideload'
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation project(':notes-runtime')
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    // Implementation-only runtime UI/parser dependencies needed by owned viewer tests.
    androidTestImplementation 'androidx.recyclerview:recyclerview:1.3.2'
    androidTestImplementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

// Separate, opt-in evaluation harness. No corpus or harness ships in production.
if (project.hasProperty('moduleE2E')) {
    dependencies { androidTestImplementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0' }
    android.sourceSets.androidTest.java.srcDir(rootProject.file('app/benchmarks/java'))
    android.sourceSets.androidTest.assets.srcDir(rootProject.file('benchmarks/assets'))
}
