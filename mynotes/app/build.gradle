plugins { id 'com.android.application' }
android {
    namespace 'app.space.notes'
    compileSdk 34
    defaultConfig {
        applicationId 'app.space.notes'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        sideload {
            storeFile rootProject.file('signing/notes.p12')
            storeType 'pkcs12'
            storePassword 'myspace-sideload'
            keyAlias 'myspace'
            keyPassword 'myspace-sideload'
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation project(':notes-runtime')
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
