plugins { id 'com.android.library' }
android {
    namespace 'app.space.notes.runtime'
    compileSdk 35
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    api project(':notes-domain')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// Bundled CPU-only engines: app never calls a model downloader or Android cloud recognizer.
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
android {
    sourceSets { main.assets.srcDirs += "$buildDir/generated/voice-assets" }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
tasks.register('prepareOfflineSpeechModel', Exec) {
    def manifest = rootProject.file('runtime/src/main/assets/voice/model.json')
    def recipe = rootProject.file('tools/models/prepare_voice.py')
    def archive = file("$buildDir/generated/voice-assets/voice/speech-model.zip")
    inputs.files(manifest, recipe)
    outputs.file(archive)
    commandLine 'python3', recipe.absolutePath, '--manifest', manifest.absolutePath, '--output', archive.absolutePath
}
preBuild.dependsOn prepareOfflineSpeechModel

// Actual trained Whisper is bundled at build time; no runtime downloads or default swap.
android {
    ndkVersion '27.2.12479018'
    defaultConfig {
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main.assets.srcDirs += "$buildDir/generated/trained-whisper-assets" }
}
tasks.register('requireTrainedWhisperBundle') {
    doLast {
        if (!file("$buildDir/generated/trained-whisper-assets/voice/trained-whisper.bin").isFile()) {
            throw new GradleException('Missing verified trained Whisper bundle. Use the pinned Actions toolchain; never ship an untrained substitute.')
        }
    }
}
preBuild.dependsOn requireTrainedWhisperBundle

// Offline text layer for PDF search/copy on minSdk 26 as well as current devices.
dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
