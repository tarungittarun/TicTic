pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral(); maven { url "https://jitpack.io"; content { includeGroup "cz.adaptech.tesseract4android" } } }
}
rootProject.name = 'MyNotes'
include ':notes', ':notes-runtime', ':notes-domain'
project(':notes').projectDir = file('app')
project(':notes-runtime').projectDir = file('runtime')
project(':notes-domain').projectDir = file('domain')
