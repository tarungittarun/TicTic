pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
// Renamed from 'TicTic' — the product is now MySpace (SUITE-PLAN.md §4).
rootProject.name = 'MySpace'

include ':app'

// MySpace module graph. Dependency rule: :feature-* -> :core-* -> nothing,
// :shell -> :core-*, :app -> :shell + every :feature-*. Feature modules must
// never depend on each other; cross-app data flows only through :core-data
// interfaces. See SUITE-PLAN.md §3.1.
//
// :core-domain is pure JVM, no Android imports.
// :core-design is an Android library. It currently holds only TicIconView: the
//   other design classes (GlassPreset, AppSurfaceStyle, AppGlassDrawable,
//   GelMotion, AnalogClockView) all read theme/accent values via DataStore, so
//   they move only after :core-data exists. Extracting them earlier would make
//   :core-design depend on :app and invert the rule above.
// :core-data is the critical path: the design, platform and widget modules all
//   read theme/preference state, so none of them can finish moving until it
//   exists. Extraction is incremental — implementations move here group by group
//   while DataStore in :app stays a delegating facade, because DataStore has 452
//   references across 25 files and ~15 contract tests assert on its call sites.
// :core-platform, :core-widgets, :shell and :feature-clock follow.
include ':core-domain'
include ':core-design'
include ':core-data'

// :core-suite is the contract between an app and the chrome (SuiteApp, Screen,
//   ScreenHost, SettingsGroup). It is separate from :shell so that :feature-*
//   modules implement the contract without depending on the shell that renders
//   it — navigation is user-customisable, so the shell will change and apps must
//   not have to.
// :shell implements that contract: the registry, the three navigation modes and
//   the user's ordering/pinning/hiding (control layer L1).
include ':core-suite'
include ':shell'

// :feature-clock is the first app module and the first implementor of the
//   :core-suite contract. It holds the clock's own domain rules — alarm
//   recurrence, weekday labels, ringing-control settings and their migrations —
//   which is why it was created before any screen moved: a feature module may
//   never depend on :app, so everything a clock screen needs must already be
//   reachable from a :core-* or :feature-* module. DataStore in :app keeps
//   one-line delegates, so its ~140 call sites are untouched.
//   Every later app is a sibling: :feature-calculator, :feature-notes, ...
include ':feature-clock'
