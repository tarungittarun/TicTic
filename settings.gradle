pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
// Renamed from 'TicTic' — the product is now MySpace (SUITE-PLAN.md §4).
rootProject.name = 'MySpace'

include ':app'

// MySpace module graph. Dependency rule: :feature-* -> :core-* -> nothing,
// :shell -> :core-*, :app -> :shell + every :feature-*. Feature modules must
// never depend on each other; cross-app data flows only through :core-data
// interfaces. See SUITE-PLAN.md §3.1.
//
// :core-domain is pure JVM, no Android imports.
// :core-design is an Android library. It currently holds only TicIconView: the
//   other design classes (GlassPreset, AppSurfaceStyle, AppGlassDrawable,
//   GelMotion, AnalogClockView) all read theme/accent values via DataStore, so
//   they move only after :core-data exists. Extracting them earlier would make
//   :core-design depend on :app and invert the rule above.
// :core-data is the critical path: the design, platform and widget modules all
//   read theme/preference state, so none of them can finish moving until it
//   exists. Extraction is incremental — implementations move here group by group
//   while DataStore in :app stays a delegating facade, because DataStore has 452
//   references across 25 files and ~15 contract tests assert on its call sites.
// :core-platform, :core-widgets, :shell and :feature-clock follow.
include ':core-domain'
include ':core-design'
include ':core-data'

// :core-suite is the contract between an app and the chrome (SuiteApp, Screen,
//   ScreenHost, SettingsGroup). It is separate from :shell so that :feature-*
//   modules implement the contract without depending on the shell that renders
//   it — navigation is user-customisable, so the shell will change and apps must
//   not have to.
// :shell implements that contract: the registry, the three navigation modes and
//   the user's ordering/pinning/hiding (control layer L1).
include ':core-suite'
include ':shell'

// :core-platform reads OS state rather than the app's own storage. It starts with
//   the boot count, which the stopwatch needs to detect a reboot mid-run and which
//   was unreachable from :feature-clock while it sat package-private inside an :app
//   broadcast receiver. Permission preflight, time-change rescheduling and
//   power-saver state join it in the rest of step 1e.
include ':core-platform'

// :feature-clock is the first app module and the first implementor of the
//   :core-suite contract. It holds the clock's own domain rules — alarm
//   recurrence, weekday labels, ringing-control settings and their migrations —
//   which is why it was created before any screen moved: a feature module may
//   never depend on :app, so everything a clock screen needs must already be
//   reachable from a :core-* or :feature-* module. DataStore in :app keeps
//   one-line delegates, so its ~140 call sites are untouched.
//   Every later app is a sibling: :feature-calculator, :feature-notes, ...
include ':feature-clock'

// The calculator: the second app, and the proof that :core-suite carries more than one
// implementor without special cases. Offline, no permissions, no :app coupling.
include ':feature-calculator'

// The standalone calculator: the same engine and screen as :feature-calculator, hosted in
// its own application so it can be perfected as a single app on the owner's phone before
// it returns home to MySpace. Owner's instruction, 2026-10-25: build it separately, make it
// perfect, then integrate. It depends on the feature module rather than copying it, so the
// two can never drift apart while they live side by side.
include ':calc'

// Notes and tasks: offline, no permissions, no network, no :app coupling.
include ':feature-notes'

// Habit tracking: offline, no permissions, no network, no :app coupling.
include ':feature-habits'

// Expense tracking: offline, no permissions, no network, no :app coupling.
include ':feature-expenses'

// Calendar: local events, no calendar-provider access. Offline, no permissions, no network.
include ':feature-calendar'

// Tasks: checklists with due dates and priority. Offline, no permissions, no network.
include ':feature-tasks'

// Weather: Open-Meteo, no API key, no location permission.
include ':feature-weather'

// Recorder: voice notes in app-private storage.
include ':feature-recorder'

// Files: browse what this app owns, no storage permission.
include ':feature-files'

// Documents: plain text and CSV spreadsheets.
include ':feature-documents'

// Messages: SMS via the framework provider and SmsManager.
include ':feature-messages'

// Music: the user's own files and stream URLs they add.
include ':feature-music'

// Scanner: picked images assembled into a PDF, no new dependencies.
include ':feature-scanner'

// Email: compose and a local archive, sending through the device's mail app.
include ':feature-email'

// Standalone-first Notes rebuild; no existing MySpace feature consumes this runtime.
include ':notes-domain'
include ':notes-runtime'
include ':notes'
